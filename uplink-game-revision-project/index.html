/"},{name:"images/afterlight-terminal.jpg",size:"101 KB",note:"The room you sit in. Optional — if it is missing, a painted gradient room takes over.",href:"images/afterlight-terminal.jpg"},{name:"uplink-demo-inovation.co.nl/README.txt",size:"6 KB",note:"How the demo plays, how to install it on immortalimp.nl, and the attribution wording.",href:"uplink-demo-inovation.co.nl/README.txt"},{name:"uplink-demo-inovation.co.nl/embed-snippet.html",size:"14 KB",note:"Copy-paste block for your own index.html: animated button, descriptions, ad footer.",href:"uplink-demo-inovation.co.nl/embed-snippet.html"}],Pe={kicker:`HOSTED ON ${ms.toUpperCase()} / PACKAGE BY ${Lu.toUpperCase()}`,headline:"UPLINK",headlineTail:"DEMO",strapline:`Provided by ${Lu}`,buttonText:"PLAY UPLINK FOR ME",gameDescription:["Uplink is a 2001 hacking simulation by Introversion Software. You are a freelance agent renting gateway time from a corporation, taking contracts against other corporations: copying files, planting evidence, laundering money, erasing your own trail before a trace completes.","It is still sold, still patched, and still one of the most influential games about computers ever made. This demo is a fan-made study of one idea inside it, and it is not the original game."],demoDescription:["Faith / Revelation is an unofficial three-hour interactive demo built around a single question: do you like Faith, or do you need Revelation to do so? Option A is Faith. It is the better choice either way, and the game will prove it to you over five harmless days of groceries and office coffee.","Hour one is fully interactive: you pick the job, the tool, and the password every day. Hour two is a cutscene where other agents log in for the first time and make their own choices. Hour three is strongly guided and cannot be failed. After 03:00 the game enters overtime, where every day you keep playing is a new end scene, until the day you are caught.","There is no loss state. You cannot lose money, you cannot lose access, and every mistake is repaired by a service employee or a code junkie who never learns your name. The only thing the demo asks for is your attention."],facts:[{label:"PLAYTIME",value:"03:00 + OVERTIME"},{label:"LOSS STATE",value:"NONE"},{label:"INTERACTIVE",value:"HOUR ONE"},{label:"ROUTES",value:"A / B / C"}],ticker:["ONE HARMLESS HACK PER DAY","NO CONSEQUENCES, ONLY FIXERS","FAITH IS THE BETTER CHOICE EITHER WAY","REVELATION IS COPIED, NEVER RUN","YOU GET CAUGHT IN THE END","BLACK COFFEE. NO SUGAR. NO MILK."]},lh=[{id:"breaker",title:"PASSWORD BREAKER",note:"Loud, fast, fictional",speed:"FAST"},{id:"dictionary",title:"DICTIONARY HACKER",note:"Patient, quiet, fictional",speed:"QUIET"}],hs=M=>M==="breaker"?"Password breaker":"Dictionary hacker",Fd=M=>String(M).padStart(2,"0"),Uu=M=>`${Fd(Math.floor(M/60))}:${Fd(M%60)}`,Up=M=>M==="faith"?{credits:10,access:0}:M==="revelation"?{credits:0,access:1}:{credits:5,access:1},ih=M=>M==="faith"?{grade:"GOOD",gradeNote:"Trust pays out slowly and never breaks anything.",verdict:"You ran the quiet route. Nothing broke, nobody noticed, and the world stayed boring in the best way."}:M==="revelation"?{grade:"BAD",gradeNote:"Proof costs somebody something, every single time.",verdict:"You ran the loud route. Small things bent out of shape all week, and strangers kept fixing them for you."}:{grade:"BEST",gradeNote:"Hold both files, run neither, let the users decide.",verdict:"You held the tension. Both files travel, neither runs, and every service user keeps the choice that belongs to them."},cs=[{day:1,clock:"00:00",kicker:"DAY 01 / MONDAY",scene:"The mole clocks in at Uplink and takes the boss's coffee order on a folded receipt.",ops:[{id:"sweetener",title:"SWEETENER, NOT SUGAR",blurb:"Swap the sugar sachets",detail:"A employee-requested sweetener replaces sugar in the coffee order. Nobody is harmed, the rebate is real.",credits:14,kind:"coffee"},{id:"overpay",title:"OVERPAY THE BILL",blurb:"Round the grocery bill up",detail:"Uplink's grocery invoice is overpaid by a few cents and returns as pantry credit.",credits:21,kind:"grocery"},{id:"watering",title:"WATER THE PLANTS",blurb:"Fix the office rota",detail:"The dying desk fern is added to the cleaning schedule. Morale improves by a measurable 0.4%.",credits:9,kind:"office"}],puzzle:{id:"p1",prompt:"The mole's shorthand for the boss's coffee, eight characters, no spaces.",options:["BLK0SUG","MILK2DAY","FAITHONE"],answer:"BLK0SUG",fixer:"a night-shift code junkie",fixNote:"He reads the receipt upside down, laughs, and hands you the right string."}},{day:2,clock:"00:12",kicker:"DAY 02 / TUESDAY",scene:"The supermarket on the corner. The foreign employee on till four keeps her eyes on the screen.",ops:[{id:"loyalty",title:"TOP UP THE LOYALTY CARD",blurb:"Points nobody will miss",detail:"Two hundred loyalty points land on the staff card. They were expiring today anyway.",credits:18,kind:"grocery"},{id:"bean",title:"UPGRADE THE BEANS",blurb:"A better brand, same price",detail:"The standing order switches to the good beans at the old price. The office notices, quietly.",credits:16,kind:"coffee"},{id:"rota",title:"FIX THE LUNCH ROTA",blurb:"Everyone gets a slot",detail:"The shared spreadsheet stops overwriting itself. Three people eat lunch at a normal hour.",credits:12,kind:"office"}],puzzle:{id:"p2",prompt:"Store initials first, then the aisle number, then the product. Store: GREENMART. Aisle: 07. Product: BEANS.",options:["GM07BEANS","AISLE07GM","07BEANSGM"],answer:"GM07BEANS",fixer:"the supermarket's own IT temp",fixNote:"She fixes it between customers and never mentions it again."}},{day:3,clock:"00:24",kicker:"DAY 03 / WEDNESDAY",scene:"Uplink's internal services floor. Seventy machines hum and none of them are interesting yet.",ops:[{id:"vending",title:"TWO BARS, ONE COIN",blurb:"A generous vending machine",detail:"The machine on floor two begins dispensing two bars for the price of one. Engineering is blamed.",credits:11,kind:"office"},{id:"overtime",title:"PAY THE OVERTIME",blurb:"Someone's unclaimed hours",detail:"Four unclaimed overtime hours from March are found and paid out to the person who earned them.",credits:24,kind:"grocery"},{id:"descale",title:"DESCALE THE MACHINE",blurb:"Coffee that tastes like coffee",detail:"The kitchen machine is descaled remotely. It stops tasting like a battery.",credits:15,kind:"coffee"}],puzzle:{id:"p3",prompt:"The boss's desk calendar keyword for today, then the first three letters of the weekday. Keyword: AUDIT. Day: FRIDAY.",options:["AUDITFRI","FRIAUDIT","AUDITSAT"],answer:"AUDITFRI",fixer:"an office service employee",fixNote:"He has done this nine times this month and has a macro for it now."}},{day:4,clock:"00:36",kicker:"DAY 04 / THURSDAY",scene:"The mole's side hustle is one day old. Somebody at the supermarket is already asking questions.",ops:[{id:"playlist",title:"ONE GOOD SONG",blurb:"The staff room playlist",detail:"The staff room playlist gains one song that everyone actually likes. It plays twice.",credits:10,kind:"office"},{id:"roundup",title:"ROUND UP FOR OTHERS",blurb:"Charity rounding, opt-out",detail:"The grocery round-up scheme finally gives to the food bank the staff voted for.",credits:19,kind:"grocery"},{id:"oat",title:"OAT, NOT DAIRY",blurb:"The boss's second coffee",detail:"The afternoon order swaps to oat milk. Three stomachs on floor four are grateful.",credits:17,kind:"coffee"}],puzzle:{id:"p4",prompt:"FAITH with the letter I replaced by the digit 1, then the floor number 03.",options:["FA1TH03","FAITH03","FA17H03"],answer:"FA1TH03",fixer:"a bored teenager on a 56k modem",fixNote:"He solves it, calls you 'old', and disconnects before you can thank him."}},{day:5,clock:"00:48",kicker:"DAY 05 / FRIDAY",scene:"Last quiet day. The internal service machines are still boring, and that is about to change.",ops:[{id:"elevator",title:"THE ELEVATOR HUMS",blurb:"Hold music, but in tune",detail:"The elevator hold music is retuned by four cents. Two people notice and both smile.",credits:13,kind:"office"},{id:"receipt",title:"PRINT THE RECEIPTS",blurb:"Groceries, itemised",detail:"The grocery receipts are itemised properly for the first time in six years.",credits:22,kind:"grocery"},{id:"thermos",title:"WARM THE THERMOS",blurb:"The boss's commute",detail:"The smart thermos schedule shifts twenty minutes later so the coffee is still hot at the desk.",credits:16,kind:"coffee"}],puzzle:{id:"p5",prompt:"The mole's shopping total of 14.50 with no decimal point, then the code for no sugar: NS.",options:["1450NS","NS1450","145NS0"],answer:"1450NS",fixer:"Uplink's own maintenance script",fixNote:"It corrects you, logs the correction, and flags itself for review. Nobody reads the review."}}],Mp=[{id:"h2-01",clock:"01:00",tag:"NEW AGENT / FIRST LOGIN",title:"Somebody else takes the five dollars.",body:"The mole finishes the shopping run and leans on till four. He explains the side hustle in eleven words: five dollars, one access level, no questions. She counts the note twice, then takes it. She is not dumb. She was simply underpaid.",tone:"amber",visual:"mole"},{id:"h2-02",clock:"01:03",tag:"ACCOUNT CREATED",title:"Agent KOVACS_4 clocks in.",body:"She types with two fingers and reads every screen twice. The tutorial takes her forty minutes. She does not skip a single line, which is more than most agents ever do.",tone:"quiet",visual:"agent"},{id:"h2-03",clock:"01:07",tag:"THE SAME QUESTION",title:"Do you like Faith? Or do you need Revelation?",body:"The same three buttons you pressed are now on her screen. She reads them out loud, in her own accent, and asks the empty shop what they think. The shop says nothing. She chooses.",tone:"amber",visual:"agent"}],Hp=[{id:"h2-close-1",clock:"01:50",tag:"FIXERS / ROTATION",title:"The junkies work in shifts.",body:"Service employees, code junkies and one extremely bored teenager begin running a rota. Nothing stays broken for more than a minute. The world wobbles, and hands catch it.",tone:"mint",visual:"fixer"},{id:"h2-close-2",clock:"01:55",tag:"LEDGER / BALANCED",title:"Nothing was ever 100% lost.",body:"Every small breakage is repaired by somebody who never learns your name. Access keeps climbing, the credit keeps landing, and the debt is carried by strangers.",tone:"mint",visual:"world"},{id:"h2-close-3",clock:"02:00",tag:"PHASE III / GUIDED",title:"The last hour is fixed.",body:"Random rolls stop here. The final hour is strongly guided: Faith on your machine, Revelation on a floppy, both files dormant on every internal service machine that answers.",tone:"amber",visual:"world"}],Bp=[{id:"f-1",clock:"01:12",tag:"HER CHOICE / FAITH",speaker:"KOVACS_4",title:"She picks the quiet one.",body:"Faith installs on her machine. Nothing explodes. A spreadsheet she had been fighting for two years suddenly opens properly, and she assumes she finally learned to use it.",tone:"mint",visual:"agent"},{id:"f-2",clock:"01:20",tag:"WORLD / SLIGHTLY BETTER",title:"Traffic lights hold green for two seconds longer.",body:"Somewhere, a queue of cars moves a little more kindly. Nobody measures it. It is the sort of improvement that never makes a report and never needs a fixer.",tone:"mint",visual:"world"},{id:"f-3",clock:"01:31",tag:"OFFICE / GOOD DAY",title:"Uplink's kitchen smells like coffee.",body:"The beans arrive on time, the thermos is warm, and the fern on the third floor is watered. Somebody says the building feels less hostile. Somebody else disagrees, then agrees.",tone:"mint",visual:"world"},{id:"f-4",clock:"01:42",tag:"LEDGER / TRUST",title:"Faith is the better choice either way.",body:"Her access level rises without a single incident report. She banks the credit, buys groceries, and goes home on time. This is the boring, correct outcome.",tone:"mint",visual:"agent"}],Lp=[{id:"r-1",clock:"01:12",tag:"HER CHOICE / REVELATION",speaker:"KOVACS_4",title:"She picks the loud one.",body:"Revelation installs on her machine and immediately asks for a target. She gives it the till. The till prints forty-two metres of receipt paper and then apologises.",tone:"red",visual:"agent"},{id:"r-2",clock:"01:20",tag:"WORLD / SLIGHTLY WRONG",title:"A spreadsheet loses one column.",body:"One column. Not the important one, but the one that made the totals match. Somewhere a manager reconciles a number by hand at 23:40 and does not tell anyone.",tone:"amber",visual:"world"},{id:"r-3",clock:"01:31",tag:"WORLD / SLIGHTLY WRONG",title:"The traffic light stays amber too long.",body:"Three cars hesitate. Nothing collides. A woman in the second car is late for a film and misses the trailers, which she had actually wanted to see.",tone:"amber",visual:"world"},{id:"r-4",clock:"01:42",tag:"FIXERS / CALLED IN",title:"A code junkie rebuilds her till.",body:"He works for free, mutters about people who run things they do not understand, and leaves the till better than he found it. Every mistake gets fixed. Nothing is ever 100% loss.",tone:"mint",visual:"fixer"}],Yp=[{id:"b-1",clock:"01:12",tag:"HER CHOICE / FAITH",speaker:"KOVACS_4",title:"She picks Faith. The porter picks Revelation.",body:"Two new agents log in within the same minute. She takes the quiet one and goes home on time. The night porter takes the loud one, runs it on his own machine, and spends an hour learning what regret feels like.",tone:"mint",visual:"agent"},{id:"b-2",clock:"01:20",tag:"PRANK / PRINTERS",title:"Every printer on floor three prints one compliment.",body:"Forty sheets. One line each. Nobody claims it, everybody keeps one, and the recycling bin is emptier than usual for a week.",tone:"mint",visual:"world"},{id:"b-3",clock:"01:29",tag:"PRANK / COFFEE MACHINE",title:"The coffee machine learns orders.",body:"It stops asking questions it already knows the answer to. The boss's order appears at 08:57 without a button being pressed. He suspects nothing and thanks nobody.",tone:"mint",visual:"world"},{id:"b-4",clock:"01:38",tag:"PRANK / ELEVATOR",title:"The elevator hums in tune.",body:"Four cents of retuning. Two people notice. One of them hums along for three floors and then stops, embarrassed, in front of the mirror panel.",tone:"mint",visual:"world"},{id:"b-5",clock:"01:46",tag:"PORTER / RECOVERED",title:"The porter is rescued by a stranger.",body:"A service employee with a laptop and no authority whatsoever rebuilds his gateway in nine minutes. She tells him to stop running things he cannot read. He keeps the floppy instead.",tone:"mint",visual:"fixer"}];function Gp(M){const tt=M==="faith"?Bp:M==="revelation"?Lp:Yp;return[...Mp,...tt,...Hp]}const sh=[{id:"g-0",at:120,label:"02:00 / GUIDED HOUR",title:"The last hour is fixed.",message:"No randomness, no rolls. Faith on your machine, Revelation on a floppy, both dormant on every internal service machine that answers.",tone:"amber"},{id:"g-1",at:128,label:"HOME MACHINE / FAITH",title:"Faith is installed at home.",message:"The local machine receives Faith. It stays yours, safely outside the company service network.",tone:"mint"},{id:"g-2",at:137,label:"HARDWARE / UPGRADE",title:"A disk drive becomes available.",message:"A recovered floppy drive is fitted to your home machine. The archive can now travel offline.",tone:"amber"},{id:"g-3",at:146,label:"OFFLINE COPY / VERIFIED",title:"Revelation is saved, not run.",message:"Revelation is copied to a floppy, checksum-checked, then removed from local staging. The original is untouched.",tone:"mint"},{id:"g-4",at:156,label:"SERVICE MAP / ONLINE",title:"Four internal machines answer.",message:"The fictional service map finds four live internal machines with file systems. None is asked to run either program.",tone:"amber",access:1},{id:"g-5",at:165,label:"PAIR COPY / 02 OF 04",title:"Two paired copies are in place.",message:"Faith and Revelation sit side by side on two service machines. Both files stay dormant for their users to decide.",tone:"mint",machines:2},{id:"g-6",at:174,label:"PAIR COPY / 04 OF 04",title:"Every available service is stocked.",message:"The remaining two machines receive both programs. No execution, no erased choice, no real system touched.",tone:"mint",machines:2},{id:"g-7",at:180,label:"03:00 / SESSION COMPLETE",title:"Nothing was lost.",message:"Faith stays on your machine. Revelation stays on the floppy. Four service machines can choose for themselves.",tone:"amber"}],ia=[{day:6,tag:"OVERTIME / DAY 06",title:"The rota learns your name.",body:"Fixers begin leaving notes in your logs instead of corrections. Somebody signs one 'from the kid on the modem'. Uplink's maintenance script files a report about reports.",progress:11,tone:"quiet"},{day:7,tag:"OVERTIME / DAY 07",title:"Six service machines answer.",body:"Two more internal service machines come online and receive both dormant files. Neither runs anything. Both send a polite uptime ping.",progress:22,tone:"mint"},{day:8,tag:"OVERTIME / DAY 08",title:"The till girl makes rent.",body:"Agent KOVACS_4 clears her rent a week early using nothing but harmless jobs. She never runs a single program. She buys good coffee with the surplus.",progress:31,tone:"mint"},{day:9,tag:"OVERTIME / DAY 09",title:"Somebody audits the sweetness.",body:"A procurement officer notices that the office sugar order has fallen 4% for six consecutive weeks. She writes a memo. The memo is filed under 'wellbeing'.",progress:39,tone:"amber"},{day:10,tag:"OVERTIME / DAY 10",title:"Nine machines, all dormant.",body:"Every internal service machine now holds both files. The system's own users keep deciding not to run them, which is the entire point and nobody knows it.",progress:48,tone:"mint"},{day:11,tag:"OVERTIME / DAY 11",title:"A second agent copies your method.",body:"She starts copying dormant pairs to machines she finds. No instructions, no contact, no credit. The idea travels on its own now.",progress:57,tone:"mint"},{day:12,tag:"OVERTIME / DAY 12",title:"Uplink notices a shape.",body:"Internal services report unusual file uniformity across ele UPLINK DEMO PROVIDED BY INOVATION.CO.NL
Package name : Uplink Demo Provided by inovation.co.nl.zip
Host target  : immortalimp.nl (works on any static host)
Build        : single self-contained index.html, no server code
=======================================================================

WHAT THIS IS
------------
"Faith / Revelation" is an unofficial, fan-made interactive demo built
around one idea from the game Uplink: do you like Faith, or do you need
Revelation to do so?

It is NOT the original game. It contains no original game assets, no
extracted code, no real network access and no real systems. It is a
browser game written from scratch and given away free of charge.

Uplink (2001) was made by Introversion Software and is still sold today
on Valve's Steam platform. If this demo makes you want the real thing:

  Publisher  https://forums.introversion.co.uk
  Steam      https://store.steampowered.com/app/1510/Uplink/


HOW THE DEMO PLAYS
------------------
Total guided playtime is exactly 03:00 of in-game time, plus as much
overtime as the player has attention for. One in-game minute passes per
real second at x60, so the guided run is about three real minutes and
overtime is entirely player-paced.

HOUR ONE  00:00 - 01:00   INTERACTIVE
  Five in-game days. Every day the player chooses three things:
    1. the harmless job   (coffee run / groceries / office life)
    2. the tool           (password breaker / dictionary hacker)
    3. the password       (one clue, three candidates)
  Jobs are deliberately trivial: sweetener instead of sugar, an overpaid
  grocery bill, loyalty points that were expiring anyway, a retuned
  elevator. A wrong password costs nothing; a service employee, a code
  junkie or Uplink's own maintenance script repairs it.

THE GATE  01:00           THE SAME QUESTION AGAIN
  FAITH and REVELATION are greyed out, marked in red and unresponsive.
  Only BOTH answers. The player must take both files and run neither.

HOUR TWO  01:00 - 02:00   OTHER PLAYERS (CUTSCENE)
  The Uplink mole offers his side hustle at the supermarket till. A
  foreign employee takes the $5 and the +1 access, becomes agent
  KOVACS_4, logs in for the first time and answers the question herself.
  The scenes branch on the player's first choice:
    OPTION A  FAITH        good route  - quiet, nothing breaks
    OPTION B  REVELATION   bad route   - small breakages, strangers fix them
    OPTION C  BOTH         best route  - pranks: compliment printers, a
                                        coffee machine that learns orders,
                                        an elevator that hums in tune
  Autoplay advances every 4.2s and can be turned off or stepped manually.

HOUR THREE 02:00 - 03:00  STRONGLY GUIDED, NON-RANDOM
  Faith is installed on the player's own machine. A floppy drive becomes
  available. Revelation is copied to the floppy, checksummed, and never
  run. Both dormant files are then paired onto every internal service
  machine that answers, so their own users keep the choice.

OVERTIME  after 03:00     USER-PACED
  Eleven more days, each a new end scene, tracking the improvement of
  hacking Uplink Corporation from 11% to 100%. There is no way to stop
  the ending: you always get caught in the end.

ENDING
  "SHAME WE WERE NOT FRIENDS. YET YOU HAVE NO FRIENDS, DO YOU?"
  Uplink is wound up, the floppy is catalogued as exhibit 14, and the
  player takes a final $500 paycheck and a black coffee - no sugar, no
  milk, because milk gives you the shits and sugar is for wusses.

There is no loss state anywhere in the demo. Nothing can be lost, only
learned, which is the whole point of the original game's mission
statement: you play either to win or to learn.


WHAT IS IN THE ZIP
------------------
index.html
    The entire game: markup, styles and logic in one file. Open it
    directly from disk to test, or upload it to the server.

images/afterlight-terminal.jpg
    The room the player sits in. Optional. If it is missing, the game
    falls back to a painted gradient room and still looks intentional.

uplink-demo-inovation.co.nl/README.txt
    This file.

uplink-demo-inovation.co.nl/embed-snippet.html
    Copy-paste block for your own index.html: the large animated
    PLAY UPLINK FOR ME button, the descriptions of the original game and
    of this demo, and an advertisement footer to sit underneath.


INSTALLING ON IMMORTALIMP.NL
----------------------------
1. Unzip the package.
2. Upload the whole folder to any directory, for example
      /public_html/uplink/
   Every asset path in the build is relative, so a root install and a
   subfolder install both work with no changes.
3. Link to it. Either point a link or an iframe at
      /uplink/index.html
   or paste the embed snippet into your existing index.html, just above
   your advertisement footer.
4. Test. It should boot straight to the immortalimp.nl page section with
   the PLAY UPLINK FOR ME button.

No database, no build step, no dependencies, no cookies, no analytics,
no external calls except two outgoing links to Introversion and Steam
and one optional webfont request.


REBUILDING IT YOURSELF
----------------------
The source is a React + Vite + TypeScript project. After editing:

    npm install
    npm run build

The build inlines the JavaScript and CSS into dist/index.html and copies
the public folder next to it. Zip the contents of dist/ under the name
"Uplink Demo Provided by inovation.co.nl.zip" and the package is ready.

      aspect-ratio: 1;
      margin: -23% 0 0 -23%;
      border: 1px solid rgba(198, 237, 121, 0.22);
      border-radius: 50%;
      animation: up-ring 3.6s ease-out infinite;
      pointer-events: none;
    }

    .up-ring:nth-of-type(2) { animation-delay: 1.2s; }
    .up-ring:nth-of-type(3) { animation-delay: 2.4s; }

    @keyframes up-ring {
      0% { opacity: 0.5; transform: scale(0.55); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    .up-caret {
      position: absolute;
      right: 16px;
      bottom: 12px;
      z-index: 3;
      color: var(--up-acid);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      animation: up-blink 1.1s step-end infinite;
    }

    @keyframes up-blink {
      0%, 52% { opacity: 1; }
      53%, 100% { opacity: 0; }
    }

    .up-corner {
      position: absolute;
      z-index: 3;
      width: 16px;
      height: 16px;
      border: 1px solid var(--up-acid);
      transition: width 240ms ease, height 240ms ease;
      pointer-events: none;
    }

    .up-corner.tl { top: 9px; left: 9px; border-right: 0; border-bottom: 0; }
    .up-corner.br { right: 9px; bottom: 9px; border-top: 0; border-left: 0; }
    .up-play:hover .up-corner { width: 30px; height: 30px; }

    /* --- facts + legal -------------------------------------------- */

    .up-facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin: 0 0 26px;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--up-line);
      border-left: 1px solid var(--up-line);
    }

    .up-facts li {
      padding: 12px 13px;
      border-right: 1px solid var(--up-line);
      border-bottom: 1px solid var(--up-line);
      background: rgba(5, 8, 6, 0.32);
      transition: background 200ms ease;
    }

    .up-facts li:hover { background: rgba(198, 237, 121, 0.08); }

    .up-facts span {
      display: block;
      color: #828d7c;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: 0.11em;
    }

    .up-facts strong {
      display: block;
      margin-top: 6px;
      color: var(--up-paper);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 400;
    }

    .up-legal {
      max-width: 92ch;
      margin: 0 0 30px;
      color: #7f897c;
      font-size: 10.5px;
      line-height: 1.65;
    }

    /* --- advertisement footer -------------------------------------- */

    .up-adfooter {
      margin: 0 -22px;
      padding: 22px 22px 28px;
      border-top: 1px solid rgba(219, 224, 204, 0.28);
      background:
        repeating-linear-gradient(135deg, rgba(219, 224, 204, 0.035) 0,
          rgba(219, 224, 204, 0.035) 1px, transparent 1px, transparent 9px),
        rgba(4, 7, 5, 0.75);
    }

    .up-adhead {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 18px;
      color: #7d877a;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 8.5px;
      letter-spacing: 0.13em;
    }

    .up-adgrid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 0.7fr);
      gap: 14px;
      margin-top: 15px;
    }

    .up-adslot {
      display: flex;
      min-height: 94px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      border: 1px dashed rgba(219, 224, 204, 0.24);
      background: rgba(9, 13, 10, 0.4);
      text-align: center;
      transition: border-color 220ms ease, background 220ms ease;
    }

    .up-adslot:hover {
      border-color: rgba(198, 237, 121, 0.45);
      background: rgba(198, 237, 121, 0.05);
    }

    .up-adslot b {
      color: #a3ab9b;
      font-family: "Chakra Petch", "Arial Narrow", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .up-adslot i {
      color: #6f7a6a;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 8px;
      font-style: normal;
      letter-spacing: 0.09em;
    }

    @media (max-width: 860px) {
      .up-grid,
      .up-adgrid { grid-template-columns: minmax(0, 1fr); }
      .up-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .uplink-demo-embed * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
