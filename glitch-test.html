            <script>
            // --- Hide U.I. Tabified Button Logic ---
            document.addEventListener('DOMContentLoaded', function() {
                const uiTab = document.getElementById('ui-toggle-tab');
                const toggleBtn = document.getElementById('toggle-ui-btn');
                // Elements to hide/show
                const uiElements = [
                    document.getElementById('glitch-top-bar'),
                    document.getElementById('glitch-bottom-bar'),
                    document.getElementById('effect-toggle-column'),
                    document.getElementById('engine-control-dock')
                ];
                let uiHidden = false;

                function setUIHidden(hidden) {
                    uiHidden = hidden;
                    uiElements.forEach(el => { if (el) el.style.display = hidden ? 'none' : ''; });
                    if (hidden) {
                        uiTab.classList.add('hide');
                        setTimeout(() => {
                            uiTab.classList.remove('hide');
                            uiTab.classList.add('show');
                        }, 200);
                    } else {
                        uiTab.classList.remove('hide');
                        uiTab.classList.remove('show');
                    }
                    toggleBtn.textContent = hidden ? 'SHOW CONTROL U.I.' : 'HIDE CONTROL U.I.';
                }

                toggleBtn.addEventListener('click', function(e) {
                    setUIHidden(!uiHidden);
                    e.stopPropagation();
                });

                // Show tab on edge hover/tap
                let tabTimeout = null;
                function showTab() {
                    if (!uiHidden) return;
                    uiTab.classList.add('show');
                    if (tabTimeout) clearTimeout(tabTimeout);
                    tabTimeout = setTimeout(() => {
                        if (uiHidden) uiTab.classList.remove('show');
                    }, 2000);
                }
                document.addEventListener('mousemove', function(e) {
                    if (uiHidden && e.clientX > window.innerWidth - 24) {
                        showTab();
                    }
                });
                uiTab.addEventListener('mouseenter', function() {
                    if (uiHidden) uiTab.classList.add('show');
                });
                uiTab.addEventListener('mouseleave', function() {
                    if (uiHidden) uiTab.classList.remove('show');
                });
                // Touch support
                document.addEventListener('touchstart', function(e) {
                    if (!uiHidden) return;
                    const touch = e.touches[0];
                    if (touch && touch.clientX > window.innerWidth - 24) {
                        showTab();
                    }
                });
                // Always start visible
                setUIHidden(false);
            });
            </script>
    <script>


        // --- Main DOMContentLoaded Handler ---
        document.addEventListener('DOMContentLoaded', function() {
            // --- Freeze Frame Button Handler ---
            const freezeFrameBtn = document.getElementById('freeze-frame-btn');
            if (freezeFrameBtn) {
                freezeFrameBtn.addEventListener('click', function() {
                    html2canvas(document.body, {backgroundColor: null, useCORS: true}).then(function(canvas) {
                        const link = document.createElement('a');
                        link.download = 'freeze-frame.png';
                        link.href = canvas.toDataURL('image/png');
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    });
                });
            }

            // --- Glitch Speed and Opacity Slider Handlers ---
            const glitchSpeedSlider = document.getElementById('glitch-speed-slider');
            const nullSpeedBtn = document.getElementById('null-speed-btn');
            const glitchOpacitySlider = document.getElementById('glitch-opacity-slider');
            const nullOpacityBtn = document.getElementById('null-opacity-btn');

            // --- Speed Slider ---
            if (glitchSpeedSlider) {
                function setGlitchSpeed(val) {
                    const speed = Math.max(0.01, Math.min(3, parseFloat(val)));
                    window.__glitchSpeed = speed;
                    glitchSpeedSlider.value = speed;
                }

                setGlitchSpeed(1.5); // Initial value

                glitchSpeedSlider.addEventListener('input', () => setGlitchSpeed(glitchSpeedSlider.value));

                if (nullSpeedBtn) {
                    nullSpeedBtn.addEventListener('click', () => {
                        const currentVal = parseFloat(glitchSpeedSlider.value);
                        if (currentVal > 0.01) {
                            setGlitchSpeed(0.01);
                            nullSpeedBtn.textContent = 'MAX';
                        } else {
                            setGlitchSpeed(3);
                            nullSpeedBtn.textContent = '0';
                        }
                    });
                }
            }

            // --- Opacity Slider ---
            if (glitchOpacitySlider) {
                function setGlitchOpacity(val) {
                    const opacity = Math.max(0, Math.min(1, parseFloat(val)));
                    if (typeof window.__setGlitchMasterOpacity === 'function') {
                        window.__setGlitchMasterOpacity(opacity);
                    }
                    glitchOpacitySlider.value = opacity;
                }

                setGlitchOpacity(0.5); // Initial value

                glitchOpacitySlider.addEventListener('input', () => setGlitchOpacity(glitchOpacitySlider.value));

                if (nullOpacityBtn) {
                    nullOpacityBtn.addEventListener('click', () => {
                        const currentVal = parseFloat(glitchOpacitySlider.value);
                        if (currentVal > 0) {
                            setGlitchOpacity(0);
                            nullOpacityBtn.textContent = 'MAX';
                        } else {
                            setGlitchOpacity(1);
                            nullOpacityBtn.textContent = '0';
                        }
                    });
                }
            }

        });


        function resizeCanvases() {
            const dpr = window.devicePixelRatio || 1;
            const bg = document.getElementById('hue-bg');
            const glitch = document.getElementById('glitchCanvas');
            bg.width = window.innerWidth * dpr;
            bg.height = window.innerHeight * dpr;
            bg.style.width = window.innerWidth + 'px';
            bg.style.height = window.innerHeight + 'px';
            glitch.width = window.innerWidth * dpr;
            glitch.height = window.innerHeight * dpr;
            glitch.style.width = window.innerWidth + 'px';
            glitch.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resizeCanvases);
        window.addEventListener('orientationchange', resizeCanvases);
        resizeCanvases();

        // Animate the background hue canvas
        const bgCanvas = document.getElementById('hue-bg');
        const bgCtx = bgCanvas.getContext('2d');
        let hue = 0, sat = 100, light = 50;
        let hueSpeed = 360 / (30 * 60); // 360 degrees over 30 seconds at 60fps
        let satSpeed = Math.PI * 2 / (30 * 60); // full sine wave over 30 seconds
        let lightSpeed = Math.PI * 2 / (30 * 60); // full sine wave over 30 seconds
        let satPhase = 0;
        let lightPhase = 0;
        let hueBGActive = true;
        function animateHueBG() {
            if (!hueBGActive) return;
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            hue = (hue + hueSpeed) % 360;
            satPhase += satSpeed;
            lightPhase += lightSpeed;
            sat = 50 + 50 * Math.sin(satPhase);
            light = 50 + 50 * Math.sin(lightPhase);
            bgCtx.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
            bgCtx.fillRect(0, 0, w, h);
            requestAnimationFrame(animateHueBG);
        }
        animateHueBG();

        // Custom background canvas logic
        const customBGCanvas = document.getElementById('bg-custom');
        const customBGCtx = customBGCanvas.getContext('2d');
        function resizeCustomBG() {
            const dpr = window.devicePixelRatio || 1;
            customBGCanvas.width = window.innerWidth * dpr;
            customBGCanvas.height = window.innerHeight * dpr;
            customBGCanvas.style.width = window.innerWidth + 'px';
            customBGCanvas.style.height = window.innerHeight + 'px';
        }
        resizeCustomBG();
        window.addEventListener('resize', resizeCustomBG);
        window.addEventListener('orientationchange', resizeCustomBG);

        // User image cycling logic (smooth crossfade, no hard cuts)
        let userBGImages = [];
        let userBGSelected = [];
        let userBGTimer = null;
        let userBGPanelOpen = false;
        // Configurable durations (ms)
        const USER_BG_FADE_DURATION = 10000; // 10s fade
        const USER_BG_DISPLAY_DURATION = 20000; // 20s fully visible
        const USER_BG_TOTAL_DURATION = USER_BG_FADE_DURATION + USER_BG_DISPLAY_DURATION; // 30s per image


        function startUserBGCycle() {
            if (userBGTimer) cancelAnimationFrame(userBGTimer);
            // Always show custom background canvas when cycling images
            customBGCanvas.style.display = 'block';
            document.getElementById('hue-bg').style.display = 'none';
            hueBGActive = false;
            let startTime = performance.now();
            function cycle(now) {
                if (userBGSelected.length === 0) return;
                const totalImages = userBGSelected.length;
                const totalCycle = USER_BG_TOTAL_DURATION * totalImages;
                const elapsed = (now - startTime) % totalCycle;
                const currIdx = Math.floor(elapsed / USER_BG_TOTAL_DURATION) % totalImages;
                const nextIdx = (currIdx + 1) % totalImages;
                const phase = elapsed % USER_BG_TOTAL_DURATION;
                customBGCtx.clearRect(0, 0, customBGCanvas.width, customBGCanvas.height);
                // Mobile fallback: try to draw even if image loading events are unreliable
                const currImg = userBGSelected[currIdx];
                const nextImg = userBGSelected[nextIdx];
                try {
                    if (currImg.naturalWidth > 0) {
                        if (phase < USER_BG_DISPLAY_DURATION) {
                            customBGCtx.globalAlpha = 1;
                            customBGCtx.drawImage(currImg, 0, 0, customBGCanvas.width, customBGCanvas.height);
                        } else {
                            const fade = (phase - USER_BG_DISPLAY_DURATION) / USER_BG_FADE_DURATION;
                            customBGCtx.globalAlpha = 1 - fade;
                            customBGCtx.drawImage(currImg, 0, 0, customBGCanvas.width, customBGCanvas.height);
                            if (nextImg.naturalWidth > 0) {
                                customBGCtx.globalAlpha = fade;
                                customBGCtx.drawImage(nextImg, 0, 0, customBGCanvas.width, customBGCanvas.height);
                            }
                            customBGCtx.globalAlpha = 1;
                        }
                    }
                } catch (e) {
                    // On mobile, ignore draw errors
                }
                userBGTimer = requestAnimationFrame(cycle);
            }
            userBGTimer = requestAnimationFrame(cycle);
        }

        function stopUserBGCycle() {
            if (userBGTimer) cancelAnimationFrame(userBGTimer);
            userBGTimer = null;
        }



        // Ensure glitch-canvas is initialized after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            if (window.initializeGlitchCanvases) {
                window.initializeGlitchCanvases();
            }
            // Custom BG toggle logic (now toggles panel and background)
            const customBGBtn = document.getElementById('custom-bg-btn');
            const customBGPanel = document.getElementById('custom-bg-panel');
            const customBGThumbnails = document.getElementById('custom-bg-thumbnails');
            const customBGFile = document.getElementById('custom-bg-file');
            let customBGActivated = false;
            customBGBtn.addEventListener('click', function() {
                if (!customBGActivated) {
                    // First click: activate custom background, show panel
                    customBGActivated = true;
                    document.getElementById('hue-bg').style.display = 'none';
                    customBGCanvas.style.display = 'block';
                    hueBGActive = false;
                    customBGBtn.textContent = 'Select Background';
                    customBGPanel.style.display = 'block';
                } else {
                    // Toggle panel
                    userBGPanelOpen = !userBGPanelOpen;
                    customBGPanel.style.display = userBGPanelOpen ? 'block' : 'none';
                }
            });

            // Handle file input
            customBGFile.addEventListener('change', function(e) {
                const files = Array.from(e.target.files).slice(0, 50);
                userBGImages = [];
                userBGSelected = [];
                customBGThumbnails.innerHTML = '';
                let loaded = 0;
                files.forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const img = new window.Image();
                        // Mobile fallback: always show custom background canvas when images are loaded
                        img.onload = function() {
                            userBGImages.push(img);
                            userBGSelected.push(img);
                            customBGCanvas.style.display = 'block';
                            document.getElementById('hue-bg').style.display = 'none';
                            hueBGActive = false;
                            // Thumbnail
                            const thumb = document.createElement('img');
                            thumb.src = img.src;
                            thumb.className = 'selected';
                            thumb.title = 'Selected';
                            function toggleSelection() {
                                if (thumb.classList.contains('selected')) {
                                    thumb.classList.remove('selected');
                                    userBGSelected = userBGSelected.filter(i => i !== img);
                                } else if (userBGSelected.length < 50) {
                                    thumb.classList.add('selected');
                                    userBGSelected.push(img);
                                }
                                if (userBGSelected.length === 0) {
                                    stopUserBGCycle();
                                    customBGCtx.clearRect(0, 0, customBGCanvas.width, customBGCanvas.height);
                                    // On mobile, hide canvas if no images
                                    customBGCanvas.style.display = 'none';
                                    document.getElementById('hue-bg').style.display = 'block';
                                    hueBGActive = true;
                                } else {
                                    userBGIndex = 0;
                                    startUserBGCycle();
                                }
                            }
                            thumb.onclick = toggleSelection;
                            thumb.ontouchstart = function(e) {
                                e.preventDefault();
                                toggleSelection();
                            };
                            customBGThumbnails.appendChild(thumb);
                            loaded++;
                        };
                        // Mobile fallback: force src assignment and canvas display
                        img.src = ev.target.result;
                        customBGCanvas.style.display = 'block';
                        document.getElementById('hue-bg').style.display = 'none';
                        hueBGActive = false;
                    };
                    reader.readAsDataURL(file);
                });
            });

            // Apply button logic
            const customBGApplyBtn = document.getElementById('custom-bg-apply-btn');
            customBGApplyBtn.addEventListener('click', function() {
                if (userBGSelected.length > 0) {
                    userBGIndex = 0;
                    startUserBGCycle();
                } else {
                    stopUserBGCycle();
                    customBGCtx.clearRect(0, 0, customBGCanvas.width, customBGCanvas.height);
                }
                customBGPanel.style.display = 'none';
                userBGPanelOpen = false;
            });
        });

    </script>
            <script>
        // Revision 3 mixer rack: an always-visible level fader plus per-effect SIZE and DEPTH.
        document.addEventListener('DOMContentLoaded', function() {
            const effectNames = [
                'Neon Grad', 'Scanlines', 'Data Bands', 'Flash', 'HSL Rainbow', 'ASCII',
                'Font Burn', 'Strobe', 'Gemini Bomb', 'Tech Artist', 'VHS Glitch',
                'Data Bomb', 'Ink Glyphs', 'Matrix ASCII', 'Matrix Chord',
                'B&W Invert', 'Hue/Color Cycle'
            ];
            const column = document.getElementById('effect-toggle-column');
            if (!column) return;
            column.innerHTML = '<div class="effect-palette-heading"><span>GLITCH PALETTE</span><small>17 VOICES · MIX LIVE</small></div>';
            const controls = {};
            const makeTune = (labelText, min, max, value, outputText) => {
                const label = document.createElement('label'); label.appendChild(document.createTextNode(labelText));
                const output = document.createElement('output'); output.textContent = outputText; label.appendChild(output);
                const input = document.createElement('input'); input.type='range'; input.min=String(min); input.max=String(max); input.step='0.01'; input.value=String(value);
                input.setAttribute('aria-label',labelText); label.appendChild(input);
                return {label,input,output};
            };
            effectNames.forEach((name) => {
                const row = document.createElement('div'); row.className = 'effect-control-row';
                const button = document.createElement('button'); button.className = 'effect-toggle-btn';
                button.textContent = name; button.dataset.effect = name; button.dataset.active = 'false';
                button.setAttribute('aria-pressed','false');
                button.addEventListener('click', () => {
                    const on = button.dataset.active !== 'true';
                    if (window.__toggleEffect) window.__toggleEffect(name, on);
                });
                const intensity = document.createElement('input'); intensity.type='range'; intensity.min='0'; intensity.max='1'; intensity.step='0.01'; intensity.value='1';
                intensity.title = name + ' intensity'; intensity.setAttribute('aria-label',name + ' intensity');
                const level = document.createElement('span'); level.className='effect-level-label'; level.textContent='100%';
                intensity.addEventListener('input', () => {
                    level.textContent = Math.round(Number(intensity.value)*100)+'%';
                    if (window.__setEffectIntensity) window.__setEffectIntensity(name,intensity.value);
                });
                const tuneButton=document.createElement('button'); tuneButton.type='button'; tuneButton.className='effect-tune-toggle';
                tuneButton.textContent='SIZE / DEPTH  +'; tuneButton.setAttribute('aria-expanded','false');
                const tunePanel=document.createElement('div'); tunePanel.className='effect-tune-panel';
                const size=makeTune('SIZE',0.4,2.4,1,'100%');
                const depth=makeTune('DEPTH',0,1,0.62,'62%');
                size.input.addEventListener('input',()=>{
                    size.output.textContent=Math.round(Number(size.input.value)*100)+'%';
                    if(window.__setEffectSize)window.__setEffectSize(name,size.input.value);
                });
                depth.input.addEventListener('input',()=>{
                    depth.output.textContent=Math.round(Number(depth.input.value)*100)+'%';
                    if(window.__setEffectDepth)window.__setEffectDepth(name,depth.input.value);
                });
                tunePanel.append(size.label,depth.label);
                tuneButton.addEventListener('click',()=>{
                    const open=tunePanel.classList.toggle('open');
                    tuneButton.textContent=open?'SIZE / DEPTH  −':'SIZE / DEPTH  +';
                    tuneButton.setAttribute('aria-expanded',String(open));
                });
                if(name==='Font Burn') { tunePanel.classList.add('open'); tuneButton.textContent='SIZE / DEPTH  −'; tuneButton.setAttribute('aria-expanded','true'); }
                row.append(button,intensity,level,tuneButton,tunePanel); column.appendChild(row);
                controls[name]={button,intensity,level,size,depth,tunePanel,tuneButton};
            });
            const bindRange = (id, hook, outputId, scale, suffix) => {
                const input=document.getElementById(id), output=document.getElementById(outputId);
                if(!input)return;
                const apply=()=>{if(output)output.textContent=Math.round(Number(input.value)*scale)+suffix;if(typeof window[hook]==='function')window[hook](input.value);};
                input.addEventListener('input',apply);apply();
            };
            bindRange('master-intensity-slider','__setMasterEffectIntensity','master-intensity-value',100,'%');
            bindRange('motion-scale-slider','__setMotionScale','motion-scale-value',100,'%');
            bindRange('blend-softness-slider','__setBlendSoftness','blend-softness-value',100,'%');
            bindRange('continual-speed-slider','__setContinualSpeed','continual-speed-value',100,'%');
            bindRange('auto-glitch-power-slider','__setAutoGlitchPower','auto-glitch-power-value',100,'%');
            bindRange('vsync-strength-slider','__setVsyncLevel','vsync-strength-value',100,'%');
            bindRange('random-seed-slider','__setRandomSeed','random-seed-value',100,'%');
            bindRange('board-energy-slider','__setBoardEnergy','board-energy-value',100,'%');
            const sync=(event)=>{
                const d=event.detail||{};
                Object.keys(controls).forEach(name=>{
                    const c=controls[name],on=!!(d.effects&&d.effects[name]);
                    c.button.dataset.active=String(on); c.button.setAttribute('aria-pressed',String(on));
                    c.button.textContent=on?name+'  ·  ON':name;
                    const level=d.levels&&Number.isFinite(d.levels[name])?d.levels[name]:1;
                    c.intensity.value=level; c.level.textContent=Math.round(level*100)+'%';
                    const size=d.sizes&&Number.isFinite(d.sizes[name])?d.sizes[name]:1;
                    const depth=d.depths&&Number.isFinite(d.depths[name])?d.depths[name]:0.62;
                    c.size.input.value=size; c.size.output.textContent=Math.round(size*100)+'%';
                    c.depth.input.value=depth; c.depth.output.textContent=Math.round(depth*100)+'%';
                });
                const paint=(id,label,on)=>{const b=document.getElementById(id);if(!b)return;b.classList.toggle('active',!!on);b.textContent=label;};
                paint('soft-eye-btn',d.softEye?'SOFT-EYE: ACTIVE':'SOFT-EYE: OFF',d.softEye);
                paint('hard-light-btn',d.hardLight?'HARD-LIGHT: ON':'HARD-LIGHT: OFF',d.hardLight);
                paint('auto-glitch-btn',d.autoGlitch?'AUTO GLITCH: ON':'AUTO GLITCH: OFF',d.autoGlitch);
                const ghost=document.getElementById('ghost-mode-btn'); if(ghost&&d.ghost)ghost.textContent='GHOST '+d.ghost;
                const vsync=document.getElementById('vsync-mode-btn'); if(vsync&&d.vsync)vsync.textContent='V-SYNC '+d.vsync.replace('_',' ');
                const warp=document.getElementById('ai-warp-btn'); if(warp)warp.textContent=d.warp?'WARP ON':'WARP OFF';
            };
            window.addEventListener('glitch-ui-state',sync);
            sync({detail:{effects:{},levels:{},sizes:{},depths:{},softEye:false,hardLight:false,autoGlitch:false}});
        });
        </script>
</body>
</html>
