<!-- ══════════════════════════════════════════════════════════════════════════════
     AI WARP v4 — "THEME TURBO"
     Drop-in for  media_page_MASTERFULLY_INTEGRATED.html
     Paste AFTER ai-warp-v3-LEGIBILITY-LOCK.html (i.e. still before </body>).

     WHAT IT DOES
     The top-bar buttons CYBER / MATRIX / VHS GOLD / CYAN each used to draw one
     fixed visual (planes, rain, tracking band, radar) at one fixed strength, and
     SCANLINES was a single 3px gradient at 4-35% opacity. v4 keeps every one of
     those but adds, per theme:

       • a heavier ambient pass   — multi-layer parallax, more geometry, faster
                                    response to bass/mid/treble
       • 4-5 extra effect BURSTS  — randomly scheduled, audio-weighted, so the
                                    theme keeps re-inventing itself instead of
                                    looping one animation
       • a themed splash          — heavier, and different for each button
       • the HUD bar itself       — audio-reactive glow/border/sheen (uses the
                                    engine's own --hud-level / --hud-beat vars)

     and it turns SCANLINES into a real CRT system: configurable line pitch,
     dark+bright line pair, rolling refresh band, aperture-grille RGB mask,
     flicker, and audio-reactive density.

     IT RESPECTS THE v3 LEGIBILITY LOCK
     The accent canvas defaults to `mix-blend-mode: screen` (adds light, never
     paints over content) with a hard alpha cap, and the broad colour fields stay
     inside the luma-locked stack. Set CFG.BLEND_MODE = 'color' for a
     mathematically luma-neutral accent layer instead.

     TUNING:  AIWarpV4.CFG is live. Everything has a knob.
     ALSO:    the module is page-agnostic — it creates its own layers, reads
              window.__THEME_MODE / the page's analysers if present, and exposes
              CFG.SPECTRUM_HOOK so any host (e.g. a demo page) can feed it audio.
     ══════════════════════════════════════════════════════════════════════════════ -->

<style id="aw-v4-css">
/* ==========================================================================
   AI WARP v4 — THEME TURBO (stylesheet half)
   All rules are gated behind html.aw-v4. Nothing is deleted; everything here
   is additive or an amplifier of the page's own effects.
   ========================================================================== */

/* ---- A. the accent layer (bursts + splashes) ----------------------------
   Sits above the luma-locked field stack and below the tint overlay, so the
   page's own colours still harmonise everything underneath it.             */
#aw-theme-stack {
  position: fixed; top: 0; left: 0; right: auto; bottom: auto;
  width: 100vw; height: 100vh;
  z-index: 2147483641;
  pointer-events: none; overflow: hidden;
}
#aw-theme-canvas {
  position: absolute; top: 0; left: 0;
  width: 100% !important; height: 100% !important;
  display: block; pointer-events: none;
  mix-blend-mode: var(--aw-accent-blend, screen);
  opacity: 1;
}
html.aw-v4.aw-accent-locked #aw-theme-canvas { mix-blend-mode: color; }

/* ---- B. HUD bar: audio-reactive (the engine writes --hud-level/-beat/-drive) */
html.aw-v4 .retro-hud-bar {
  border-color: var(--aw-hud-edge, var(--neon-purple)) !important;
  box-shadow:
    0 0 calc(18px + var(--hud-beat, 0) * 70px) calc(1px + var(--hud-beat, 0) * 12px)
      color-mix(in srgb, var(--aw-hud-edge, #bb86fc) 65%, transparent),
    0 0 calc(30px + var(--hud-level, 0) * 50px) 0 var(--aw-hud-edge, #bb86fc),
    inset 0 0 calc(18px + var(--hud-level, 0) * 26px) rgba(0, 0, 0, 0.55) !important;
  backdrop-filter: blur(calc(14px + var(--hud-level, 0) * 8px)) saturate(calc(140% + var(--hud-beat, 0) * 90%));
  transition: box-shadow .06s linear, backdrop-filter .1s linear;
}
html.aw-v4 .retro-hud-bar .status-pill { letter-spacing: calc(.04em + var(--hud-beat, 0) * .12em); }
html.aw-v4 .retro-hud-bar::after {
  content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  border: 1px solid transparent;
  background:
    linear-gradient(90deg,
      transparent calc(50% - var(--hud-beat, 0) * 50%),
      rgba(255, 255, 255, calc(.10 + var(--hud-beat, 0) * .35)) 50%,
      transparent calc(50% + var(--hud-beat, 0) * 50%)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
html.aw-v4 .hud-btn.active {
  box-shadow: 0 0 calc(10px + var(--hud-beat, 0) * 34px) var(--aw-hud-edge, #bb86fc),
              inset 0 0 12px rgba(255, 255, 255, calc(.05 + var(--hud-beat, 0) * .25)) !important;
}

/* ---- C. SCANLINES: a real CRT system ------------------------------------
   Base pitch/weight/colour are variables so the runtime can breathe them with
   the music; the dark lines multiply (classic CRT) and a bright twin line
   keeps the raster visible on dark showcases too.                          */
html.aw-v4 body::after {
  background:
    repeating-linear-gradient(to bottom,
      rgba(255, 255, 255, var(--aw-scan-bright, .05)) 0 1px,
      transparent 1px 2px,
      rgba(0, 0, 0, var(--aw-scan-dark, .55)) 2px 3px,
      transparent 3px var(--aw-scan-pitch, 4px)) !important;
  background-size: 100% var(--aw-scan-pitch, 4px) !important;
  mix-blend-mode: var(--aw-scan-blend, multiply) !important;
  animation: aw-scan-roll var(--aw-scan-speed, 0.6s) linear infinite !important;
  /* opacity lives in the state rule below — one declaration, no duplicates */
  transition: opacity .25s ease-out !important;
}
html.aw-v4 body::after { opacity: var(--aw-scan-op-now, var(--aw-scan-op, 0.14)) !important; }
/* the page also styles ::after with !important, so keep ours winning on
   specificity in every state — the last three rules must stay last */
@keyframes aw-scan-roll {
  from { background-position: 0 0; }
  to   { background-position: 0 calc(var(--aw-scan-pitch, 4px) * -4); }
}
/* rolling refresh band — one soft bright bar travelling down the tube */
#aw-scan-roll {
  position: fixed; left: 0; width: 100vw; height: 22vh;
  z-index: 10000; pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, calc(.030 * var(--aw-scan-roll-gain, 1))) 45%,
    rgba(255, 255, 255, calc(.055 * var(--aw-scan-roll-gain, 1))) 52%,
    rgba(255, 255, 255, 0) 100%);
  mix-blend-mode: screen;
  animation: aw-roll-sweep var(--aw-scan-roll-speed, 7s) linear infinite;
}
@keyframes aw-roll-sweep {
  from { transform: translateY(-25vh); }
  to   { transform: translateY(105vh); }
}
/* aperture-grille RGB mask — 1px stripes, very low alpha, adds CRT "texture" */
#aw-scan-mask {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
  background: repeating-linear-gradient(90deg,
    rgba(255, 0, 60, var(--aw-mask-a, .05)) 0 1px,
    rgba(0, 255, 120, var(--aw-mask-a, .05)) 1px 2px,
    rgba(60, 120, 255, var(--aw-mask-a, .05)) 2px 3px);
  mix-blend-mode: screen;
  opacity: var(--aw-mask-op, 0);
  transition: opacity .3s ease;
}
html.aw-v4 body:not(.scanlines-off) #aw-scan-mask { opacity: var(--aw-mask-op, 0); }

/* ---- D. theme splash (per-button, heavier) ------------------------------ */
#aw-splash {
  position: fixed; inset: 0; z-index: 2147483643; pointer-events: none;
  opacity: 0; transition: none;
}
/* ---- E. THEME button pressed-look, heavier ----------------------------- */
html.aw-v4 .hud-btn { transition: box-shadow .12s ease, transform .08s ease, letter-spacing .12s ease; }
html.aw-v4 .hud-btn:hover { transform: translateY(-1px); letter-spacing: .10em; }
html.aw-v4 .hud-btn:active { transform: translateY(1px) scale(.97); }
</style>

<script id="aw-v4-runtime">
/* ==========================================================================
   AI WARP v4 — THEME TURBO (runtime half)
   Page-agnostic: creates its own canvas + CRT layers, hooks the page's theme
   buttons when they exist, and falls back to window.__THEME_MODE polling.
   ========================================================================== */
(function () {
  'use strict';

  /* ┌───────────────────────────────────────────────────────────────────────┐
     │  CFG                                                                  │
     └───────────────────────────────────────────────────────────────────────┘ */
  var CFG = {
    INTENSITY: 1.8,         /* master multiplier on every v4 effect (1 = tame) */
    GLOW_ALPHA: 0.90,        /* hard cap on the accent canvas opacity          */
    QUALITY: 1,              /* 0.3..1 — particle/column counts. Mobile builds lower
                                this so a phone GPU is not asked for desktop work   */
    DPR_CAP: 2,              /* backing-store resolution cap for the accent canvas */
    BLEND_MODE: 'screen',    /* 'screen' = neon punch | 'color' = luma-locked  */
    VARIATION: 0.9,         /* 0..1 — how eagerly the theme re-rolls its look */
    BURST_MIN_MS: 1200,      /* burst scheduling window (scaled by VARIATION)  */
    BURST_MAX_MS: 3600,
    MAX_OVERLAP: 4,          /* simultaneous bursts                            */
    AUDIO_DRIVEN: true,      /* bursts + scanlines follow bass/mid/treble      */
    SPECTRUM_HOOK: null,     /* optional function -> {bass,mid,treble,level}   */

    /* the page's own canvas theme drawing (matrix rain / gold / cyan / planes) */
    ENGINE_BOOST: { CANVAS_ALPHA_MAX: 0.72, VIVID_GAIN: 1.25, PLANE_SAT: 96,
                    PLANE_LIGHT: 58, GIF_ALPHA_MAX: 0.30 },

    HUD_REACTIVE: true,      /* drive the bar glow from the engine's hud vars */
    HUD_GLOW: 1.0,

    SPLASH: true,            /* heavier per-theme transition                    */
    SPLASH_MS: 1100,

    SCANLINES: {
      ENABLED: true,
      PITCH: 4,              /* px between raster lines (3 = dense, 6 = coarse) */
      DARK: 0.62,            /* dark line alpha        */
      BRIGHT: 0.055,         /* bright twin-line alpha */
      BLEND: 'multiply',     /* raster blend mode       */
      BASE: 0.14, SCROLL: 0.62, ALWAYS: 0.48,
      AUDIO_BREATH: 0.35,    /* how much the music thickens the raster */
      ROLL: true, ROLL_GAIN: 1.0, ROLL_SPEED: 7.0,   /* seconds per sweep */
      MASK: 0.07,            /* aperture-grille stripe alpha (0 = off) */
      SPEED: 0.6             /* raster crawl speed (s per cycle) */
    },

    /* per-theme: accent hue, ambient variant pool, burst weights, text colour */
    THEMES: {
      cyber: { name: 'CYBER', hue: null, hues: 'palette', sat: 92, light: 58,
               variants: ['ribbons', 'tunnel', 'storm'],
               bursts: { slice: 3, chromatic: 2, poly: 2, tunnel: 2, sweep: 2, datarain: 1 } },
      matrix: { name: 'MATRIX', hue: 126, hueSpread: 34, sat: 95, light: 52,
                variants: ['rain3d', 'rain3d', 'cascade'],  /* repeat = more likely */
                bursts: { cascade: 4, bootstrip: 3, wipe: 2, decode: 2, datarain: 2 } },
      gold: { name: 'VHS GOLD', hue: 36, hueSpread: 16, sat: 88, light: 56,
              variants: ['tracking', 'rewind'],
              bursts: { tear: 4, dropout: 3, rewind: 2, damage: 2, bootstrip: 1 } },
      cyan: { name: 'CYAN', hue: 186, hueSpread: 26, sat: 92, light: 58,
              variants: ['grid', 'radar'],
              bursts: { ping: 4, trace: 3, lock: 3, hexdump: 2, sweep: 2 } }
    }
  };

  /* shorthands so the host page can tweak from the console */
  var THEMES = CFG.THEMES, SC = CFG.SCANLINES;

  var rootEl = null, accentStack = null, canvas = null, ctx = null;
  var mode = 'cyber', modeIdle = 0;
  var frame = 0, W = 0, H = 0, dpr = 1;
  var pal = [200, 280, 40, 320, 120, 20];   /* page-hue palette (filled at boot) */
  var audio = { bass: 0, mid: 0, treble: 0, level: 0, drive: 0, rms: 0 };
  var env = { level: 0 }, peak = { bass: 0, mid: 0, treble: 0 };
  var bursts = [], nextBurstAt = 0, variantIx = 0, variantAt = 0;
  var splash = null, scanEl = null, maskEl = null, hudBar = null, lastDraw = 0;
  var v2cfg = null, booted = false;

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function mod(a, n) { return ((a % n) + n) % n; }
  function I() { return CFG.INTENSITY; }                  /* intensity */
  function hueOf(h) { return mod(h, 360); }

  /* ───────────────────────── audio ───────────────────────── */
  function analyser() {
    return window.__aiWarpAnalyser || window.__MASTER_ANALYSER ||
           window.__MAIN_ANALYSER || window.__awV4Analyser || null;
  }
  function follow(raw, key) {
    var p = peak[key];
    p = raw > p ? p + (raw - p) * 0.35 : p + (raw - p) * 0.015;
    peak[key] = p;
    var abs = clamp01(raw), norm = p < 0.02 ? 0 : clamp01(raw / p);
    return clamp01(0.55 * norm + 0.45 * abs);
  }
  function readAudio(t) {
    if (typeof CFG.SPECTRUM_HOOK === 'function') {
      try {
        var s = CFG.SPECTRUM_HOOK() || {};
        audio.bass = clamp01(s.bass || 0); audio.mid = clamp01(s.mid || 0);
        audio.treble = clamp01(s.treble || 0); audio.level = clamp01(s.level || 0);
      } catch (e) {}
    } else {
      var a = analyser();
      if (a && a.frequencyBinCount) {
        try {
          var n = a.frequencyBinCount, data = new Uint8Array(n);
          a.getByteFrequencyData(data);
          var sr = 48000; try { if (a.context && a.context.sampleRate) sr = a.context.sampleRate; } catch (e) {}
          var binHz = (sr / 2) / n;
          function band(lo, hi, g) {
            var i0 = Math.max(0, Math.floor(lo / binHz)), i1 = Math.min(n - 1, Math.ceil(hi / binHz));
            var sum = 0, c = 0;
            for (var i = i0; i <= i1; i++) { sum += data[i]; c++; }
            return Math.min(1, (c ? sum / c / 255 : 0) * g);
          }
          audio.bass = follow(band(20, 160, 1.15), 'bass');
          audio.mid = follow(band(200, 2000, 1.7), 'mid');
          audio.treble = follow(band(3500, 11000, 3.4), 'treble');
          var lo = Math.max(0, Math.floor(20 / binHz)), hi = Math.min(n - 1, Math.ceil(11000 / binHz));
          var tot = 0; for (var k = lo; k <= hi; k++) tot += data[k];
          env.level += (((hi - lo + 1) ? tot / (hi - lo + 1) / 255 : 0) - env.level) * 0.14;
          audio.level = clamp01(env.level);
          var sq = 0; for (var q = 0; q < n; q += 4) { var v = data[q] / 255; sq += v * v; }
          audio.rms = Math.sqrt(sq / (n / 4));
        } catch (e2) {}
      } else {
        /* no analyser yet — gentle idle so the theme is never dead */
        audio.bass = 0.22 + 0.12 * Math.sin(t / 1600);
        audio.mid = 0.16; audio.treble = 0.18 + 0.10 * Math.cos(t / 2400);
        audio.level = 0.20; audio.rms = 0.18;
      }
    }
    audio.drive = clamp01(0.34 * audio.bass + 0.30 * audio.mid + 0.24 * audio.treble + 0.12 * audio.level);
  }

  /* ───────────── palette + per-theme colour helpers ───────────── */
  function cssHue(txt) {
    txt = (txt || '').trim();
    var m = /^#([0-9a-f]{6})$/i.exec(txt) || /^#([0-9a-f]{3})$/i.exec(txt), r, g, b;
    if (m) {
      var s = m[1]; if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
      r = parseInt(s.slice(0, 2), 16); g = parseInt(s.slice(2, 4), 16); b = parseInt(s.slice(4, 6), 16);
    } else {
      var rr = /rgba?\(([^)]+)\)/.exec(txt); if (!rr) return null;
      var p = rr[1].split(',').map(parseFloat); r = p[0]; g = p[1]; b = p[2];
    }
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60;
    }
    return mod(h, 360);
  }
  function collectPalette() {
    var out = [];
    try {
      var items = document.querySelectorAll('.media-item');
      for (var i = 0; i < items.length; i++) {
        var v = parseFloat(items[i].style.getPropertyValue('--sc-hue'));
        if (isFinite(v)) out.push(mod(v, 360));
      }
      var cs = getComputedStyle(document.documentElement);
      ['--neon-purple', '--neon-cyan', '--neon-pink'].forEach(function (n) {
        var h = cssHue(cs.getPropertyValue(n)); if (h != null) out.push(h);
      });
    } catch (e) {}
    if (out.length >= 4) pal = out;   /* else keep the default wheel */
  }
  /** accent hue for the active theme (+ small live variation) */
  function themeHue(off) {
    var th = THEMES[mode] || THEMES.cyber;
    var t = Date.now();
    if (th.hues === 'palette') return hueOf(pal[(frame / 90 | 0) % pal.length] + (off || 0) + Math.sin(t / 4200) * 25);
    return hueOf(th.hue + (off || 0) + Math.sin(t / 3300) * (th.hueSpread || 20));
  }
  function hsla(h, a, l, s) {
    var th = THEMES[mode] || THEMES.cyber;
    return 'hsla(' + hueOf(h).toFixed(1) + ',' + (s == null ? th.sat : s) + '%,' +
           (l == null ? th.light : l) + '%,' + clamp01(a).toFixed(4) + ')';
  }

  /* ─────────────────────── layer plumbing ─────────────────────── */
  function ensureLayers() {
    rootEl = document.documentElement;
    rootEl.classList.add('aw-v4');
    if (CFG.BLEND_MODE === 'color') rootEl.classList.add('aw-accent-locked');

    if (!accentStack) {
      accentStack = document.createElement('div');
      accentStack.id = 'aw-theme-stack';
      accentStack.setAttribute('aria-hidden', 'true');
      canvas = document.createElement('canvas');
      canvas.id = 'aw-theme-canvas';
      accentStack.appendChild(canvas);
      rootEl.appendChild(accentStack);
      ctx = canvas.getContext('2d');
    }
    if (!scanEl) {
      scanEl = document.createElement('div'); scanEl.id = 'aw-scan-roll';
      scanEl.setAttribute('aria-hidden', 'true');
      rootEl.appendChild(scanEl);
    }
    if (!maskEl) {
      maskEl = document.createElement('div'); maskEl.id = 'aw-scan-mask';
      maskEl.setAttribute('aria-hidden', 'true');
      rootEl.appendChild(maskEl);
    }
    applyScanVars();
    applySplashVars();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, CFG.DPR_CAP || 2);
    W = window.innerWidth; H = window.innerHeight;
    if (!canvas) return;
    var bw = Math.floor(W * dpr), bh = Math.floor(H * dpr);
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
    accentStack.style.width = W + 'px'; accentStack.style.height = H + 'px';
    accentStack.style.setProperty('width', W + 'px', 'important');
    accentStack.style.setProperty('height', H + 'px', 'important');
    accentStack.style.setProperty('top', '0px', 'important');
    accentStack.style.setProperty('left', '0px', 'important');
  }

  function applyScanVars() {
    /* callable before boot() (the mobile tuning script configures scanlines as
       soon as the module exists), so resolve the root element lazily */
    if (!rootEl) rootEl = document.documentElement;
    if (!rootEl) return;
    var st = rootEl.style;
    st.setProperty('--aw-scan-pitch', SC.PITCH + 'px');
    st.setProperty('--aw-scan-dark', String(SC.DARK));
    st.setProperty('--aw-scan-bright', String(SC.BRIGHT));
    st.setProperty('--aw-scan-blend', SC.BLEND);
    st.setProperty('--aw-scan-speed', SC.SPEED + 's');
    st.setProperty('--aw-scan-op', String(SC.BASE));
    st.setProperty('--aw-scan-op-now', String(SC.BASE));
    st.setProperty('--aw-scan-op-scroll', String(SC.SCROLL));
    st.setProperty('--aw-scan-op-always', String(SC.ALWAYS));
    st.setProperty('--aw-scan-roll-gain', SC.ROLL ? String(SC.ROLL_GAIN) : '0');
    st.setProperty('--aw-scan-roll-speed', SC.ROLL_SPEED + 's');
    st.setProperty('--aw-mask-a', String(SC.MASK));
    st.setProperty('--aw-mask-op', SC.MASK > 0 ? '1' : '0');
    if (scanEl) scanEl.style.display = SC.ROLL ? '' : 'none';
    if (maskEl) maskEl.style.display = SC.MASK > 0 ? '' : 'none';
    if (typeof pushScanState === 'function') pushScanState();
  }
  function applySplashVars() {
    rootEl.style.setProperty('--aw-accent-blend', CFG.BLEND_MODE);
    rootEl.style.setProperty('--aw-hud-edge', CFG.THEMES[mode] && CFG.THEMES[mode].hues === 'palette'
      ? 'var(--neon-purple)' : hsla(themeHue(0), 1, 62));
  }

  /* ───────────────────── theme switching ───────────────────── */
  function setTheme(key, silent) {
    key = (key === 'gold' || key === 'matrix' || key === 'cyan' || key === 'cyber') ? key : 'cyber';
    var changed = key !== mode;
    mode = key;
    bursts.length = 0;
    variantIx = 0; variantAt = 0;
    nextBurstAt = 0;
    if (!silent && CFG.SPLASH) splash = { t0: now(), key: key, dur: CFG.SPLASH_MS };
    applySplashVars();
    if (!silent) refreshHudEdge();
    return mode;
  }
  function refreshHudEdge() {
    var h = themeHue(0);
    rootEl.style.setProperty('--aw-hud-edge', hsla(h, 1, 64));
  }

  /* wrap the page's own handlers so the top-bar buttons drive v4 as well */
  var wrappedActivate = null, wrappedScan = null;
  function wrapHooks() {
    if (typeof window.activateTheme === 'function' && window.activateTheme !== wrappedActivate) {
      var orig = window.activateTheme;
      var w = function (cls, key) {
        var r = orig.apply(this, arguments);
        try { setTheme(key || 'cyber'); } catch (e) {}
        return r;
      };
      w.__awWrapped = true; w.__awOrig = orig;
      window.activateTheme = w; wrappedActivate = w;
    }
    if (typeof window.toggleScanlines === 'function' && window.toggleScanlines !== wrappedScan) {
      var origS = window.toggleScanlines;
      var ws = function () {
        var r = origS.apply(this, arguments);
        try { scanPulse(); } catch (e) {}
        return r;
      };
      ws.__awWrapped = true; ws.__awOrig = origS;
      window.toggleScanlines = ws; wrappedScan = ws;
    }
    /* pick up the engine's own CFG for the boost */
    if (!v2cfg && window.AIWarpV2 && window.AIWarpV2.CFG) v2cfg = window.AIWarpV2.CFG;
  }
  function scanPulse() {
    if (!scanEl) return;
    scanEl.style.animationDuration = '1.1s';
    setTimeout(function () { scanEl.style.animationDuration = (SC.ROLL_SPEED) + 's'; }, 900);
  }

  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }

  /* ───────────────────────── bursts ─────────────────────────
     A burst = a short-lived, randomly chosen effect module. Weighted per theme
     so each button has its own personality, and re-rolled continuously.     */
  function spawnBurst() {
    var th = THEMES[mode] || THEMES.cyber;
    var names = Object.keys(th.bursts), total = 0;
    for (var i = 0; i < names.length; i++) total += th.bursts[names[i]];
    var r = Math.random() * total, pickName = names[0];
    for (var j = 0; j < names.length; j++) { r -= th.bursts[names[j]]; if (r <= 0) { pickName = names[j]; break; } }

    var boost = CFG.AUDIO_DRIVEN ? (0.85 + audio.drive * 1.7) * I() : I();
    var b = { kind: pickName, t0: now(), life: rnd(1300, 2700), boost: boost, seed: Math.random() };
    switch (pickName) {
      case 'slice':     b.slices = Array.from({ length: Math.max(3, Math.round((4 + (Math.random() * 8 | 0)) * CFG.QUALITY)) }, () => ({ y: Math.random(), h: rnd(0.006, 0.05), off: rnd(-0.05, 0.05) })); break;
      case 'chromatic': b.x = Math.random(); b.y = Math.random(); b.w = rnd(0.25, 0.7); break;
      case 'poly':      b.pts = polygon(rnd(4, 9)); b.cx = rnd(0.15, 0.85); b.cy = rnd(0.15, 0.85); b.r = rnd(0.2, 0.55); break;
      case 'tunnel':    b.cx = rnd(0.3, 0.7); b.cy = rnd(0.3, 0.7); b.rings = 6 + (Math.random() * 6 | 0); break;
      case 'sweep':     b.ang = rnd(-35, 35); b.dir = Math.random() < 0.5 ? 1 : -1; break;
      case 'cascade':   b.cols = Array.from({ length: Math.max(6, Math.round((18 + (Math.random() * 22 | 0)) * CFG.QUALITY)) }, () => ({ x: Math.random(), v: rnd(0.9, 2.4), len: rnd(0.05, 0.16) })); break;
      case 'bootstrip': b.lines = 4 + (Math.random() * 5 | 0); break;
      case 'wipe':      b.x = Math.random(); b.w = rnd(0.05, 0.16); b.dir = Math.random() < 0.5 ? 1 : -1; break;
      case 'decode':    b.g = { x: rnd(0.05, 0.5), y: rnd(0.05, 0.6), w: rnd(0.25, 0.6), h: rnd(0.1, 0.3) }; break;
      case 'tear':      b.tears = Array.from({ length: 3 + (Math.random() * 5 | 0) }, () => ({ y: Math.random(), h: rnd(0.01, 0.06), skew: rnd(-0.06, 0.06), split: rnd(3, 16) })); break;
      case 'dropout':   b.blobs = Math.max(5, Math.round((14 + (Math.random() * 26 | 0)) * CFG.QUALITY)); break;
      case 'rewind':    b.dir = -1; b.bars = 26; break;
      case 'damage':    b.bands = 4 + (Math.random() * 4 | 0); break;
      case 'ping':      b.cx = rnd(0.2, 0.8); b.cy = rnd(0.2, 0.8); b.n = 3 + (Math.random() * 3 | 0); break;
      case 'trace':     b.ch = Array.from({ length: 140 }, (_, i) => ({ x: i / 139, y: Math.random() })); break;
      case 'lock':      b.cx = rnd(0.15, 0.85); b.cy = rnd(0.15, 0.85); b.r = rnd(0.05, 0.14); break;
      case 'hexdump':   b.rows = 6 + (Math.random() * 8 | 0); break;
      case 'datarain':  b.cols = Array.from({ length: Math.max(5, Math.round((12 + (Math.random() * 16 | 0)) * CFG.QUALITY)) }, () => ({ x: Math.random(), y: Math.random(), v: rnd(0.4, 1.4) })); break;

    bursts.push(b);
    if (bursts.length > CFG.MAX_OVERLAP) bursts.shift();
    var vari = 1 + (1 - CFG.VARIATION) * 1.6;
    nextBurstAt = now() + rnd(CFG.BURST_MIN_MS, CFG.BURST_MAX_MS) * vari / Math.max(0.35, I());
  }
  function polygon(n) {
    var pts = [];
    for (var i = 0; i < n; i++) pts.push([Math.cos(i / n * Math.PI * 2), Math.sin(i / n * Math.PI * 2)]);

  /* ─────────────── ambient layer (per theme, re-rolled) ─────────────── */
  var amb = { ribbons: [], rings: [], rain: [], grid: 0, sweep: 0, band: 0, dropNext: 0 };
  function ambientVariant() {
    var th = THEMES[mode] || THEMES.cyber;
    variantIx = (variantIx + 1 + ((Math.random() * (th.variants.length - 1)) | 0)) % th.variants.length;
    variantAt = now() + rnd(9000, 22000) / Math.max(0.4, CFG.VARIATION);
    return th.variants[variantIx];
  }
  function ensureAmbient() {
    if (!amb.ribbons.length) {
      for (var i = 0; i < 7; i++) amb.ribbons.push({
        a: Math.random() * Math.PI * 2, off: rnd(-0.4, 0.4), spin: rnd(-0.004, 0.004),
        hue: Math.random() * 360, w: rnd(0.05, 0.22), al: rnd(0.10, 0.26)
      });
    }
    if (!amb.rain.length) {
      for (var c = 0, ncol = Math.max(10, Math.round(46 * CFG.QUALITY)); c < ncol; c++) amb.rain.push({
        x: Math.random(), y: Math.random(), v: rnd(0.25, 1.0), depth: Math.random(),
        ch: [], n: 6 + (Math.random() * 10 | 0)

    }
  }
  var GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789ABCDEF#$%&@+=<>/\\|'.split('');
  function glyph() { return pick(GLYPHS); }

  var t0 = now();
  function drawAmbient(ts) {
    ensureAmbient();
    var variant = variantAt ? null : ambientVariant();
    if (variantAt && ts > variantAt) variant = ambientVariant();
    variant = variant || (THEMES[mode] || THEMES.cyber).variants[variantIx];
    var bass = audio.bass, tre = audio.treble;

    if (mode === 'matrix') { drawRain(variant, ts, bass, tre); return; }
    if (mode === 'gold')   { drawGoldAmbient(variant, ts, bass, tre); return; }
    if (mode === 'cyan')   { drawCyanAmbient(variant, ts, bass, tre); return; }
    drawCyberAmbient(variant, ts, bass, tre);
  }

  /* ---- CYBER: multi-hue ribbons / tunnel / storm ---- */
  function drawCyberAmbient(variant, ts, bass, tre) {
    var vivid = I() * (0.45 + audio.drive * 1.5);
    if (variant === 'ribbons' || variant === 'storm') {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      var n = Math.max(2, Math.round((variant === 'storm' ? 7 : 4) * CFG.QUALITY));
      for (var i = 0; i < n; i++) {
        var r = amb.ribbons[i];
        r.a += r.spin * (1 + tre * 0.9);
        r.hue = hueOf(r.hue + 0.10 + tre * 0.55);
        var cx = W * (0.5 + r.off), cy = H * (0.5 + r.off * 0.3);
        var reach = Math.max(W, H), cos = Math.cos(r.a), sin = Math.sin(r.a);
        var g = ctx.createLinearGradient(cx - cos * reach, cy - sin * reach, cx + cos * reach, cy + sin * reach);
        var a = r.al * vivid * 0.62;
        var h2 = hueOf(r.hue + 52);

        g.addColorStop(0.45, hsla(r.hue, a * 0.5));
        g.addColorStop(0.5, hsla((r.hue + h2) / 2, 0));
        g.addColorStop(0.55, hsla(h2, a * 0.5));
        g.addColorStop(1, hsla(h2, a));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      var rings = Math.max(3, Math.round((5 + (tre * 4 | 0)) * CFG.QUALITY));
      var phase = (ts / 2600) % 1;
      for (var k = 0; k < rings; k++) {
        var tt = ((phase + k / rings) % 1);
        var rad = tt * tt * Math.max(W, H) * 0.75;
        ctx.strokeStyle = hsla(themeHue(k * 42), (0.26 * (1 - tt) + 0.045) * vivid, 60);
        ctx.lineWidth = (0.8 + tt * 3.4) * (1 + bass * 0.8);
        ctx.beginPath();
        ctx.ellipse(W * 0.5, H * 0.5, rad, rad * 0.62, ts / 9000, 0, Math.PI * 2);
        ctx.stroke();

      ctx.restore();
    }
  }

  /* ---- MATRIX: parallax rain (3 depth layers) + cascade ---- */
  function drawRain(variant, ts, bass, tre) {
    var layerCount = variant === 'cascade' ? 3 : 3;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (var li = 0; li < layerCount; li++) {
      var depth = (li + 1) / layerCount;           /* 0.33 far … 1 near */
      var size = (9 + depth * 12) * (1 + bass * 0.25);
      ctx.font = 'bold ' + size.toFixed(0) + 'px "JetBrains Mono", monospace';
      var colCount = 18 + li * 12;
      var speed = (0.18 + depth * 0.55) * (1 + bass * 1.8) * I();
      for (var c = 0; c < colCount; c++) {
        var col = amb.rain[(c + li * 7) % amb.rain.length];
        col.y += speed * col.v * 0.016;
        if (col.y > 1.15) { col.y = -rnd(0.05, 0.4); col.v = rnd(0.25, 1.0); }
        var x = ((c / colCount) + (col.x * 0.02)) * W;
        var y = col.y * H;
        var alphaBase = (0.17 + depth * 0.48) * (0.75 + audio.drive * 1.3) * I();
        for (var k = 0; k < col.n; k++) {
          var gy = y - k * size * 1.05;
          if (gy < -size || gy > H + size) continue;
          var fade = 1 - k / col.n;
          if (k === 0) ctx.fillStyle = 'rgba(235,255,240,' + Math.min(0.95, alphaBase * 1.5).toFixed(3) + ')';
          else ctx.fillStyle = hsla(themeHue(-8 - fade * 16), alphaBase * fade * 0.9, 46 + fade * 26);
          ctx.fillText(col.ch[(k + ((ts / 110) | 0)) % col.ch.length], x, gy);
        }
        if (Math.random() < 0.004) col.ch[(Math.random() * col.n) | 0] = glyph();
      }
    }
    ctx.restore();
    /* flash columns on treble */
    if (tre > 0.32 && Math.random() < 0.14 * I()) {
      var fx = Math.random() * W;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = hsla(themeHue(6), 0.16 + tre * 0.28, 58);
      ctx.fillRect(fx, 0, 2 + tre * 6, H);
      ctx.restore();
    }
  }

  /* ---- VHS GOLD: tracking band + head-switch noise + grain ---- */
  function drawGoldAmbient(variant, ts, bass, tre) {
    var vivid = I() * (0.5 + audio.drive * 1.3);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    /* rolling tracking band */
    var bandY = ((ts / 1000) * (60 + bass * 300) * (variant === 'rewind' ? -1 : 1)) % (H + 160);
    if (bandY < 0) bandY += H + 160;
    var gy = bandY - 80;
    var lg = ctx.createLinearGradient(0, gy - 34, 0, gy + 34);
    lg.addColorStop(0, hsla(themeHue(0), 0));
    lg.addColorStop(0.5, hsla(themeHue(0), (0.32 + bass * 0.50) * vivid, 56));
    lg.addColorStop(1, hsla(themeHue(0), 0));
    ctx.fillStyle = lg;
    ctx.fillRect(0, gy - 34, W, 68);
    ctx.fillStyle = 'rgba(255,244,206,' + Math.min(0.95, (0.48 + tre * 0.55) * vivid).toFixed(3) + ')';
    ctx.fillRect(0, gy, W, 2);
    /* head-switching noise strip at the bottom */
    var nh = 10 + bass * 26;
    for (var i = 0, nhead = Math.round(90 * CFG.QUALITY); i < nhead; i++) {
      ctx.fillStyle = 'rgba(255,255,255,' + rnd(0.02, 0.14).toFixed(3) + ')';
      ctx.fillRect(Math.random() * W, H - nh + Math.random() * nh, rnd(2, 26), 1);
    }
    /* film grain */
    var grains = ((110 + vivid * 240) * CFG.QUALITY) | 0;
    ctx.fillStyle = 'rgba(255,224,150,0.18)';
    for (var g = 0; g < grains; g++) ctx.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
    ctx.restore();
    /* dropouts (v4 addition: real horizontal losses) */
    if (ts > amb.dropNext) {
      amb.dropNext = ts + rnd(320, 1400) / Math.max(0.4, I());
      var dy = Math.random() * H, dh = rnd(2, 9);

      ctx.fillRect(0, dy + dh, W, 1);
      ctx.restore();
    }
  }

  /* ---- CYAN: perspective grid + radar + scope ---- */
  function drawCyanAmbient(variant, ts, bass, tre) {
    var vivid = I() * (0.5 + audio.drive * 1.2);

      ctx.globalCompositeOperation = 'screen';
      ctx.strokeStyle = hsla(themeHue(0), (0.19 + bass * 0.18) * vivid, 58);
      ctx.lineWidth = 1;

      for (var i = -14; i <= 14; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * W * 0.045, hz);
        ctx.lineTo(cx + i * W * 0.22, H + 20);

        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();

      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      for (var ring = 1; ring <= 4; ring++) {
        ctx.beginPath(); ctx.arc(cx, cy, rad * ring / 4, 0, Math.PI * 2); ctx.stroke();
      }
      var ang = (ts / 1000) * (0.5 + bass * 2.2);
      var sg = ctx.createLinearGradient(cx, cy, cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad);
      sg.addColorStop(0, hsla(themeHue(0), (0.42 + bass * 0.45) * vivid, 62));
      sg.addColorStop(1, hsla(themeHue(0), 0));
      ctx.strokeStyle = sg; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad); ctx.stroke();

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = hsla(themeHue(6), (0.28 + tre * 0.42) * vivid, 60);

    ctx.stroke();
    ctx.restore();
  }

  /* ───────────────────────── burst rendering ───────────────────────── */
  function drawBursts(ts) {
    for (var i = bursts.length - 1; i >= 0; i--) {
      var b = bursts[i];
      var p = (ts - b.t0) / b.life;
      if (p >= 1) { bursts.splice(i, 1); continue; }
      var fade = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      try { drawBurst(b, p, fade, ts); } catch (e) {}
      ctx.restore();

  function drawBurst(b, p, fade, ts) {

      case 'slice':
        for (var i = 0; i < b.slices.length; i++) {
          var s = b.slices[i];
          ctx.fillStyle = hsla(themeHue(i * 36), 0.30 * k, 58);
          ctx.fillRect(s.off * W, s.y * H, W, s.h * H);
          ctx.fillStyle = hsla(themeHue(i * 36 + 180), 0.22 * k, 62);
          ctx.fillRect(-s.off * W * 0.6, s.y * H + 2, W, 2);

      case 'chromatic':
        ctx.fillStyle = hsla(th + 160, 0.22 * k, 60);
        ctx.fillRect(b.x * W - 8 * k, b.y * H, b.w * W, 3 + 6 * k);
        ctx.fillStyle = hsla(th - 160, 0.22 * k, 60);
        ctx.fillRect(b.x * W + 8 * k, b.y * H + 6, b.w * W, 3 + 6 * k);

          var py = (b.cy + b.pts[q][1] * b.r * (0.6 + p * 0.8)) * H;

        var g = ctx.createRadialGradient(b.cx * W, b.cy * H, 0, b.cx * W, b.cy * H, b.r * Math.max(W, H));

        g.addColorStop(1, hsla(themeHue(200), 0.05 * k));

          ctx.lineWidth = 2 + tt * 9;

          ctx.ellipse(b.cx * W, b.cy * H, tt * W * 0.7, tt * H * 0.5, r2, 0, Math.PI * 2);

        ctx.rotate(b.ang * Math.PI / 180);

        sg.addColorStop(0, hsla(themeHue(0), 0));

        sg.addColorStop(1, hsla(themeHue(0), 0));
        ctx.fillStyle = sg;
        ctx.fillRect(0, -H * 0.3, W * 0.4, H * 1.6);
        break;
      case 'cascade':
        ctx.font = 'bold ' + (13 + 8 * k).toFixed(0) + 'px "JetBrains Mono", monospace';
        for (var c = 0; c < b.cols.length; c++) {

          for (var j = 0; j < 12; j++) {
            var gy = yy - j * 17;
            if (gy < -20 || gy > H + 20) continue;
            var f = 1 - j / 12;
            ctx.fillStyle = j === 0 ? 'rgba(240,255,242,' + (0.8 * k).toFixed(3) + ')'
                                    : hsla(themeHue(-6 - f * 20), 0.30 * k * f, 50 + f * 24);
            ctx.fillText(glyph(), col.x * W, gy);

        break;
      case 'bootstrip':

        for (var li = 0; li < b.lines; li++) {

          ctx.fillStyle = hsla(themeHue(4), 0.28 * k, 60);

            if (Math.random() < 0.45) continue;
            ctx.fillStyle = hsla(themeHue(rnd(-12, 12)), 0.30 * k * rnd(0.4, 1), 54);

        }
        break;
      case 'tear':
        for (var t2 = 0; t2 < b.tears.length; t2++) {

      case 'rewind':
        for (var rb = 0; rb < b.bars; rb++) {
