<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Double-OH Six Home!</title>
  <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
    }
    html.imp006-arriving,
    html.imp006-arriving body {
      background: #fff;
    }
    #bp-embedded-webchat {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      box-shadow: none;
      border-radius: 0;
      overflow: hidden;
    }
  </style>
  <script>
    /* Paint white immediately if we arrived via the timed transition */
    try {
      if (sessionStorage.getItem('imp-006-transition') === '1') {
        document.documentElement.classList.add('imp006-arriving');
      }
    } catch (e) {}
  </script>
</head>
<body>

    <div id="bp-embedded-webchat">
      <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
      <script src="https://files.bpcontent.cloud/2025/07/16/18/20250716182151-D4S5G5R5.js" defer></script>
    </div>

    <div id="imp-006-transition" aria-hidden="true"></div>
  <script src="transitions.js"></script>
  <script>
/* inline fallback if transitions.js is missing */
/* transitions.js
   Timed page transition: index  →  Double-OH-Six
   Click is intercepted, a ~2s CRT glitch/snow/whiteout plays, THEN we navigate.
   Destination plays a ~1s reverse (white → static → page).
*/
(function () {
  'use strict';
  if (window.__imp006TransitLoaded) return;
  window.__imp006TransitLoaded = true;

  var FLAG = 'imp-006-transition';
  var DEST_RE = /double-oh-six\.html/i;
  var TRIGGER_SEL =
    '#quicklink-006, #widgetLink, #goToDoc, a[href*="double-oh-six.html"]';

  /* ---- timings (ms) — this is the whole point ---- */
  var EXIT = {
    fade: 280,
    storm: 1100,
    collapse: 420,
    white: 450
  };
  var ENTER = {
    hold: 180,
    storm: 520,
    fade: 420
  };

  var overlay = null;
  var canvas = null;
  var ctx = null;
  var caption = null;
  var busy = false;
  var snowBuf = null;

  function reducedMotion() {
    try {
      return window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {
      return false;
    }
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function ensure() {
    overlay = document.getElementById('imp-006-transition');
    if (!overlay) {
      var legacy = document.getElementById('transition');
      if (legacy) {
        legacy.id = 'imp-006-transition';
        overlay = legacy;
      }
    }
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'imp-006-transition';
      overlay.setAttribute('aria-hidden', 'true');
      (document.body || document.documentElement).appendChild(overlay);
    }

    canvas = overlay.querySelector('canvas.imp006-fx');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.className = 'imp006-fx';
      overlay.insertBefore(canvas, overlay.firstChild);
    }

    caption = overlay.querySelector('pre');
    if (!caption) {
      caption = document.createElement('pre');
      overlay.appendChild(caption);
    }
    caption.textContent =
      '127.0.0.1  CHANNEL 006\n' +
      '░▒▓█  DOUBLE-OH-SIX  █▓▒░\n' +
      'glitch drift  ·  standby';

    overlay.style.cssText = [
      'position:fixed',
      'inset:0',
      'z-index:2147483646',
      'display:block',
      'margin:0',
      'padding:0',
      'width:100vw',
      'height:100vh',
      'background:#000',
      'opacity:0',
      'pointer-events:none',
      'overflow:hidden'
    ].join(';');

    canvas.style.cssText = [
      'position:absolute',
      'inset:0',
      'width:100%',
      'height:100%',
      'display:block',
      'pointer-events:none'
    ].join(';');

    caption.style.cssText = [
      'position:absolute',
      'left:50%',
      'top:50%',
      'transform:translate(-50%,-50%)',
      'margin:0',
      'padding:24px',
      'z-index:2',
      'color:#e8e8e8',
      'font:14px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',
      'letter-spacing:0.6px',
      'text-align:center',
      'text-shadow:2px 0 #ff00ff,-2px 0 #00ffff,0 0 18px rgba(255,255,255,0.2)',
      'user-select:none',
      'white-space:pre',
      'pointer-events:none',
      'opacity:0'
    ].join(';');

    sizeCanvas();
    ctx = canvas.getContext('2d', { alpha: true });
    return overlay;
  }

  function sizeCanvas() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var w = Math.max(2, Math.floor(window.innerWidth * dpr));
    var h = Math.max(2, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      snowBuf = null;
    }
  }

  function noiseTile() {
    if (snowBuf) return snowBuf;
    var s = 128;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');
    var img = g.createImageData(s, s);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = (Math.random() * 255) | 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    snowBuf = c;
    return snowBuf;
  }

  function drawSnow(g, w, h, amount, t) {
    g.save();
    g.globalAlpha = amount;
    g.globalCompositeOperation = 'source-over';
    var tile = noiseTile();
    var ox = ((t * 0.35) | 0) % 128;
    var oy = ((t * 0.55) | 0) % 128;
    g.fillStyle = g.createPattern(tile, 'repeat');
    g.translate(-ox, -oy);
    g.fillRect(0, 0, w + 128, h + 128);
    g.restore();

    /* scanlines */
    g.save();
    g.globalAlpha = 0.18 + amount * 0.2;
    g.fillStyle = '#000';
    var step = Math.max(2, (h / 140) | 0);
    for (var y = 0; y < h; y += step) {
      g.fillRect(0, y, w, 1);
    }
    g.restore();

    /* tear bars */
    var tears = 3 + ((amount * 8) | 0);
    for (var i = 0; i < tears; i++) {
      if (Math.random() > amount * 0.9) continue;
      var ty = (Math.random() * h) | 0;
      var th = 1 + ((Math.random() * 8 * amount) | 0);
      var tx = ((Math.random() * 40 - 20) * amount) | 0;
      g.save();
      g.globalAlpha = 0.35 + Math.random() * 0.4;
      g.drawImage(canvas, 0, ty, w, th, tx, ty, w, th);
      g.restore();
    }
  }

  function showOverlay() {
    ensure();
    sizeCanvas();
    overlay.style.pointerEvents = 'auto';
    overlay.style.opacity = '1';
    overlay.style.background = '#000';
    caption.style.opacity = '1';
  }

  function hideOverlay() {
    if (!overlay) return;
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    caption.style.opacity = '0';
  }

  function runTimed(total, paint) {
    return new Promise(function (resolve) {
      var start = performance.now();
      function frame(now) {
        var elapsed = now - start;
        var p = Math.min(1, elapsed / total);
        try { paint(p, elapsed, now); } catch (e) {}
        if (elapsed < total) {
          requestAnimationFrame(frame);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function playExit() {
    showOverlay();
    var g = ctx;
    if (!g) {
      await wait(EXIT.fade + EXIT.storm + EXIT.collapse + EXIT.white);
      return;
    }

    var total = EXIT.fade + EXIT.storm + EXIT.collapse + EXIT.white;
    var a = EXIT.fade;
    var b = a + EXIT.storm;
    var c = b + EXIT.collapse;

    document.documentElement.style.filter =
      'contrast(1.35) saturate(1.4) brightness(1.05)';

    await runTimed(total, function (p, elapsed) {
      var w = canvas.width;
      var h = canvas.height;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, w, h);

      if (elapsed < a) {
        /* fade in dark glass */
        var k = elapsed / a;
        g.fillStyle = 'rgba(0,0,0,' + (0.35 + k * 0.55) + ')';
        g.fillRect(0, 0, w, h);
        drawSnow(g, w, h, 0.15 + k * 0.25, elapsed);
        caption.style.opacity = String(k);
        caption.style.transform =
          'translate(-50%,-50%) skewX(' + ((1 - k) * 8) + 'deg)';
      } else if (elapsed < b) {
        /* snowstorm + RGB split */
        var k = (elapsed - a) / EXIT.storm;
        var snow = 0.35 + k * 0.55;
        g.fillStyle = '#050508';
        g.fillRect(0, 0, w, h);

        var shakeX = (Math.random() - 0.5) * 14 * k;
        var shakeY = (Math.random() - 0.5) * 8 * k;
        g.save();
        g.translate(shakeX, shakeY);
        g.fillStyle = 'rgba(255,0,180,' + (0.12 + k * 0.12) + ')';
        g.fillRect(-10, 0, w + 20, h);
        g.fillStyle = 'rgba(0,255,255,' + (0.12 + k * 0.12) + ')';
        g.fillRect(10, 0, w + 20, h);
        g.restore();

        drawSnow(g, w, h, snow, elapsed);

        /* bright impulse speckles */
        g.fillStyle = '#fff';
        for (var i = 0; i < 18 * k; i++) {
          g.globalAlpha = Math.random();
          g.fillRect((Math.random() * w) | 0, (Math.random() * h) | 0,
                     1 + ((Math.random() * 10) | 0), 1);
        }
        g.globalAlpha = 1;

        caption.style.opacity = String(0.7 + Math.random() * 0.3);
        caption.style.transform =
          'translate(calc(-50% + ' + ((Math.random() - 0.5) * 12) + 'px),' +
          'calc(-50% + ' + ((Math.random() - 0.5) * 8) + 'px))';
      } else if (elapsed < c) {
        /* CRT collapse — squeeze to a horizontal beam */
        var k = (elapsed - b) / EXIT.collapse;
        var band = Math.max(2, h * (1 - k) * (1 - k));
        var y = (h - band) / 2;
        g.fillStyle = '#000';
        g.fillRect(0, 0, w, h);
        drawSnow(g, w, h, (1 - k) * 0.4, elapsed);
        var grd = g.createLinearGradient(0, y, 0, y + band);
        grd.addColorStop(0, 'rgba(255,255,255,0)');
        grd.addColorStop(0.45, 'rgba(200,255,255,0.9)');
        grd.addColorStop(0.5, '#fff');
        grd.addColorStop(0.55, 'rgba(255,180,255,0.9)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grd;
        g.fillRect(0, y, w, band);
        caption.style.opacity = String(Math.max(0, 1 - k * 1.4));
      } else {
        /* whiteout hold */
        var k = (elapsed - c) / EXIT.white;
        g.fillStyle = '#fff';
        g.fillRect(0, 0, w, h);
        g.globalAlpha = Math.max(0, 0.25 - k * 0.25);
        drawSnow(g, w, h, 0.2, elapsed);
        g.globalAlpha = 1;
        overlay.style.background = '#fff';
        caption.style.opacity = '0';
      }
    });

    document.documentElement.style.filter = '';
    overlay.style.background = '#fff';
    overlay.style.opacity = '1';
  }

  async function playEnter() {
    showOverlay();
    overlay.style.background = '#fff';
    overlay.style.opacity = '1';
    if (caption) caption.style.opacity = '0';

    var g = ctx;
    var total = ENTER.hold + ENTER.storm + ENTER.fade;
    var a = ENTER.hold;
    var b = a + ENTER.storm;

    await runTimed(total, function (p, elapsed) {
      if (!g) return;
      var w = canvas.width;
      var h = canvas.height;
      g.setTransform(1, 0, 0, 1, 0, 0);

      if (elapsed < a) {
        g.fillStyle = '#fff';
        g.fillRect(0, 0, w, h);
      } else if (elapsed < b) {
        var k = (elapsed - a) / ENTER.storm;
        g.fillStyle = '#050508';
        g.fillRect(0, 0, w, h);
        drawSnow(g, w, h, 0.7 - k * 0.4, elapsed);
        g.fillStyle = 'rgba(255,255,255,' + (1 - k) + ')';
        g.fillRect(0, 0, w, h);
        if (caption) {
          caption.style.opacity = String(0.35 * (1 - k));
        }
      } else {
        var k = (elapsed - b) / ENTER.fade;
        g.fillStyle = 'rgba(5,5,8,' + (1 - k) + ')';
        g.fillRect(0, 0, w, h);
        drawSnow(g, w, h, (1 - k) * 0.2, elapsed);
        overlay.style.opacity = String(1 - k);
      }
    });

    hideOverlay();
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function isModifiedClick(e) {
    return e.metaKey || e.ctrlKey || e.shiftKey || e.altKey ||
      (typeof e.button === 'number' && e.button !== 0);
  }

  function findAnchor(e) {
    var node = e.target;
    if (node && node.closest) {
      return node.closest(TRIGGER_SEL);
    }
    while (node && node !== document) {
      if (node.id === 'quicklink-006' || node.id === 'widgetLink' || node.id === 'goToDoc') {
        return node;
      }
      node = node.parentNode;
    }
    return null;
  }

  function shouldIntercept(anchor) {
    if (!anchor) return false;
    if (anchor.target && anchor.target !== '_self' && anchor.target !== '') return false;
    var href = anchor.getAttribute('href') || '';
    if (href.charAt(0) === '#') return false;
    if (anchor.id === 'quicklink-006' ||
        anchor.id === 'widgetLink' ||
        anchor.id === 'goToDoc') {
      return true;
    }
    return DEST_RE.test(href);
  }

  async function go(href) {
    if (busy) return;
    busy = true;
    href = href || 'double-oh-six.html';

    try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}

    try {
      if (reducedMotion()) {
        ensure();
        overlay.style.opacity = '1';
        overlay.style.background = '#fff';
        overlay.style.pointerEvents = 'auto';
        await wait(280);
      } else {
        await playExit();
      }
    } catch (e) {
      /* still navigate */
    }

    window.location.href = href;
  }

  function onClick(e) {
    var anchor = findAnchor(e);
    if (!anchor || !shouldIntercept(anchor)) return;
    if (isModifiedClick(e)) return;
    e.preventDefault();
    e.stopPropagation();
    var href = anchor.getAttribute('href') || 'double-oh-six.html';
    go(href);
  }

  window.imp006Transit = function (href, ev) {
    if (ev) {
      ev.preventDefault();
      ev.stopPropagation();
    }
    go(href || 'double-oh-six.html');
    return false;
  };

  function bindWidget() {
    var el = document.getElementById('quicklink-006') ||
             document.getElementById('widgetLink') ||
             document.getElementById('goToDoc');
    if (el && !el.__imp006Bound) {
      el.__imp006Bound = true;
      el.addEventListener('click', onClick, true);
    }
  }

  function init() {
    ensure();
    window.addEventListener('resize', sizeCanvas, { passive: true });
    document.addEventListener('click', onClick, true);
    bindWidget();

    var arriving = false;
    try {
      arriving = sessionStorage.getItem(FLAG) === '1';
      if (arriving) sessionStorage.removeItem(FLAG);
    } catch (e) {}

    var onDest = DEST_RE.test(location.pathname || '') ||
                 DEST_RE.test(location.href || '');

    if (arriving && onDest) {
      overlay.style.opacity = '1';
      overlay.style.background = '#fff';
      overlay.style.pointerEvents = 'auto';
      if (reducedMotion()) {
        wait(200).then(hideOverlay);
      } else {
        playEnter();
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>

</body>
</html>
