<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELERON // SIMULATION MATRIX</title>
<style>
:root {
  --text-main: #a49cb3;
  --bg-dark: #050208;
  --panel-bg: rgba(8, 4, 16, 0.94);
  --panel-border: rgba(164, 156, 179, 0.28);
  --accent: #a49cb3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-dark);
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  color: #fff;
}
#canvas-master-container {
  position: absolute; inset: 0; z-index: 1;
  background: #050208;
}
#cosmic-svg-layer {
  position: absolute; inset: 0; z-index: 1;
  width: 100%; height: 100%;
  pointer-events: none;
  display: block;
}
#webgl-engine-layer {
  position: absolute; inset: 0; z-index: 2;
  width: 100%; height: 100%;
}
#webgl-engine-layer canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}
.ui-terminal-wrapper {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 40px; pointer-events: none;
}
.ui-header { opacity: 0.65; }
.celeron-title {
  font-size: 1.2rem; letter-spacing: 4px;
  color: var(--text-main); margin-bottom: 6px;
  transition: color 0.8s ease;
}
.status-text {
  font-size: 0.65rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--text-main);
  transition: color 0.8s ease;
}
.hud-telemetry {
  display: flex; justify-content: space-between; width: 100%;
  font-size: 0.65rem; letter-spacing: 2px; opacity: 0.5;
}
.hud-column { display: flex; flex-direction: column; gap: 4px; }
.hud-column.right { text-align: right; }
.val { font-weight: bold; transition: color 0.8s ease; }

#ctrl-toggle {
  position: fixed; top: 50%; right: 0; transform: translateY(-50%);
  z-index: 200; width: 28px; height: 72px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border); border-right: none;
  border-radius: 8px 0 0 8px;
  color: var(--accent); font-size: 11px; letter-spacing: 1px;
  writing-mode: vertical-rl; text-orientation: mixed;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  pointer-events: auto; user-select: none;
}
#ctrl-toggle:hover { background: rgba(20,12,36,0.95); color: #fff; }
#ctrl-toggle.hidden { display: none; }

#ctrl-panel {
  position: fixed; top: 0; right: 0;
  width: 340px; height: 100%; z-index: 199;
  background: var(--panel-bg);
  border-left: 1px solid var(--panel-border);
  backdrop-filter: blur(14px);
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
  display: flex; flex-direction: column;
  font-size: 11px; color: #c8c0d4;
}
#ctrl-panel.open { transform: translateX(0); pointer-events: auto; }
#ctrl-panel.floating {
  top: 60px; right: auto; left: 80px;
  width: 360px; height: auto; max-height: 82vh;
  border: 1px solid var(--panel-border); border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  transform: none; transition: none; pointer-events: auto;
}
#ctrl-panel.floating.hidden-float { display: none; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0; user-select: none;
}
#ctrl-panel.floating .panel-header { cursor: grab; }
.panel-header h2 { font-size: 12px; letter-spacing: 3px; color: var(--accent); margin: 0; }
.header-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.hdr-btn {
  font-size: 9px; letter-spacing: 1px; padding: 4px 8px;
  background: rgba(164,156,179,0.12); border: 1px solid var(--panel-border);
  color: #c8c0d4; border-radius: 4px; cursor: pointer; font-family: inherit; text-transform: uppercase;
}
.hdr-btn:hover { background: rgba(164,156,179,0.3); color: #fff; }
.panel-body { padding: 16px 18px 40px; overflow-y: auto; flex: 1; }

.ctrl-section { margin-bottom: 20px; }
.ctrl-section h3 {
  font-size: 10px; letter-spacing: 2px; color: #887e9a;
  margin-bottom: 10px; text-transform: uppercase;
}
.ctrl-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
.ctrl-row label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; letter-spacing: 0.5px;
}
.ctrl-row label .val { color: #e0d8ec; min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
  background: rgba(164,156,179,0.2); border-radius: 2px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: none;
}
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none;
}
.color-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.color-row label { font-size: 10px; flex: 1; }
input[type="color"] {
  -webkit-appearance: none; width: 36px; height: 24px;
  border: 1px solid var(--panel-border); border-radius: 4px;
  background: transparent; cursor: pointer; padding: 0;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.toggle-row label { font-size: 10px; }
.toggle-btn {
  width: 40px; height: 20px; background: rgba(164,156,179,0.2);
  border-radius: 10px; position: relative; cursor: pointer; border: none;
}
.toggle-btn.on { background: rgba(164,156,179,0.55); }
.toggle-btn::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: #c8c0d4; transition: transform 0.2s;
}
.toggle-btn.on::after { transform: translateX(20px); background: #fff; }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.ctrl-btn {
  flex: 1; padding: 7px 0; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  background: rgba(164,156,179,0.12); border: 1px solid var(--panel-border);
  color: #c8c0d4; border-radius: 4px; cursor: pointer; font-family: inherit;
}
.ctrl-btn:hover { background: rgba(164,156,179,0.28); color: #fff; }
.ctrl-btn.active { background: rgba(100,220,140,0.25); border-color: rgba(100,220,140,0.5); color: #9eecc0; }
.audio-status {
  font-size: 9px; color: #776e8a; margin-bottom: 8px; padding: 6px 8px;
  background: rgba(0,0,0,0.25); border-radius: 4px; border: 1px solid rgba(164,156,179,0.12);
}
.audio-status.live { color: #9eecc0; border-color: rgba(100,220,140,0.3); }
.audio-status.err { color: #f0a0a0; border-color: rgba(220,100,100,0.3); }
.audio-meter { height: 6px; background: rgba(164,156,179,0.15); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.audio-meter-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #5a4a7a, #a49cb3, #e0d8ec); border-radius: 3px;
}
.meter-label { font-size: 9px; color: #776e8a; margin-top: 2px; display: flex; justify-content: space-between; }
.panel-body::-webkit-scrollbar { width: 5px; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(164,156,179,0.3); border-radius: 3px; }
</style>
</head>
<body>

<div id="canvas-master-container">
  <svg id="cosmic-svg-layer" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <radialGradient id="magnetic-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#221a30" stop-opacity="0.35" id="grad-stop-0"/>
        <stop offset="100%" stop-color="#050208" stop-opacity="0" id="grad-stop-1"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#magnetic-glow)"/>
    <g id="svg-stars-back"></g>
    <g id="svg-magnetic-back"></g>
    <g id="svg-magnetic-aberr-r"></g>
    <g id="svg-magnetic-aberr-b"></g>
    <g id="svg-belt-back"></g>
    <g id="svg-belt-aberr-r"></g>
    <g id="svg-belt-aberr-b"></g>
    <g id="svg-stars-front"></g>
    <g id="svg-magnetic-front"></g>
    <g id="svg-belt-front"></g>
  </svg>
  <div id="webgl-engine-layer"></div>
</div>

<div class="ui-terminal-wrapper">
  <header class="ui-header">
    <h1 class="celeron-title" id="main-title">CELERON — NOMINAL BASELINE</h1>
    <div class="status-text" id="status-text">Topology: Pure Nominal // Environmental State: Neutral</div>
  </header>
  <footer class="hud-telemetry">
    <div class="hud-column">
      <div>CORE LENS: <span class="val" id="lensing-val">PURE_NOMINAL</span></div>
      <div>MASS CONFIG: <span class="val" id="hud-mass">4.2M SOL</span></div>
    </div>
    <div class="hud-column right">
      <div>RELATIVISTIC VELOCITY: <span class="val" id="vel-val">0.10c</span></div>
      <div>RADIATION THRESHOLD: <span class="val" id="hud-rad">NATURAL FLUX</span></div>
    </div>
  </footer>
</div>

<button id="ctrl-toggle" type="button">CTRL</button>
<aside id="ctrl-panel">
  <div class="panel-header" id="panel-drag-handle">
    <h2>MATRIX CONTROLS</h2>
    <div class="header-btns">
      <button class="hdr-btn" id="btn-popout" type="button">POP OUT</button>
      <button class="hdr-btn" id="btn-dock" type="button" style="display:none">DOCK</button>
      <button class="hdr-btn" id="btn-hide" type="button">HIDE</button>
    </div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script type="importmap">

    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

function openDocked() {
  closeExternalPopup();
  panel.classList.remove('floating', 'hidden-float'); panel.classList.add('open');
  btnPopout.style.display = ''; btnDock.style.display = 'none';
  toggleBtn.classList.remove('hidden'); toggleBtn.textContent = 'CLOSE';
  isInternalFloat = false; panel.style.left = ''; panel.style.top = '';
}
function closeDocked() { panel.classList.remove('open'); toggleBtn.textContent = 'CTRL'; }
function openInternalFloat() {
  panel.classList.add('open', 'floating'); panel.classList.remove('hidden-float');
  btnPopout.style.display = 'none'; btnDock.style.display = '';
  toggleBtn.classList.add('hidden'); isInternalFloat = true;
  if (!panel.style.left) { panel.style.left = '80px'; panel.style.top = '60px'; }
}
function openExternalPopup() {
  if (popupWin && !popupWin.closed) { popupWin.focus(); return; }
  popupWin = window.open('about:blank', 'CeleronMatrixControls',
    'width=380,height=780,left=120,top=60,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes');
  if (!popupWin || popupWin.closed) { openInternalFloat(); return; }
  usingExternalPopup = true;
  const doc = popupWin.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CELERON CONTROLS</title><style>${POPUP_CSS}</style></head><body>
    <div class="panel-header"><h2>MATRIX CONTROLS</h2><div class="header-btns">
      <button class="hdr-btn" id="popup-dock">DOCK</button>
      <button class="hdr-btn" id="popup-close">CLOSE</button>
    </div></div><div class="panel-body">${CONTROLS_HTML}</div></body></html>`);
  doc.close();
  bindRoot(doc); syncRoot(doc);
  doc.getElementById('popup-dock').onclick = () => { closeExternalPopup(); openDocked(); };
  doc.getElementById('popup-close').onclick = () => closeExternalPopup();
  const poll = setInterval(() => {
    if (!popupWin || popupWin.closed) {
      clearInterval(poll); usingExternalPopup = false; popupWin = null;
      toggleBtn.classList.remove('hidden'); toggleBtn.textContent = 'CTRL';
    }
  }, 400);
  panel.classList.remove('open', 'floating'); toggleBtn.classList.add('hidden');
}
function closeExternalPopup() {
  if (popupWin && !popupWin.closed) popupWin.close();
  popupWin = null; usingExternalPopup = false;
  toggleBtn.classList.remove('hidden'); toggleBtn.textContent = 'CTRL';
}
toggleBtn.addEventListener('click', () => {
  if (usingExternalPopup) { if (popupWin && !popupWin.closed) popupWin.focus(); else openExternalPopup(); return; }
  if (isInternalFloat) {
    if (panel.classList.contains('hidden-float')) { panel.classList.remove('hidden-float'); toggleBtn.classList.add('hidden'); }
    else { panel.classList.add('hidden-float'); toggleBtn.classList.remove('hidden'); toggleBtn.textContent = 'CTRL'; }
    return;
  }
  if (panel.classList.contains('open')) closeDocked(); else openDocked();
});

const DENSITY_KEYS = new Set(['starCount', 'asteroidCount', 'fieldLines']);

function pushValToUI(id, value, dec) {
  const text = dec != null ? Number(value).toFixed(dec) : String(value);
  document.querySelectorAll(`[data-val="${id}"]`).forEach(el => { el.textContent = text; });
  if (popupWin && !popupWin.closed) {
    popupWin.document.querySelectorAll(`[data-val="${id}"]`).forEach(el => { el.textContent = text; });
  }
}
function pushInputToUI(key, value) {
  const sel = `[data-key="${key}"]`;
  document.querySelectorAll(sel).forEach(el => { if (String(el.value) !== String(value)) el.value = value; });
  if (popupWin && !popupWin.closed) {
    popupWin.document.querySelectorAll(sel).forEach(el => { if (String(el.value) !== String(value)) el.value = value; });
  }
}

function onParamChange(key, value, id, dec) {
  base[key] = value;
  if (id) pushValToUI(id, value, dec);
  if (DENSITY_KEYS.has(key)) initializePlanetarySystem();
  if (key === 'camY') camera.position.y = value;
  if (key === 'camDist') setCameraDistance(value);
  if (key === 'color' && !base.rainbow && !base.audioEnabled) {
    live.color = base.color; vectorMaterial.uniforms.uColor.value.set(live.color);
    svgColorStr = live.color;
    [mainTitle, statusText, licenseVal, velVal, hudRad].forEach(el => el.style.color = live.color);
  }
  if (key === 'glowColor' && !base.rainbow && !base.audioEnabled) {
    live.glowColor = base.glowColor; auraMat.uniforms.uColor.value.set(live.glowColor);
    gradStop0.setAttribute('stop-color', live.glowColor);
  }
  if (key === 'starColor' && !base.rainbow && !base.audioEnabled) {
    live.starColor = base.starColor; starColorStr = live.starColor;
  }
  pushInputToUI(key, value);
}

function bindRoot(root) {
  root.querySelectorAll('input[data-key]').forEach(el => {
    el.addEventListener('input', () => {
      const key = el.getAttribute('data-key');
      const id = el.getAttribute('data-id');
      const dec = el.hasAttribute('data-dec') ? parseInt(el.getAttribute('data-dec'), 10) : null;
      let val = el.type === 'color' ? el.value : parseFloat(el.value);
      if (DENSITY_KEYS.has(key)) val = parseInt(el.value, 10);
      onParamChange(key, val, id, dec);
    });
  });
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-toggle');
      base[key] = !base[key];
      setToggle(key, base[key]);
      if (key === 'autoCycle') startCycleTimer();
      if (key === 'rainbow') discoMat.uniforms.uActive.value = base.rainbow ? 1 : 0;
    });
  });
  root.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.getAttribute('data-action');
      if (act === 'start-audio') startWebAudio();
      if (act === 'stop-audio') stopWebAudio();
      if (act === 'next') { triggerState(); startCycleTimer(); }
      if (act === 'reset') doReset();
    });
  });
}
function setToggle(key, on) {
  document.querySelectorAll(`[data-toggle="${key}"]`).forEach(b => b.classList.toggle('on', on));
  if (popupWin && !popupWin.closed) {
    popupWin.document.querySelectorAll(`[data-toggle="${key}"]`).forEach(b => b.classList.toggle('on', on));
  }
}
function syncRoot(root) {
  root.querySelectorAll('input[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    const id = el.getAttribute('data-id');
    const dec = el.hasAttribute('data-dec') ? parseInt(el.getAttribute('data-dec'), 10) : null;
    const val = base[key];
    el.value = val;
    if (el.type !== 'color' && id) {
      const lab = root.querySelector(`[data-val="${id}"]`);
      if (lab) lab.textContent = dec != null ? Number(val).toFixed(dec) : val;
    }
  });
  setToggle('rainbow', base.rainbow);
  setToggle('audioEnabled', base.audioEnabled);
  setToggle('autoCycle', base.autoCycle);
}
function syncAll() {
  syncRoot(document);
  if (popupWin && !popupWin.closed) syncRoot(popupWin.document);
}
bindRoot(document);

/* audio */
let audioCtx = null, analyser = null, mediaStream = null, freqData = null, webAudioOn = false;
function processAudio(arr) {
  if (!arr || arr.length < 16) return;
  const len = arr.length, use = len >= 128 ? Math.floor(len / 2) : len;
  let bSum = 0, mSum = 0, hSum = 0;
  const bEnd = Math.max(1, Math.floor(use * 0.12));
  const mEnd = Math.max(bEnd + 1, Math.floor(use * 0.45));
  for (let i = 0; i < use; i++) {
    let v = arr[i]; if (v > 1.5) v /= 255; v = Math.abs(v);
    if (i < bEnd) bSum += v; else if (i < mEnd) mSum += v; else hSum += v;
  }
  audioState.bass = Math.min(1, (bSum / bEnd) * base.audioSens * 2.4);
  audioState.mid  = Math.min(1, (mSum / (mEnd - bEnd)) * base.audioSens * 1.9);
  audioState.high = Math.min(1, (hSum / (use - mEnd || 1)) * base.audioSens * 1.7);
  audioState.energy = Math.min(1, audioState.bass * 0.5 + audioState.mid * 0.3 + audioState.high * 0.2);
  const now = performance.now();
  if (audioState.bass > 0.55 && audioState.bass > audioState.smoothBass * 1.35 && now - audioState.lastBeatTime > 200) {
    audioState.beat = 1; audioState.lastBeatTime = now;
  }
}
async function startWebAudio() {
  if (webAudioOn) return;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:2 }, video: false
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.35;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    webAudioOn = true;
    if (!base.audioEnabled) { base.audioEnabled = true; setToggle('audioEnabled', true); }
    setAudioStatus('Audio: LIVE (default recording device)', 'live'); markStartBtn(true);
  } catch (e) { setAudioStatus('Audio error: ' + (e.message || 'denied'), 'err'); markStartBtn(false); }
}
function stopWebAudio() {
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  mediaStream = null;
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null; analyser = null; freqData = null; webAudioOn = false;
  setAudioStatus('Audio: stopped', ''); markStartBtn(false);
}
function setAudioStatus(msg, type) {
  document.querySelectorAll('[data-audio-status]').forEach(el => {
    el.textContent = msg; el.className = 'audio-status' + (type ? ' ' + type : '');
  });
  if (popupWin && !popupWin.closed) {
    popupWin.document.querySelectorAll('[data-audio-status]').forEach(el => {
      el.textContent = msg; el.className = 'audio-status' + (type ? ' ' + type : '');
    });
  }
}
function markStartBtn(on) {
  document.querySelectorAll('[data-action="start-audio"]').forEach(b => b.classList.toggle('active', on));
  if (popupWin && !popupWin.closed) {
    popupWin.document.querySelectorAll('[data-action="start-audio"]').forEach(b => b.classList.toggle('active', on));
  }
}
if (window.wallpaperRegisterAudioListener) {
  window.wallpaperRegisterAudioListener(arr => {
    processAudio(arr);
    if (!webAudioOn) setAudioStatus('Audio: LIVE (Wallpaper Engine)', 'live');
  });
  setAudioStatus('Wallpaper Engine detected — audio ready', 'live');
}

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.05;
orbit.enableZoom = true;          // mouse-wheel zoom
orbit.zoomSpeed = 1.0;
orbit.minDistance = 18;
orbit.maxDistance = 80;
orbit.autoRotate = true;
orbit.autoRotateSpeed = base.rotate;
orbit.target.set(0, 0, 0);

function setCameraDistance(d) {
  d = THREE.MathUtils.clamp(d, orbit.minDistance, orbit.maxDistance);
  const dir = new THREE.Vector3().subVectors(camera.position, orbit.target).normalize();
  if (dir.lengthSq() < 1e-6) dir.set(0, 0.2, 1).normalize();
  camera.position.copy(orbit.target).addScaledVector(dir, d);
  camControl.distance = d;
  base.camDist = Math.round(d);
}

// Sync slider when user zooms with wheel
orbit.addEventListener('change', () => {
  if (!uiCamDistSync) return;
  const d = camera.position.distanceTo(orbit.target);
  if (Math.abs(d - camControl.distance) < 0.05) return;
  camControl.distance = d;
  base.camDist = Math.round(d);
  pushValToUI('camDist', base.camDist, null);
  pushInputToUI('camDist', base.camDist);
});

const discoMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:{value:0}, uActive:{value:0}, uDensity:{value:1},
    uEnergy:{value:0}, uBeat:{value:0}, uBass:{value:0}, uMid:{value:0}, uHigh:{value:0},
    uChroma:{value:0}, uResolution:{value:new THREE.Vector2(width,height)}
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,

    }

    for (let j = 0; j <= ringSegments; j++) {

function sampleFieldLine(lon, L, t, pulse, chaos) {

    x: r * sinT * Math.cos(lon),
    y: r * Math.cos(theta) * live.compress,

}

function hexToHsl(hex) {

  const max = Math.max(r,g,b), min = Math.min(r,g,b);

}
function hslToHex(h, s, l) {

function updateColorSystem(dt) {
  const mainBase = hexToHsl(base.color);
  const auraBase = hexToHsl(base.glowColor);
  const starBase = hexToHsl(base.starColor);
  const bass = audioState.smoothBass, mid = audioState.smoothMid, high = audioState.smoothHigh;
  const energy = audioState.smoothEnergy, beat = audioState.beat;
  const audioOn = base.audioEnabled, rainbowOn = base.rainbow;

  let speed = base.hueSpeed * 40 * dt;
  if (audioOn) speed *= (1 + energy * base.hueBoost + beat * 0.8);
  if (rainbowOn) speed *= 2.5;
  if (rainbowOn || audioOn) rainbowHue = (rainbowHue + speed) % 360;

  const cStr = base.chromaStr * (rainbowOn ? 2.4 : 1);
  chroma.amount = 0;
  if (audioOn || rainbowOn) {
    chroma.amount = Math.min(2.5, (bass * 0.45 + mid * 0.35 + high * 0.55 + beat * 0.8 + (rainbowOn ? 0.6 : 0)) * cStr);
    const punch = 1 + beat * 2.2 + (rainbowOn ? 1.5 : 0);
    chroma.oxR = (bass * 6 + high * 3 + (rainbowOn ? 8 : 0)) * cStr * punch;
    chroma.oyR = (high * 5 + mid * 2 + (rainbowOn ? 6 : 0)) * cStr * punch * 0.7;
    chroma.oxB = -chroma.oxR * 0.9;
    chroma.oyB = -chroma.oyR * 1.1;
  }

  discoMat.uniforms.uActive.value = rainbowOn ? 1 : 0;
  discoMat.uniforms.uDensity.value = base.discoDensity;
  discoMat.uniforms.uEnergy.value = energy;
  discoMat.uniforms.uBeat.value = beat;
  discoMat.uniforms.uBass.value = bass;
  discoMat.uniforms.uMid.value = mid;
  discoMat.uniforms.uHigh.value = high;
  discoMat.uniforms.uChroma.value = chroma.amount;
  discoMat.uniforms.uResolution.value.set(width, height);

  if (!rainbowOn && !audioOn) {
    live.color = base.color; live.glowColor = base.glowColor; live.starColor = base.starColor;
    starColorStr = live.starColor; svgColorStr = live.color;
    chroma.amount = 0;
    vectorMaterial.uniforms.uChroma.value = 0;
    auraMat.uniforms.uChroma.value = 0;
    return;
  }

  const mainHueTarget = (rainbowHue + bass * 50 + beat * 30) % 360;
  const mainHue = lerpHue(mainBase.h, mainHueTarget, rainbowOn ? 1 : Math.min(1, energy * 1.2 + 0.25));
  const mainS = lerp(mainBase.s, Math.min(100, mainBase.s + energy * 25 + beat * 15), 0.7);
  const mainL = lerp(mainBase.l, Math.min(70, Math.max(35, mainBase.l + beat * 12 - bass * 5)), 0.6);
  const auraHueInv = invertHue(mainHue);
  const auraHueShift = (mainHue + 120 + mid * 80) % 360;
  const invMix = base.invertMix;
  const auraHue = lerpHue(auraHueShift, auraHueInv, invMix * (0.55 + mid * 0.45));
  const auraS = lerp(auraBase.s, Math.min(100, 55 + mid * 40), 0.75);
  const auraLInv = invertLightness(mainL);
  const auraL = lerp(lerp(auraBase.l, auraLInv, invMix * 0.7), Math.min(48, 18 + bass * 25), 0.5);
  const starHueInv = invertHue(auraHue);
  const starHueTri = (mainHue + 240 + high * 90) % 360;
  const starHue = lerpHue(starHueTri, starHueInv, invMix * (0.4 + high * 0.5));
  const starS = lerp(starBase.s, Math.min(100, 60 + high * 40 + beat * 20), 0.8);
  const starLInv = invertLightness(auraL);
  const starL = lerp(Math.max(55, starBase.l), Math.min(95, starLInv * 0.5 + 55 + high * 25), 0.65);

  live.color = hslToHex(mainHue, mainS, mainL);
  live.glowColor = hslToHex(auraHue, auraS, auraL);
  live.starColor = hslToHex(starHue, starS, starL);
  svgColorStr = live.color; starColorStr = live.starColor;
  chroma.colR = hslToHex((mainHue + 10) % 360, 95, 55);
  chroma.colG = hslToHex((mainHue + 120) % 360, 90, 50);
  chroma.colB = hslToHex((mainHue + 200) % 360, 95, 55);
  const ch = Math.min(1.5, chroma.amount);
  vectorMaterial.uniforms.uChroma.value = ch;
  vectorMaterial.uniforms.uChromaR.value.set(chroma.colR);
  vectorMaterial.uniforms.uChromaB.value.set(chroma.colB);
  auraMat.uniforms.uChroma.value = ch;
  auraMat.uniforms.uChromaR.value.set(chroma.colR);
  auraMat.uniforms.uChromaB.value.set(chroma.colB);
  mainTitle.style.color = live.color;
  statusText.style.color = live.color;
}

function applyLive() {
  vectorMaterial.uniforms.uMorph.value = live.morph;
  vectorMaterial.uniforms.uCompression.value = live.compress;
  vectorMaterial.uniforms.uIntensity.value = live.intensity;
  auraMat.uniforms.uIntensity.value = live.intensity;
  orbit.autoRotateSpeed = live.rotate;
  vectorMaterial.uniforms.uColor.value.set(live.color);
  auraMat.uniforms.uColor.value.set(live.glowColor);
  gradStop0.setAttribute('stop-color', live.glowColor);
  currentAstSpeed = live.astSpeed;
  currentAstChaos = live.astChaos;
  currentFieldPulse = live.fieldPulse;
  svgColorStr = live.color;
  starColorStr = live.starColor;
}

/** Apply a full config state to ALL sliders (densities included) */
function applyConfigState(n, animateCore = true) {
  const densityChanged =
    base.starCount !== n.starCount ||
    base.asteroidCount !== n.asteroidCount ||
    base.fieldLines !== n.fieldLines;

  // numeric / color keys present on every preset
  const keys = [
    'starCount','asteroidCount','fieldLines',
    'morph','compress','intensity','rotate','camY','camDist',
    'color','glowColor','starColor',
    'astSpeed','astChaos','fieldPulse','shellSpeed',
    'hueSpeed','hueBoost','chromaStr','invertMix','discoDensity'
  ];
  keys.forEach(k => {
    if (n[k] !== undefined) base[k] = n[k];
  });

  Object.assign(live, {
    morph: base.morph, compress: base.compress, intensity: base.intensity,
    rotate: base.rotate, camY: base.camY, camDist: base.camDist,
    color: base.color, glowColor: base.glowColor, starColor: base.starColor,
    astSpeed: base.astSpeed, astChaos: base.astChaos, fieldPulse: base.fieldPulse
  });

  if (animateCore) {
    const tl = gsap.timeline({ defaults: { duration: 2.8, ease: 'power2.inOut' } });
    tl.to(vectorMaterial.uniforms.uMorph, { value: n.morph }, 0);
    tl.to(vectorMaterial.uniforms.uCompression, { value: n.compress }, 0);
    tl.to(vectorMaterial.uniforms.uIntensity, { value: n.intensity }, 0);
    tl.to(auraMat.uniforms.uIntensity, { value: n.intensity }, 0);
    tl.to(orbit, { autoRotateSpeed: n.rotate }, 0);
    tl.to(camera.position, {
      y: n.camY,
      onUpdate: () => { /* keep orbit consistent */ }
    }, 0);
    // cam distance
    const fromD = camControl.distance;
    const proxy = { d: fromD };
    tl.to(proxy, {
      d: n.camDist, duration: 2.8, ease: 'power2.inOut',
      onUpdate: () => setCameraDistance(proxy.d)
    }, 0);
    const c = new THREE.Color(n.color), g = new THREE.Color(n.glowColor);
    tl.to(vectorMaterial.uniforms.uColor.value, { r:c.r, g:c.g, b:c.b }, 0);
    tl.to(auraMat.uniforms.uColor.value, { r:g.r, g:g.g, b:g.b }, 0);
  } else {
    applyLive();
    camera.position.y = base.camY;
    setCameraDistance(base.camDist);
  }

  currentAstSpeed = base.astSpeed;
  currentAstChaos = base.astChaos;
  currentFieldPulse = base.fieldPulse;
  svgColorStr = base.color;
  starColorStr = base.starColor;
  gradStop0.setAttribute('stop-color', base.glowColor);

  if (densityChanged) initializePlanetarySystem();
  syncAll();
}

function triggerState() {
  stateIdx = (stateIdx + 1) % config.length;
  const n = config[stateIdx];
  applyConfigState(n, true);
  gsap.to([mainTitle, statusText, licenseVal, velVal, hudRad], {
    opacity: 0, duration: 0.5,
    onComplete: () => {
      mainTitle.innerText = n.title; mainTitle.style.color = n.color;
      statusText.innerText = n.status; statusText.style.color = n.color;
      licenseVal.innerText = n.license; licenseVal.style.color = n.color;
      velVal.innerText = n.vel; velVal.style.color = n.color;
      hudRad.innerText = n.rad; hudRad.style.color = n.color;
      gsap.to([mainTitle, statusText, licenseVal, velVal, hudRad], { opacity: 0.65, duration: 0.7 });
    }
  });
}
function startCycleTimer() {
  if (cycleTimer) clearInterval(cycleTimer);
  if (base.autoCycle) cycleTimer = setInterval(triggerState, 8000);
}
function doReset() {
  stateIdx = 0;
  applyConfigState(config[0], false);
  discoMat.uniforms.uActive.value = 0;
  base.rainbow = false; base.audioEnabled = false; base.autoCycle = true;
  setToggle('rainbow', false); setToggle('audioEnabled', false); setToggle('autoCycle', true);
  mainTitle.innerText = config[0].title; mainTitle.style.color = config[0].color;
  statusText.innerText = config[0].status; statusText.style.color = config[0].color;
  licenseVal.innerText = config[0].license; licenseVal.style.color = config[0].color;
  velVal.innerText = config[0].vel; velVal.style.color = config[0].color;
  hudRad.innerText = config[0].rad; hudRad.style.color = config[0].color;
  startCycleTimer();
}

const clock = new THREE.Clock();
function loop() {
  const time = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  if (webAudioOn && analyser && freqData) {
    analyser.getByteFrequencyData(freqData);
    processAudio(freqData);
  }

  const sm = 8;
  audioState.smoothBass   += (audioState.bass   - audioState.smoothBass)   * Math.min(1, dt * sm);
  audioState.smoothMid    += (audioState.mid    - audioState.smoothMid)    * Math.min(1, dt * sm);
  audioState.smoothHigh   += (audioState.high   - audioState.smoothHigh)   * Math.min(1, dt * sm);
  audioState.smoothEnergy += (audioState.energy - audioState.smoothEnergy) * Math.min(1, dt * sm);
  audioState.beat = Math.max(0, audioState.beat - dt * 4.5);

  [['bass', audioState.smoothBass], ['mid', audioState.smoothMid],
   ['high', audioState.smoothHigh], ['energy', audioState.smoothEnergy]].forEach(([name, v]) => {
    const pct = Math.round(v * 100) + '%';
    document.querySelectorAll(`[data-meter="${name}"]`).forEach(el => el.style.width = pct);
    document.querySelectorAll(`[data-meter-val="${name}"]`).forEach(el => el.textContent = pct);
    if (popupWin && !popupWin.closed) {
      popupWin.document.querySelectorAll(`[data-meter="${name}"]`).forEach(el => el.style.width = pct);
      popupWin.document.querySelectorAll(`[data-meter-val="${name}"]`).forEach(el => el.textContent = pct);
    }
  });

  if (base.audioEnabled) {
    const b = audioState.smoothBass * base.bassInf;
    const m = audioState.smoothMid * base.midInf;
    const h = audioState.smoothHigh * base.highInf;
    const beat = audioState.beat * base.beatPunch;
    live.morph = base.morph + b * 1.8 + beat * 0.6;
    live.intensity = base.intensity + b * 2.2 + beat * 1.1;
    live.astChaos = base.astChaos + m * 0.9 + beat * 0.35;
    live.fieldPulse = base.fieldPulse + m * 3.5 + beat * 2;
    live.rotate = base.rotate + h * 2.5 + beat * 0.8;
    live.astSpeed = base.astSpeed + h * 1.8 + beat * 0.5;
    live.compress = base.compress;
  } else {
    live.morph = base.morph; live.intensity = base.intensity;
    live.astChaos = base.astChaos; live.fieldPulse = base.fieldPulse;
    live.rotate = base.rotate; live.astSpeed = base.astSpeed;
    live.compress = base.compress;
  }

  updateColorSystem(dt);
  applyLive();

  discoMat.uniforms.uTime.value = time;
  vectorMaterial.uniforms.uTime.value = time;
  auraMat.uniforms.uTime.value = time;
  coreGroup.rotation.y = time * 0.02;

  // OrbitControls handles zoom + rotate; keep camControl in sync
  orbit.update();
  camControl.distance = camera.position.distanceTo(orbit.target);

  animatePlanetary(time);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  width = window.innerWidth; height = window.innerHeight;
  camera.aspect = width / height; camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  discoMat.uniforms.uResolution.value.set(width, height);
  initializePlanetarySystem();
});

initializePlanetarySystem();
setCameraDistance(base.camDist);
applyLive();
syncAll();
loop();
startCycleTimer();
</script>
