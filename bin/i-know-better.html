    .ikb-main {
      flex: 1;
      display: flex;
      flex-direction: column;

    .ikb-stage {
      width: min(1240px, 96vw);

      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 36px rgba(43, 255, 109, 0.16);

    .ikb-time {

<body>
  <header class="ikb-topbar">
    <div class="ikb-brand">
      <span class="ikb-dot"></span>
      <div>
        <div class="ikb-title">I KNOW BETTER</div>
        <div class="ikb-sub">foobar2000_zu7N7Bp2vz.mp4 // imortalimp.nl Popout Video Player</div>
      </div>
    </div>
    <div class="ikb-actions">
      <button type="button" class="ikb-btn" id="btnPip">⧉ Picture-in-Picture</button>
      <button type="button" class="ikb-btn" id="btnFs">⛶ Fullscreen</button>
      <a class="ikb-btn" href="/foobar2000_zu7N7Bp2vz.mp4" download="foobar2000_zu7N7Bp2vz.mp4">⬇ Download .MP4</a>
      <a class="ikb-btn amber" href="/index.html">⬅ Back to imortalimp.nl</a>
    </div>
  </header>

  <main class="ikb-main">
    <div class="ikb-stage">
      <video id="ikbVideo" controls autoplay playsinline>
        <source src="/foobar2000_zu7N7Bp2vz.mp4" type="video/mp4" />
        <source src="https://www.imortalimp.nl/foobar2000_zu7N7Bp2vz.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>
    </div>

    <div class="ikb-deck">
      <div class="ikb-seek-row">
        <input type="range" id="ikbSeek" class="ikb-seek" min="0" max="1000" value="0" step="1" />
        <span class="ikb-time" id="ikbTime">00:00 / 00:00</span>
      </div>
      <div class="ikb-controls-row">
        <div class="ikb-left-ctrls">
          <button type="button" class="ikb-btn" id="btnPlayPause">⏸ PAUSE</button>
          <button type="button" class="ikb-btn" id="btnRestart">↺ RESTART</button>
          <button type="button" class="ikb-btn" id="btnBack10">⏪ -10s</button>
          <button type="button" class="ikb-btn" id="btnFwd10">⏩ +10s</button>
          <button type="button" class="ikb-btn" id="btnLoop">🔁 LOOP: OFF</button>
        </div>
        <div class="ikb-right-ctrls">
          <button type="button" class="ikb-btn" id="btnMute">🔊 MUTE</button>
          <input type="range" id="ikbVol" min="0" max="1" step="0.02" value="1" style="width:88px; accent-color:#2bff6d;" />
          <select id="ikbSpeed" class="ikb-select" aria-label="Playback Speed">
            <option value="0.5">0.5× Speed</option>
            <option value="0.75">0.75× Speed</option>
            <option value="1" selected>1.0× Speed</option>
            <option value="1.25">1.25× Speed</option>
            <option value="1.5">1.5× Speed</option>
            <option value="2">2.0× Speed</option>
          </select>
        </div>
      </div>
    </div>
  </main>

  <script>
  (function () {
    var vid = document.getElementById("ikbVideo");
    var seek = document.getElementById("ikbSeek");
    var timeEl = document.getElementById("ikbTime");
    var btnPlay = document.getElementById("btnPlayPause");
    var btnRestart = document.getElementById("btnRestart");
    var btnBack10 = document.getElementById("btnBack10");
    var btnFwd10 = document.getElementById("btnFwd10");
    var btnLoop = document.getElementById("btnLoop");
    var btnMute = document.getElementById("btnMute");
    var vol = document.getElementById("ikbVol");
    var speed = document.getElementById("ikbSpeed");
    var btnPip = document.getElementById("btnPip");
    var btnFs = document.getElementById("btnFs");

    function fmt(s) {
      if (!isFinite(s) || s < 0) return "00:00";
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function syncUI() {
      btnPlay.textContent = vid.paused ? "▶ PLAY" : "⏸ PAUSE";
      btnMute.textContent = vid.muted ? "🔇 UNMUTE" : "🔊 MUTE";
      btnLoop.textContent = "🔁 LOOP: " + (vid.loop ? "ON" : "OFF");
      var d = vid.duration || 0;
      var c = vid.currentTime || 0;
      timeEl.textContent = fmt(c) + " / " + fmt(d);
      if (d > 0) seek.value = String(Math.round((c / d) * 1000));
    }

    ["play", "pause", "timeupdate", "loadedmetadata", "volumechange"].forEach(function (ev) {
      vid.addEventListener(ev, syncUI);
    });

    btnPlay.addEventListener("click", function () {
      if (vid.paused) vid.play(); else vid.pause();
    });
    btnRestart.addEventListener("click", function () {
      vid.currentTime = 0;
      vid.play();
    });
    btnBack10.addEventListener("click", function () {
      vid.currentTime = Math.max(0, (vid.currentTime || 0) - 10);
    });
    btnFwd10.addEventListener("click", function () {
      if (isFinite(vid.duration)) vid.currentTime = Math.min(vid.duration, (vid.currentTime || 0) + 10);
    });
    btnLoop.addEventListener("click", function () {
      vid.loop = !vid.loop;
      syncUI();
    });
    btnMute.addEventListener("click", function () {
      vid.muted = !vid.muted;
      syncUI();
    });
    vol.addEventListener("input", function () {
      vid.volume = parseFloat(vol.value);
      if (vid.volume > 0 && vid.muted) vid.muted = false;
    });
    speed.addEventListener("change", function () {
      vid.playbackRate = parseFloat(speed.value) || 1;
    });
    seek.addEventListener("input", function () {
      if (isFinite(vid.duration) && vid.duration > 0) {
        vid.currentTime = (parseFloat(seek.value) / 1000) * vid.duration;
      }
    });
    btnPip.addEventListener("click", function () {
      if (document.pictureInPictureElement) document.exitPictureInPicture();
      else if (vid.requestPictureInPicture) vid.requestPictureInPicture();
    });
    btnFs.addEventListener("click", function () {
      if (vid.requestFullscreen) vid.requestFullscreen();
    });
  })();
  </script>
</body>
</html>
