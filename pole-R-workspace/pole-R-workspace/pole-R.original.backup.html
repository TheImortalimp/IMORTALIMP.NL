## 1. The file

\`pole - R.html\` is one self-contained file of about 600 KB (about 177 KB gzip): JS, CSS, the entry
screen, the delivery kit and a copy of the source for the zip export. When it
runs it only needs:

- **your album files** at \`/bin/pole - R/\`, which are already there and verified
  (§ 5)
- **Google Fonts**, for the typography (it falls back to system fonts offline)

Get it from the preview's delivery kit (**↓ pole - R.html**), or run
\`npm run build\` and rename \`dist/index.html\`.

**Do not upload the repository-root \`index.html\`.** That is Vite's development
shell and requests \`/src/main.tsx\`, which is TypeScript/JSX source and is not
browser-ready. This is why the current upload at
\`/create-animated-music-showcase/index.html\` returns an empty/unrendered page.
The requested URL itself works; the file served there is the wrong build stage.

## 2. Where to upload it

**Anywhere on imortalimp.nl.** Every media path is root-absolute
(\`/bin/pole - R/…\`) and "back to index" goes to \`/\`, so the location doesn't
matter:

\`\`\`
imortalimp.nl/
├── index.html                  ← your homepage
├── create-animated-music-showcase/
│   └── index.html              ← upload the CONTENTS of dist/index.html here
│                                 URL: https://www.imortalimp.nl/create-animated-music-showcase/index.html
└── bin/
    └── pole - R/               ← album (already live)
        ├── pole - R - 01 raum 1 variation.mp3
        ├── …
        ├── pole - R - 10 raum 2 variation (Kit clayton).mp3
        └── cover.jpg
\`\`\`

A subfolder such as \`/pole-r/pole - R.html\` works just as well, and so does
putting it inside \`/bin/pole - R/\`.

## 3. Linking it from your homepage (popout)

This opens the page as a popout window. Without JavaScript it's a plain link.
The kit in § 03 generates the snippet for whatever upload path you type in.

\`\`\`html
<a href="/create-animated-music-showcase/index.html"
   onclick="window.open(this.href,'poleR','width=1400,height=900,resizable=yes,scrollbars=yes');return false;"
   style="display:inline-flex;gap:16px;align-items:center;padding:16px 20px;border:1px solid rgba(255,255,255,.18);background:#0d0d11;color:#e8e8ec;font:400 12px/1.45 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;text-decoration:none">
  <span style="font:900 46px/.8 'Arial Narrow',Impact,sans-serif">R</span>
  <span>pole — r · ~scape 2001<br><span style="opacity:.55">10 raum variations · live fft archive &rarr;</span></span>
</a>
\`\`\`

When the page is running as that popout, "← index" closes it and brings your
homepage back to the front, instead of loading the homepage inside the popout.

## 4. How the page finds the music, per location

| page opened from | media requested from | analysis |
| --- | --- | --- |
| **imortalimp.nl** / www | \`/bin/pole - R/…\` (same-origin) | ✅ **live FFT** — plate, scopes, numerals all follow the real audio |
| Arena preview · localhost | \`https://imortalimp.nl/bin/pole - R/…\` | ⚠️ **mirror mode** — real audio plays, visuals follow a silent simulated signal |
| double-clicked file on disk | \`https://imortalimp.nl/bin/pole - R/…\` | ⚠️ **mirror mode** (same reason) |

**Why mirror mode?** Your server sends no \`Access-Control-Allow-Origin\` header
(checked live). So when the page runs on another origin, browsers will let it
*play* your files but not *read* the audio samples or cover pixels. The page
notices this automatically, plays the audio through a separate route that
bypasses the analyser (so it isn't muted), and labels itself *MIRROR*. On your
own domain this never happens.

### Optional: live FFT everywhere

Put a file named \`.htaccess\` in \`/bin/pole - R/\` containing:

\`\`\`apache
<IfModule mod_headers.c>
  <FilesMatch "\\.(mp3|jpe?g|png)$">
    Header set Access-Control-Allow-Origin "*"
  </FilesMatch>
</IfModule>
\`\`\`

The files are already public, so this only lets other pages (the preview, a
local copy) analyse them as well as play them. The live site doesn't need it.

Overrides: \`?media=local\` forces root-relative paths (for a self-hosted mirror
of \`/bin\`), and \`?kit\` shows the delivery kit on the live domain.

## 5. Server verification (live checks)

| check | result |
| --- | --- |
| \`/bin/pole - R/\` exists | ✅ 403 (listing disabled); fake folders return 404 |
| folder casing | ✅ exactly \`pole - R\`: \`Pole - R\` and \`pole - r\` both return 404 |
| all 10 tracks | ✅ 10/10 → \`206 Partial Content\`, \`audio/mpeg\` |
| seeking (range requests) | ✅ \`accept-ranges: bytes\` |
| cover | ✅ \`cover.jpg\` → 200, \`image/jpeg\`, 60 834 bytes |
| www + apex | ✅ both serve \`/bin\` |
| CORS header | ❌ none → mirror mode off-domain (see § 4) |

File naming follows Bandcamp's export format, \`pole - R - {nn} {title}.mp3\`.
⚠️ Tracks 9 and 10 have a capital **K**, \`(Kit clayton)\`, exactly as they sit on
the server. Changing it to lowercase makes them return 404.

To retarget without rebuilding (after a re-export, say), go to § 03
*dossier → media path*: edit the folder, template (\`{nn} {n} {title}\`) and
extension, then choose *apply & re-probe*. The setting is saved in
localStorage.

The page can export itself. Open the preview; on the entry screen there's a

import { engine } from "@/lib/audio";
import { useEngine, useVisualCanvas } from "@/lib/hooks";
import { coverCandidates, TRACKS } from "@/lib/tracks";

const TAU = Math.PI * 2;
const CELLS = 58;

/**
 * archive          — real cover.jpg, pixels readable (same-origin / CORS): the
 *                    halftone is computed from the actual artwork
 * archive-display  — real cover.jpg shown, but the browser forbids reading its
 *                    pixels (cross-origin, no CORS) → halftone from a procedural plate
 * procedural       — no cover reachable → generated plate for both
 */
type ArtSource = "archive" | "archive-display" | "procedural";

function loadImage(url: string, cors: boolean, timeout = 9000): Promise<HTMLImageElement> {
  return new Promise((resolve, reject) => {
    const im = new Image();
    if (cors) im.crossOrigin = "anonymous";
    const timer = window.setTimeout(() => reject(new Error("timeout")), timeout);
    im.onload = () => { clearTimeout(timer); resolve(im); };
    im.onerror = () => { clearTimeout(timer); reject(new Error("error")); };
    im.decoding = "async";
    im.src = url;
  });
}

/** Luminance grid; null if the source is tainted. */
function sample(src: CanvasImageSource): Float32Array | null {
  const off = document.createElement("canvas");
  off.width = CELLS;
  off.height = CELLS;
  const octx = off.getContext("2d", { willReadFrequently: true });
  if (!octx) return null;
  octx.filter = "grayscale(1) contrast(1.12)";
  octx.drawImage(src, 0, 0, CELLS, CELLS);
  try {
    const data = octx.getImageData(0, 0, CELLS, CELLS).data;
    const out = new Float32Array(CELLS * CELLS);
    for (let p = 0; p < out.length; p++) {
      out[p] = (0.2126 * data[p * 4] + 0.7152 * data[p * 4 + 1] + 0.0722 * data[p * 4 + 2]) / 255;
    }
    return out;
  } catch {
    return null;
  }
}

/** Greyscale "R" plate: rings, slab, grain, scanlines — zero bytes shipped. */
function makePlate(size = 480): HTMLCanvasElement {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d")!;
  const bg = g.createRadialGradient(size * 0.58, size * 0.4, size * 0.04, size * 0.5, size * 0.5, size * 0.78);
  bg.addColorStop(0, "#6a6a72");
  bg.addColorStop(0.42, "#1e1e24");
  bg.addColorStop(1, "#040406");
  g.fillStyle = bg;
  g.fillRect(0, 0, size, size);

  g.strokeStyle = "rgba(235,235,242,0.32)";
  for (let i = 1; i < 15; i++) {
    g.lineWidth = i % 4 === 0 ? 2.4 : 0.8;
    g.beginPath();
    g.arc(size * 0.5, size * 0.5, i * size * 0.033, 0, TAU);
    g.stroke();
  }
  g.fillStyle = "rgba(242,242,246,0.82)";
  g.fillRect(size * 0.08, size * 0.74, size * 0.84, size * 0.016);
  g.fillRect(size * 0.08, size * 0.2, size * 0.22, size * 0.008);

  g.font = \`900 \${Math.round(size * 0.66)}px "Big Shoulders Display", "Arial Narrow", Impact, sans-serif\`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillStyle = "rgba(250,250,252,0.9)";
  g.fillText("R", size * 0.52, size * 0.5);

  const img = g.getImageData(0, 0, size, size);
  const d = img.data;
  for (let p = 0; p < d.length; p += 4) {
    const n = (Math.random() - 0.5) * 42;
    d[p] = Math.max(0, Math.min(255, d[p] + n));
    d[p + 1] = Math.max(0, Math.min(255, d[p + 1] + n));
    d[p + 2] = Math.max(0, Math.min(255, d[p + 2] + n));

      const x = p * w;
      const amp = v * h * 0.34;
      const isMajor = i % 6 === 0;
      ctx.lineWidth = isMajor ? 1.7 : 0.85;
      ctx.strokeStyle = isMajor
        ? \`rgba(247,247,248,\${(0.35 + v * 0.65).toFixed(3)})\`
        : \`rgba(190,190,204,\${(0.12 + v * 0.65).toFixed(3)})\`;

  [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
  [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
  [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1],
];
const ICO_FACES: [number, number, number][] = [
  [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
  [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
  [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
  [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
];

function PlatonicSolid() {
  const ref = useVisualCanvas((ctx, w, h, _dt, m, t) => {
    ctx.fillStyle = "#060608";
    ctx.fillRect(0, 0, w, h);
    const cx = w / 2;
    const cy = h / 2;

    const ay = t * 0.36 + m.mid * 1.2;
    const az = t * 0.24;

    const proj = ICO_VERTS.map(([vx, vy, vz], i) => {
      const band = m.bars[(i * 4) % m.bars.length] ?? 0;
      const rMod = 1 + band * 0.22;
      let x = vx * rMod;
      let y = vy * rMod;
      let z = vz * rMod;
      // Rotate X
      let y1 = y * Math.cos(ax) - z * Math.sin(ax);
      let z1 = y * Math.sin(ax) + z * Math.cos(ax);
      // Rotate Y
      let x2 = x * Math.cos(ay) + z1 * Math.sin(ay);
      let z2 = -x * Math.sin(ay) + z1 * Math.cos(ay);
      // Rotate Z
      let x3 = x2 * Math.cos(az) - y1 * Math.sin(az);
      let y3 = x2 * Math.sin(az) + y1 * Math.cos(az);
      return { x: cx + x3 * scale, y: cy + y3 * scale, z: z2 };

      const [a, b, c] = f;
      const zAvg = (proj[a].z + proj[b].z + proj[c].z) / 3;
      const nx = (proj[b].x - proj[a].x) * (proj[c].y - proj[a].y) - (proj[b].y - proj[a].y) * (proj[c].x - proj[a].x);

      ctx.moveTo(proj[a].x, proj[a].y);

    ctx.fillStyle = "rgba(247,247,248,0.7)";
    ctx.fillText("V=12 · E=30 · F=20 · χ=2", 10, h - 10);

/** 6 · Order-4 Hilbert Space-Filling Curve (256 vertices mapped to FFT) */
function hilbertXY(index: number, order: number): [number, number] {
  let x = 0;
  let y = 0;
  let t = index;
  for (let s = 1; s < 1 << order; s <<= 1) {
    const rx = 1 & (t >> 1);
    const ry = 1 & (t ^ rx);
    if (ry === 0) {
      if (rx === 1) {
        x = s - 1 - x;
        y = s - 1 - y;
      }
      const tmp = x;
      x = y;
      y = tmp;
    }
    x += s * rx;
    y += s * ry;
    t >>= 2;
  }
  return [x, y];
}

const HILBERT_ORDER = 4;

const HILBERT_PTS = Array.from({ length: HILBERT_N }, (_, i) => hilbertXY(i, HILBERT_ORDER));

      const py = padY + gy * cellH;
      const v = (m.spectrum[i * 2] ?? 0) / 255;

  return <canvas ref={ref} className="block h-[clamp(220px,24vw,280px)] w-full" aria-hidden />;
}

const HYPER_VERTS: [number, number, number, number][] = [];

function drawTesseract(

) {
  const cx = w / 2;

      const stretch = 1 + band * 0.32;
      let x = vx * stretch;
      let y = vy * stretch;
      let z = vz * stretch;

      const y3 = y * p3;

  ctx.lineWidth = 1;

function drawChladni(
  ctx: CanvasRenderingContext2D,

function superformulaR(phi: number, mSym: number, n1: number, n2: number, n3: number) {
  const t1 = Math.pow(Math.abs(Math.cos((mSym * phi) / 4)), n2);
  const t2 = Math.pow(Math.abs(Math.sin((mSym * phi) / 4)), n3);
  const sum = t1 + t2;
  if (sum === 0) return 0;
  return Math.pow(sum, -1 / n1);
}

function drawSuperformula(
  ctx: CanvasRenderingContext2D,
  w: number,
  h: number,
  m: Metrics,
  t: number,
  pal: Palette,
  room: number,
  weight: number
) {
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(w, h) * 0.38;

  const mSym = (room * 2 + 2) + Math.floor(m.bass * 4) * 2;
  const n1 = Math.max(0.35, 1.4 - m.bass * 1.05 + Math.sin(t * 0.6) * 0.25);
  const n2 = 0.7 + m.mid * 3.8;
  const n3 = 0.7 + m.high * 4.2;

  const shells = 7;
  const steps = 360;

  for (let s = shells - 1; s >= 0; s--) {
    const frac = (s + 1) / shells;
    const band = m.bars[(s * 7) % m.bars.length] ?? 0;
    const rot = t * 0.18 * (s % 2 === 0 ? 1 : -1) + s * 0.12;

    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const phi = (i / steps) * TAU;
      const sr = superformulaR(phi, mSym, n1 + s * 0.18, n2, n3);
      const r = Math.min(maxR * 1.18, sr * maxR * frac * (0.85 + band * 0.38 + m.pulse * 0.08));
      const px = cx + Math.cos(phi + rot) * r;
      const py = cy + Math.sin(phi + rot) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();

    // Alternating stark black/white fills for brutalist depth
    ctx.fillStyle = s % 2 === 0 ? pal.fgAlpha(0.08 + band * 0.22) : pal.bgFade(0.75);
    ctx.fill();
    ctx.strokeStyle = s === 0 || s === shells - 1 ? pal.fg : pal.fgAlpha(0.45 + band * 0.5);
    ctx.lineWidth = (s === 0 ? 2.4 : 1.2) * weight;
    ctx.stroke();
  }

  ctx.font = "500 10px 'IBM Plex Mono', monospace";
  ctx.fillStyle = pal.fg;
  ctx.fillText(
    \`SUPERFORMULA  m=\${mSym}  n₁=\${n1.toFixed(2)}  n₂=\${n2.toFixed(2)}  n₃=\${n3.toFixed(2)}\`,
    16,
    38
  );

      const bw = tileW * 0.76;

      // Top face (pure stark white when high energy, else light greyscale)
      ctx.beginPath();
      ctx.moveTo(sx, sy - height - bh);
      ctx.lineTo(sx + bw, sy - height);
      ctx.lineTo(sx, sy - height + bh);
      ctx.lineTo(sx - bw, sy - height);
      ctx.closePath();
      ctx.fillStyle = v > 0.48 ? pal.fg : pal.fgAlpha(0.75);
      ctx.fill();
      ctx.strokeStyle = pal.bg;
      ctx.lineWidth = 1.2 * weight;
      ctx.stroke();

      // Left face (medium greyscale)
      ctx.beginPath();
      ctx.moveTo(sx - bw, sy - height);
      ctx.lineTo(sx, sy - height + bh);
      ctx.lineTo(sx, sy + bh);
      ctx.lineTo(sx - bw, sy);
      ctx.closePath();
      ctx.fillStyle = pal.mid(0.55 + v * 0.35);
      ctx.fill();
      ctx.strokeStyle = pal.fgAlpha(0.85);
      ctx.lineWidth = 1 * weight;
      ctx.stroke();

      // Right face (deep black/coal with stark white wireframe edge)
      ctx.beginPath();
      ctx.moveTo(sx + bw, sy - height);
      ctx.lineTo(sx, sy - height + bh);
      ctx.lineTo(sx, sy + bh);
      ctx.lineTo(sx + bw, sy);
      ctx.closePath();
      ctx.fillStyle = pal.dark(0.92);
      ctx.fill();
      ctx.strokeStyle = pal.fgAlpha(0.9);
      ctx.stroke();
    }
  }
}

/* ------------------------------------------------------------------ */
/* 6 · LORENZ CHAOTIC STRANGE ATTRACTOR                                */
/* ------------------------------------------------------------------ */

function drawAttractor(
  ctx: CanvasRenderingContext2D,
  w: number,
  h: number,
  m: Metrics,
  t: number,
  pal: Palette,
  weight: number
) {
  const cx = w / 2;
  const cy = h / 2;
  const scale = Math.min(w, h) * 0.0145 * (1 + m.bass * 0.18);

  const sigma = 10 + m.bass * 4;
  const rho = 28 + m.centroid / 450;
  const beta = 8 / 3 + m.high * 0.9;

  let x = 0.1 + Math.sin(t * 0.4) * 0.05;
  let y = 0.0;
  let z = 0.0;
  const dt = 0.0065;
  const steps = 1500;
  const yaw = t * 0.32 + m.pulse * 0.2;
  const cosY = Math.cos(yaw);
  const sinY = Math.sin(yaw);

  ctx.lineWidth = 1.5 * weight;
  ctx.strokeStyle = pal.fgAlpha(0.9);
  ctx.beginPath();
  for (let i = 0; i < steps; i++) {
    const dx = sigma * (y - x);
    const dy = x * (rho - z) - y;
    const dz = x * y - beta * z;
    x += dx * dt;
    y += dy * dt;
    z += dz * dt;

    const rx = x * cosY - (z - 25) * sinY;
    const rz = x * sinY + (z - 25) * cosY;
    const px = cx + rx * scale;
    const py = cy + (y * 0.85 - rz * 0.35) * scale;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);

    if (i % 180 === 0) {
      ctx.fillStyle = pal.fg;
      ctx.fillRect(px - 2.5, py - 2.5, 5, 5);
    }
  }
  ctx.stroke();

  ctx.font = "500 10px 'IBM Plex Mono', monospace";
  ctx.fillStyle = pal.fg;
  ctx.fillText(\`LORENZ  σ=\${sigma.toFixed(2)}  ρ=\${rho.toFixed(2)}  β=\${beta.toFixed(2)}\`, 16, 38);
}

/* ------------------------------------------------------------------ */
/* 7 · HYPOTROCHOID & RHODONEA ROSE CURVES                             */
/* ------------------------------------------------------------------ */

function drawHypotrochoid(
  ctx: CanvasRenderingContext2D,
  w: number,
  h: number,
  m: Metrics,
  t: number,
  pal: Palette,
  room: number,
  weight: number
) {
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(w, h) * 0.39;

  const p = room + 3 + Math.round(m.bass * 3);
  const q = 2 + (Math.round(m.mid * 5) % 5);
  const R = maxR * 0.68;
  const r = R * (q / p);
  const d = r * (0.65 + m.high * 1.35 + m.pulse * 0.35);

  // Outer bounding circle + inner rolling circle preview
  ctx.strokeStyle = pal.mid(0.3);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, TAU);
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();

  ctx.strokeStyle = pal.fg;
  ctx.lineWidth = 1.6 * weight;
  ctx.beginPath();
  const loops = q * TAU;
  const steps = 900;
  for (let i = 0; i <= steps; i++) {
    const th = (i / steps) * loops + t * 0.25;
    const hx = (R - r) * Math.cos(th) + d * Math.cos(((R - r) / r) * th);
    const hy = (R - r) * Math.sin(th) - d * Math.sin(((R - r) / r) * th);
    const px = cx + hx;
    const py = cy + hy;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.font = "500 10px 'IBM Plex Mono', monospace";
  ctx.fillStyle = pal.fg;
  ctx.fillText(\`HYPOTROCHOID  p:q = \${p}:\${q}  d/r = \${(d / r).toFixed(2)}\`, 16, 38);
}

/* ------------------------------------------------------------------ */
/* 8 · EUCLIDEAN RHYTHM POLYGONS & BINARY SECTORS                      */
/* ------------------------------------------------------------------ */

function drawEuclidean(
  ctx: CanvasRenderingContext2D,
  w: number,
  h: number,
  m: Metrics,
  t: number,
  pal: Palette,
  room: number,
  weight: number
) {
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(w, h) * 0.41;

  // Outer binary sector ring (stark black & white blocks)
  const sectors = 32;
  const rIn = maxR * 0.84;
  const rOut = maxR * 0.98;
  for (let i = 0; i < sectors; i++) {
    const a0 = (i / sectors) * TAU + t * 0.08;
    const a1 = ((i + 0.88) / sectors) * TAU + t * 0.08;
    const band = m.bars[(i * 2) % m.bars.length] ?? 0;
    const active = band > 0.28 || (i % (room + 2) === 0 && m.pulse > 0.2);

    ctx.beginPath();
    ctx.arc(cx, cy, rOut * (1 + (active ? band * 0.05 : 0)), a0, a1);
    ctx.arc(cx, cy, rIn, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = active ? pal.fg : pal.mid(0.12);
    ctx.fill();
  }

  // Nested Euclidean rhythm polygons E(k, n)
  const rings = [
    { n: 16, k: 5 + (room % 4), r: maxR * 0.74, speed: 0.22 },
    { n: 12, k: 5, r: maxR * 0.54, speed: -0.31 },
    { n: 8, k: 3 + (room % 3), r: maxR * 0.34, speed: 0.45 },
  ];

  rings.forEach((rg, ri) => {
    const rot = t * rg.speed + m.bass * 0.4 * (ri % 2 === 0 ? 1 : -1);
    const activePts: { x: number; y: number }[] = [];

    ctx.strokeStyle = pal.mid(0.28);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, rg.r, 0, TAU);
    ctx.stroke();

    for (let i = 0; i < rg.n; i++) {
      const a = (i / rg.n) * TAU - Math.PI / 2 + rot;
      const x = cx + Math.cos(a) * rg.r;
      const y = cy + Math.sin(a) * rg.r;
      const hit = Math.floor((i * rg.k) / rg.n) !== Math.floor(((i - 1) * rg.k) / rg.n);
      if (hit) activePts.push({ x, y });

      ctx.fillStyle = hit ? pal.fg : pal.mid(0.35);
      const s = hit ? 6 : 3;
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }

    // Polygon + all-pairs chord web
    ctx.strokeStyle = pal.fg;
    ctx.lineWidth = (1.8 - ri * 0.3) * weight;
    ctx.beginPath();
    activePts.forEach((p, idx) => {
      if (idx === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.fillStyle = pal.fgAlpha(0.06 + m.bars[ri * 8] * 0.14);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = pal.fgAlpha(0.28 + m.high * 0.45);
    ctx.lineWidth = 0.7 * weight;
    ctx.beginPath();
    for (let i = 0; i < activePts.length; i++) {
      for (let j = i + 2; j < activePts.length; j++) {
        ctx.moveTo(activePts[i].x, activePts[i].y);
        ctx.lineTo(activePts[j].x, activePts[j].y);
      }
    }
    ctx.stroke();
  });
}

    g.addColorStop(0, \`rgba(250,250,252,\${0.55 + v * 0.45})\`);
    g.addColorStop(1, "rgba(150,150,162,0.16)");
    ctx.fillStyle = g;
    ctx.fillRect(x + bw * 0.14, base - bh, bw * 0.72, bh);
    // reflection
    ctx.fillStyle = \`rgba(200,200,212,\${0.05 + v * 0.1})\`;
    ctx.fillRect(x + bw * 0.14, base, bw * 0.72, bh * 0.32);
    // peak cap
    ctx.fillStyle = "rgba(247,247,248,0.85)";
    ctx.fillRect(x + bw * 0.14, base - peakHold[i] * base - 2, bw * 0.72, 1.6);
  }

  ctx.strokeStyle = "rgba(232,232,236,0.22)";
  ctx.beginPath(); ctx.moveTo(0, base + 0.5); ctx.lineTo(w, base + 0.5); ctx.stroke();
  ctx.font = "400 9px 'IBM Plex Mono', monospace";
  ctx.fillStyle = "rgba(154,154,164,0.75)";
  [50, 100, 250, 500, 1000, 2500, 5000, 10000].forEach((f) => {
    const x = (Math.log(f / fMin) / Math.log(fMax / fMin)) * w;
    ctx.fillText(f >= 1000 ? \`\${f / 1000}k\` : \`\${f}\`, Math.min(w - 22, x + 2), base + 13);

function drawLissajous(ctx: CanvasRenderingContext2D, w: number, h: number, m: Metrics, t: number) {
  ctx.fillStyle = "rgba(8,8,11,0.13)";
  ctx.fillRect(0, 0, w, h);
  const wave = m.wave as Float32Array;
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.4 * (0.75 + Math.min(1, m.level * 1.8) * 0.35);
  const lag = Math.max(2, Math.round(wave.length * (0.008 + Math.min(1, m.centroid / 7000) * 0.06)));

  // theoretical ghost figure
  const a = Math.max(1, Math.round(2 + m.centroid / 900) % 7);
  const b = Math.max(1, Math.round(3 + m.bass * 6) % 8);
  ctx.strokeStyle = "rgba(180,180,196,0.16)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 720; i++) {
    const th = (i / 720) * TAU;
    const x = cx + Math.sin(a * th + t * 0.25) * R * 0.92;
    const y = cy + Math.sin(b * th) * R * 0.92;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // live figure
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = "rgba(250,250,252,0.9)";
  ctx.shadowBlur = 12 * Math.min(1, m.level * 3);
  ctx.shadowColor = "rgba(255,255,255,0.6)";
  ctx.beginPath();
  const N = 1400;
  for (let i = 0; i < N; i++) {
    const idx = Math.floor((i / N) * wave.length);
    const x = cx + wave[idx] * R * 2.1;
    const y = cy + wave[(idx + lag) % wave.length] * R * 2.1;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.font = "500 10px 'IBM Plex Mono', monospace";
  ctx.fillStyle = "rgba(247,247,248,0.62)";
  ctx.fillText(\`τ = \${lag} samples\`, 10, h - 10);
  ctx.fillText(\`a:b ≈ \${a}:\${b}\`, w - 92, h - 10);
  ctx.strokeStyle = "rgba(232,232,236,0.1)";
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.02, 0, TAU); ctx.stroke();
}

function drawPolar(ctx: CanvasRenderingContext2D, w: number, h: number, m: Metrics, t: number) {
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.42;
  const bars = m.bars as number[];

  ctx.strokeStyle = "rgba(232,232,236,0.09)";
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath(); ctx.arc(cx, cy, (R * i) / 4, 0, TAU); ctx.stroke();
  }

  // radial spectrum polygon
  const SPOKES = 168;
  ctx.beginPath();
  for (let i = 0; i <= SPOKES; i++) {
    const a = (i / SPOKES) * TAU - Math.PI / 2 + t * 0.06;
    const v = bars[Math.floor((i / SPOKES) * bars.length) % bars.length] ?? 0;
    const rr = R * (0.32 + v * 0.66) * (1 + m.pulse * 0.05);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = \`rgba(232,232,240,\${(0.05 + m.level * 0.16).toFixed(3)})\`;
  ctx.fill();
  ctx.strokeStyle = \`rgba(250,250,252,\${(0.4 + m.level * 0.5).toFixed(3)})\`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // spokes
  for (let i = 0; i < SPOKES; i += 4) {
    const a = (i / SPOKES) * TAU - Math.PI / 2 + t * 0.06;
    const v = bars[Math.floor((i / SPOKES) * bars.length) % bars.length] ?? 0;
    ctx.strokeStyle = \`rgba(210,210,224,\${(0.06 + v * 0.5).toFixed(3)})\`;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * R * 0.3, cy + Math.sin(a) * R * 0.3);
    ctx.lineTo(cx + Math.cos(a) * R * (0.34 + v * 0.7), cy + Math.sin(a) * R * (0.34 + v * 0.7));
    ctx.stroke();
  }

  // golden-angle dot field (phyllotaxis) — "numerical mathematical shapes"
  const DOTS = 340;
  for (let k = 0; k < DOTS; k++) {
    const ang = k * GOLDEN + t * 0.08;
    const rr = R * 1.06 * Math.sqrt(k / DOTS);
    const v = bars[k % bars.length] ?? 0;
    const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
    const s = 0.5 + v * 2.6 + m.pulse * 0.8;
    ctx.fillStyle = \`rgba(247,247,248,\${(0.08 + v * 0.62).toFixed(3)})\`;
    ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
  }

  ctx.font = "500 10px 'IBM Plex Mono', monospace";
  ctx.fillStyle = "rgba(247,247,248,0.6)";
  ctx.fillText(\`φ = 137.5° · n=\${DOTS}\`, 10, h - 10);
  ctx.textAlign = "right";
  ctx.fillText(\`\${Math.round(m.centroid)} Hz centroid\`, w - 10, h - 10);
  ctx.textAlign = "left";
}

function drawRaster(ctx: CanvasRenderingContext2D, w: number, h: number, m: Metrics, t: number) {
  ctx.clearRect(0, 0, w, h);
  const COLS = 28, ROWS = 12;
  const cw = w / COLS, chh = h / ROWS;
  const bars = m.bars as number[];
  const scan = Math.floor((t * 6) % COLS);
  ctx.font = "500 9px 'IBM Plex Mono', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const bi = Math.floor((x / COLS) * bars.length);
      const v = bars[bi] ?? 0;
      const rowMod = 1 - Math.abs(y - ROWS / 2) / (ROWS / 2);
      const e = v * (0.25 + rowMod * 0.9);
      const px = x * cw + cw / 2, py = y * chh + chh / 2;
      const isScan = x === scan;
      ctx.strokeStyle = \`rgba(232,232,236,\${(0.05 + e * 0.4).toFixed(3)})\`;
      ctx.lineWidth = 0.8;
      ctx.strokeRect(x * cw + 1.5, y * chh + 1.5, cw - 3, chh - 3);
      if (e > 0.42) {
        ctx.fillStyle = \`rgba(250,250,252,\${(0.35 + e * 0.6).toFixed(3)})\`;
        ctx.fillText(String(Math.round(e * 255)).padStart(3, "0"), px, py);
      } else if (e > 0.12) {
        const r = Math.min(cw, chh) * 0.32 * e * 2.2;
        ctx.fillStyle = \`rgba(226,226,236,\${(0.2 + e * 0.7).toFixed(3)})\`;
        ctx.beginPath(); ctx.arc(px, py, Math.max(0.4, r), 0, TAU); ctx.fill();
      }
      if (isScan) {
        ctx.fillStyle = \`rgba(247,247,248,\${(0.03 + e * 0.07).toFixed(3)})\`;
        ctx.fillRect(x * cw, 0, cw, h);
      }
    }

  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "rgba(247,247,248,0.55)";
  ctx.fillText(\`\${COLS}×\${ROWS} CELLS · E = |X(f)|·row\`, 10, h - 8);
}

function safeDecode(s: string) {
  try {
    return decodeURIComponent(s);
  } catch {
    return s;
  }
}

/** Encode every path segment (spaces, parentheses stay valid). Idempotent. */
export function encodePath(p: string) {
  return p
    .split("/")
    .map((seg) => encodeURIComponent(safeDecode(seg)))
    .join("/");

 * Accepts root-relative folders ("/bin/pole - R/") or absolute ones
 * ("https://imortalimp.nl/bin/pole - R/").

  const abs = full.match(/^(https?:)\\/\\/([^/]+)(\\/.*)?$/i);
  if (abs) return \`\${abs[1]}//\${abs[2]}\${encodePath(abs[3] ?? "/")}\`;
  const path = full.startsWith("/") ? full : "/" + full;
  return ORIGIN.mediaOrigin + encodePath(path);

  const b = base.endsWith("/") ? base : base + "/";
  if (/^https?:\\/\\//i.test(b)) return b;
  return (ORIGIN.mediaOrigin ? ORIGIN.mediaOrigin.replace(/^https?:\\/\\//, "") : "") + b;

let corsProbe: Promise<boolean> | null = null;

/**
 * true  → the browser may analyse media from this origin
 * false → it may only play it (no ACAO header, or the network is down)
 * Uses a simple HEAD request (no preflight) and caches the answer.

export function probeCors(url: string, timeoutMs = 6000): Promise<boolean> {
  if (!/^https?:\\/\\//i.test(url)) return Promise.resolve(true); // same-origin
  if (corsProbe) return corsProbe;
  corsProbe = (async () => {
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = setTimeout(() => ctrl?.abort(), timeoutMs);
    try {
      await fetch(url, { method: "HEAD", mode: "cors", cache: "no-store", signal: ctrl?.signal });
      return true; // readable response ⇒ CORS allowed (even a 404 would prove the header)
    } catch {
      return false;
    } finally {
      clearTimeout(timer);
    }
  })();
  return corsProbe;
}
