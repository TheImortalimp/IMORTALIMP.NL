<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Page</title>
    <style>
      body {
         font-family: Arial, sans-serif;
         margin: 0; /* Adjusted for fullscreen */
         line-height: 1.6;
         background-color: #1e1e1e; /* Dark background for consistency */
         color: #f0f0f0; /* Light text for readability */
         text-align: center;
         /* overflow is now handled by script to allow scrolling */
      }
      .content-wrapper {
          padding: 20px;
      }
      .emoji-link {
         display: block;
         width: 100%;
         text-align: center;
         font-size: clamp(40vw, 50vw, 60vh); /* Massive, responsive font size */
         text-decoration: none;
         line-height: 1;
         margin-bottom: 20px; /* Space below the emoji */
      }
      #animation-container {
          position: relative; /* Needed for child positioning */
          margin-top: 20px;
      }
      #animation-container.fullscreen {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #000;
          z-index: 1000;
          display: flex;
          justify-content: center;
          align-items: center;
          margin-top: 0;
      }
      #animation-frame {
          max-width: 100%;
          height: auto;
          border: 2px solid #ccc;
      }
      #animation-container.fullscreen #animation-frame {
          max-width: 100%;
          max-height: 100%;
          object-fit: contain; /* Scale image to fit within the container */
          border: none;
      }
      #close-animation-btn {
          position: absolute;
          top: 20px;
          right: 20px;
          padding: 10px 15px;
          font-size: 20px;
          cursor: pointer;
          background-color: #fff;
          color: #000;
          border: none;
          border-radius: 5px;
          z-index: 1001;
          display: none; /* Hidden by default */
      }
      #animation-container.fullscreen #close-animation-btn {
          display: block; /* Show when fullscreen */
      }
      #thumbnail-iframe {
          width: 100%;
          height: auto;
          border: 2px solid #ccc;
          aspect-ratio: 16/9;
      }
      #animation-frame {
          display: none;
      }
      #start-animation-btn {
          margin-top: 10px;
          padding: 10px 20px;
          font-size: 16px;
          cursor: pointer;
      }
    </style>
</head>

<body>
 <div class="content-wrapper">
     <a href="https://www.imortalimp.nl/JUKEBOX%20JOINTS-~by%20RiverLyle%20reuveni.html" target="_blank" rel="noopener" class="emoji-link">🃏</a>
     <h1>My First Heading</h1>
     <p>My first paragraph.</p>
 </div>

 <div id="animation-container">
    <!-- Iframe for the initial thumbnail -->
    <iframe id="thumbnail-iframe" src="https://www.imortalimp.nl/Inscryption.Dos.folder/Inscryption_003132.png" title="Animation Thumbnail" frameborder="0" scrolling="no"></iframe>
    <!-- The image element for the animation, initially hidden -->
    <img id="animation-frame" src="https://www.imortalimp.nl/Inscryption.Dos.folder/Inscryption_000000.png" alt="Animation Frame">
    <!-- The audio file for the animation -->
    <audio id="animation-audio" src="https://www.imortalimp.nl/Inscryption.Dos.folder/Image.mp3"></audio>
    
    <!-- Button to start the animation -->
    <button id="start-animation-btn">Start Fullscreen Animation</button>
    
    <!-- Close button for fullscreen mode -->
    <button id="close-animation-btn">&times;</button>
 </div>

 <script>
    const thumbnailIframe = document.getElementById('thumbnail-iframe');
    const animationContainer = document.getElementById('animation-container');
    const imageElement = document.getElementById('animation-frame');
    const audioElement = document.getElementById('animation-audio');
    const startButton = document.getElementById('start-animation-btn');
    const closeButton = document.getElementById('close-animation-btn');
    const contentWrapper = document.querySelector('.content-wrapper');

    let animationInterval;

    // --- Configuration: You will need to adjust these values ---
    const basePath = 'https://www.imortalimp.nl/Inscryption.Dos.folder/';
    const filePrefix = 'Inscryption_'; // The part of the filename before the number
    const fileExtension = '.png';
    const frameCount = 184196; // IMPORTANT: Set this to the total number of frames you render.
    const frameRate = 100;  // Milliseconds per frame (100ms = 10 frames per second)
    const numberPadding = 6; // How many digits for the frame number (e.g., 6 for '000000')
    // -------------------------------------------------------------

    function startAnimation() {
        let currentFrame = 0;

        // Go fullscreen
        animationContainer.classList.add('fullscreen');
        contentWrapper.style.display = 'none';
        document.body.style.overflow = 'hidden'; // Prevent scrolling during animation

        // Hide the iframe and show the animation image element
        thumbnailIframe.style.display = 'none';
        imageElement.style.display = 'block';

        // Start playing the audio
        audioElement.loop = true;
        audioElement.play();

        // Start the image sequence animation
        animationInterval = setInterval(() => {
            currentFrame++;
            if (currentFrame >= frameCount) {
                currentFrame = 0; // Loop the animation
            }
            const frameNumber = String(currentFrame).padStart(numberPadding, '0');
            imageElement.src = `${basePath}${filePrefix}${frameNumber}${fileExtension}`;
        }, frameRate);

        startButton.style.display = 'none';
    }

    function stopAnimation() {
        // Exit fullscreen
        animationContainer.classList.remove('fullscreen');
        contentWrapper.style.display = 'block';
        document.body.style.overflow = ''; // Re-enable scrolling

        // Hide the animation image and show the thumbnail iframe again
        imageElement.style.display = 'none';
        thumbnailIframe.style.display = 'block';

        // Stop audio and animation
        audioElement.pause();
        audioElement.currentTime = 0;
        clearInterval(animationInterval);

        // Reset image to the first frame
        imageElement.src = `${basePath}${filePrefix}${String(0).padStart(numberPadding, '0')}${fileExtension}`;
        
        startButton.style.display = 'inline-block';
    }

    startButton.addEventListener('click', startAnimation);
    closeButton.addEventListener('click', stopAnimation);

 </script>

</body>
</html>
