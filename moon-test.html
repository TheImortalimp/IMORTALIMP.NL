        /* ================================================================
           RENDER + CLOCK
           ================================================================ */
        const select = document.getElementById("regionSelect");
        const poemContainer = document.getElementById("poemContainer");
        const localTimeEl = document.getElementById("localTime");
        const tzLabelEl = document.getElementById("tzLabel");

        function renderPoems(regionKey) {
            const regionPoems = poems[regionKey];
            const meta = regionMeta[regionKey];
            if (!regionPoems || !meta) return;

            poemContainer.innerHTML = PHASES.map(phase => {
                const text = regionPoems[phase.key] || "—";
                return `
                    <article class="phase-card">
                        <div class="phase-header">
                            <span class="phase-emoji">${phase.emoji}</span>
                            <span class="phase-name">${phase.name}</span>
                        </div>
                        <div class="phase-poem">${text}</div>
                    </article>
                `;
            }).join("");

            tzLabelEl.textContent = meta.tzName;
            updateClock(regionKey);
        }

        function updateClock(regionKey) {
            const tz = regionMeta[regionKey].tz;
            const formatter = new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });
            localTimeEl.textContent = formatter.format(new Date());
        }

        function addStars() {
            const stars = document.getElementById("stars");
            for (let i = 0; i < 160; i++) {
                const star = document.createElement("div");
                star.className = "twinkle";
                star.style.top = Math.random() * 100 + "%";
                star.style.left = Math.random() * 100 + "%";
                star.style.animationDuration = (1.4 + Math.random() * 3.2) + "s";
                star.style.animationDelay = Math.random() * 5 + "s";
                stars.appendChild(star);
            }
        }

        select.addEventListener("change", () => renderPoems(select.value));
        renderPoems(select.value);
        addStars();
        setInterval(() => updateClock(select.value), 1000);
    </script>
