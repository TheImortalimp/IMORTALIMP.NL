<!-- ══════════ AI WARP v5 — HUE GHOST (top bar) ══════════ -->
<!-- ══════════════════════════════════════════════════════════════════════════════
     AI WARP v5 — "HUE GHOST"

     A ghost that edits the page's whole canvas — the four layers cover the
     viewport (CFG.FULL_PAGE, default) and bleed their colour through everything
     beneath them. It can be re-scoped to the top bar alone (the panel's SCOPE
     switch, AIWarpV5.scope(false) or ?hueghost=bar) if you want the old
     bar-only behaviour back.

       HUE         slow drifting blobs of the page's OWN woven hues (the same
                   palette v3 wove from your --sc-hue values), laid on with
                   mix-blend-mode: hue — so they retint the bar while keeping its
                   luminance. Text contrast is untouched by construction.
       SATURATION  a slow "breath" that desaturates and re-saturates bands of the
                   bar (mix-blend-mode: saturation) — where the ghost passes, the
                   bar momentarily goes near-monochrome, then blooms back.
       LIGHT       a soft-light sweep that breathes with the audio (bass) and
                   carries the glow across the bar.
       INVERSION   every 6-15 s (and right after a theme change) a ghost *pass*:
                   a soft-edged band travels across the bar with
                   mix-blend-mode: difference, briefly inverting hue and light —
                   about 1/3 of the passes are the "B&W ghost", which also drains
                   the saturation inside the band. Subtle by design (peak 0.22).

     In full page the layers cover the viewport exactly; CFG.PAGE_SCALE and the
     per-layer PAGE_LIGHT_SCALE / PAGE_INVERT_SCALE are the contrast guard — hue
     and saturation keep their luminance and stay strong, while soft-light and
     difference (which move contrast) are dialled back so text stays readable.
     With CFG.FULL_PAGE off, everything is bounded to the bar's rectangle plus
     CFG.BLEED px of spill.
     The four layers are separate canvases, one blend mode each, ~2 px of work per
     frame — cheap even on a phone (where SAT + LIGHT are dropped by default).
     CFG.SPREAD enlarges every hue blob and CFG.WASH_ALPHA lays one or two
     enormous, near-invisible blobs underneath them — that combination is the
     colour *bleed*; CFG.HUE_ALPHA is how hard the hue itself pushes.

     Install:  paste after the v4 block, before </body>.
               (media_page_MASTERFULLY_INTEGRATED_v5.html already has it.)

     API:      AIWarpV5.on() / .off() / .toggle() / .ghost() / .intensity(v)
               AIWarpV5.status()      — what it is doing right now
               AIWarpV5.setTargets(['.retro-hud-bar', '#ai-warp-opacity-control'])
               AIWarpV5.CFG           — live knobs (see below)
     URL:      ?hueghost=0 | 1      — off / on regardless of the stored choice
               (the toggle button in the bar remembers its state in localStorage)

     DEMO:     open this file on its own (double-click it, or
               http://<host>:8090/ai-warp-v5-HUE-GHOST.html) and it mounts a
               self-contained demo — mock top bar, live knobs, fire buttons, a
               greyscale test card, a synth beat feeding the audio reaction, and
               palette presets to watch the hue layer re-weave. A real page gets
               none of that: the demo mounts only when the document has no bar,
               no .media-item/.showcase-item, no audio/video/iframe and no AI Warp
               layers (i.e. the file is on its own). ?demo=1 forces it, ?demo=0 or
               window.__AW_V5_NO_DEMO = true stops it. The page builds ship with the
               demo block stripped (build-all.py), so they stay lean.
     ══════════════════════════════════════════════════════════════════════════════ -->

<style id="aw-v5-css">
  /* one canvas per blend mode — hue, saturation, light and inversion can then be
     layered independently instead of fighting inside a single canvas */
  .aw-ghost-layer {
    position: fixed;
    left: 0; top: 0;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 1300;                 /* above the bar (1200), below the AI Warp overlays */
    display: none;
    opacity: 1;
    transition: opacity 0.45s ease;
  }
  #aw-ghost-hue    { mix-blend-mode: hue; }
  #aw-ghost-sat    { mix-blend-mode: saturation; }
  #aw-ghost-light  { mix-blend-mode: soft-light; }
  #aw-ghost-invert { mix-blend-mode: difference; }

  html.aw-v5-off .aw-ghost-layer { display: none !important; }

  /* the toggle inherits the bar's own .hud-btn look, plus a ghost-tinted glow */

  }

</style>

<script id="aw-v5-runtime">
(function () {
  'use strict';

  /* ───────────────────────── knobs ───────────────────────── */
  var CFG = {
    ENABLED: true,          /* master on/off (the button / stored choice sets this) */
    INTENSITY: 0.78,        /* 0..1.5 — how loud the ghost is                        */
    FPS: 30,                /* draw cap; state still advances                        */
    DPR_CAP: 2,
    BLEED: 26,              /* px the ghost may spill past the bar's edges           */
    TARGETS: ['.retro-hud-bar'],
    BUTTON: true,           /* add the HUE GHOST toggle to .hud-controls             */

    /* ── scope: the ghost edits the whole page canvas by default ───────────── */
    FULL_PAGE: true,        /* true  = cover the viewport (the page canvas)
                               false = only the top-bar rect (the old behaviour) */
    PAGE_SCALE: 0.80,       /* alpha multiplier when full page — the contrast guard.
                               hue and saturation keep their luminance, so they can
                               stay strong; light and inversion move contrast, so
                               they are scaled down further (below).               */
    PAGE_LIGHT_SCALE: 0.70, /* extra reduction for the soft-light layer, full page */
    PAGE_INVERT_SCALE: 0.60,/* extra reduction for the difference layer, full page */
    PAGE_SPREAD_X: 1.75,    /* blobs spread wider across a full page               */
    PAGE_SPREAD_Y: 1.45,
    PAGE_BLOBS_ADD: 2,      /* a couple more blobs when covering the whole page    */

    GHOST_MIN_MS: 6000,     /* spacing between the inversion ghosts                  */
    GHOST_MAX_MS: 15000,
    PASS_MS: [380, 900],
    ON_THEME_PASS: true,    /* a theme change always summons a ghost shortly after   */

    HUE_ALPHA: 0.55,        /* per-blob peak — the hue change                        */
    SAT_ALPHA: 0.38,
    LIGHT_ALPHA: 0.26,
    INVERT_MAX: 0.30,       /* peak of the difference band — legibility ceiling      */
    BLOBS: 7,
    SPREAD: 1.40,           /* blob radius multiplier — how far each hue reaches     */
    WASH_ALPHA: 0.22,       /* very large, very soft colour wash underneath the blobs
                               — this is what makes the colour *bleed*              */
    WASH_BLOBS: 2,

    PANEL: true,            /* the ⚙ button + settings panel in the top bar       */
    PERSIST_KEY: 'aw-hue-ghost',
    PANEL_KEY: 'aw-hue-ghost-settings',   /* every panel value is remembered here */
    /* hue windows per theme; null = use the whole woven page palette */
    BANDS: { matrix: [95, 160], gold: [28, 60], cyan: [168, 210], cyber: null }
  };

  var rootEl = null, barEl = null, buttonEl = null, button2 = null;
  var layers = {}, seen = { hue: null, sat: null, light: null, invert: null };
  var layerOn = { hue: true, sat: true, light: true, invert: true };
  var W = 0, H = 0, dpr = 1, cssW = 0, cssH = 0;      /* cssW/H include the bleed */
  var frame = 0, lastDraw = 0, running = false, rafId = 0;
  var palette = null, lastPaletteAt = -1e9;
  var theme = 'cyber', lastTheme = null, themeChangedAt = -1e9;
  var audio = { bass: 0.2, mid: 0.15, treble: 0.18, drive: 0.2 };
  var lastAudioAt = -1e9;
  var blobs = [];
  var pass = null, nextPassAt = 0, passCount = 0, lastPassAt = -1e9;
  var avgFrameMs = 16.7;            /* EMA of the real frame interval */
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();

  var PHONE = !!(window.__AIWARP_MOBILE && (window.__AIWARP_LITE ||
                document.documentElement.classList.contains('aw-tier-phone')));
  var CALM = !!window.__AIWARP_CALM ||
             (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  if (PHONE) {
    CFG.FPS = 24; CFG.DPR_CAP = 1.25; CFG.BLEED = 15;
    CFG.GHOST_MIN_MS = 9000; CFG.GHOST_MAX_MS = 20000;
    CFG.INVERT_MAX = 0.25; CFG.HUE_ALPHA = 0.44; CFG.BLOBS = 6;
    CFG.SPREAD = 1.35; CFG.WASH_ALPHA = 0.17; CFG.WASH_BLOBS = 1;
    layers.sat = false; layers.light = false;          /* two layers only on a phone */
  }
  if (window.__AIWARP_FPS && !PHONE) CFG.FPS = Math.min(CFG.FPS, window.__AIWARP_FPS);
  if (CALM) { CFG.GHOST_MIN_MS = 20000; CFG.GHOST_MAX_MS = 40000; CFG.INVERT_MAX = 0.16; CFG.WASH_ALPHA = 0.12; }

  var WANT_SAT = (layers.sat !== false), WANT_LIGHT = (layers.light !== false);

  /* ───────────────────────── helpers ───────────────────────── */
  function now(t) { return (t != null ? t : ((window.performance && performance.now) ? performance.now() : Date.now())) - t0; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function mixHue(a, b, k) {                            /* shortest arc */
    var d = mod(b - a + 180, 360) - 180;
    return mod(a + d * k, 360);
  }

  /* how much a layer is allowed to push: 1 in bar mode, guarded in full page */
  function layerScale(kind) {
    if (!CFG.FULL_PAGE) return 1;
    if (kind === 'light') return CFG.PAGE_SCALE * CFG.PAGE_LIGHT_SCALE;
    if (kind === 'invert') return CFG.PAGE_SCALE * CFG.PAGE_INVERT_SCALE;
    return CFG.PAGE_SCALE;
  }

  /* ───────────────── palette: the page's own woven hues ───────────────── */
  function readPalette(t) {
    if (palette && t - lastPaletteAt < 9000) return palette;
    try {
      if (window.AIWarpV3 && window.AIWarpV3.status) {
        var p = window.AIWarpV3.status().palette;
        if (p && p.length) { palette = p.slice(); lastPaletteAt = t; return palette; }
      }
    } catch (e) {}
    palette = [0, 72, 167, 230, 300, 124];              /* v3's fallback weave */
    lastPaletteAt = t;
    return palette;
  }

  function hueFor(i, t) {
    readPalette(t);
    var band = CFG.BANDS[theme];
    var base;
    if (band) {
      base = band[0] + mod(i * 37 + t * 0.004, band[1] - band[0]);
      var p = palette[(i + ((t * 0.00007) | 0)) % palette.length];
      if (p != null) base = mixHue(base, p, 0.35);      /* still a blend of the page */
    } else {
      base = palette[(i + ((t * 0.00009) | 0)) % palette.length];
    }
    return mod(base + t * 0.0025, 360);                 /* slow whole-palette drift */
  }

  /* ───────────────── audio (reuse v4's numbers, read-only) ───────────────── */
  function readAudio(t) {
    if (t - lastAudioAt < 120) return audio;            /* every ~8 frames */
    lastAudioAt = t;
    try {
      if (window.AIWarpV4 && window.AIWarpV4.status) {
        var a = window.AIWarpV4.status().audio;
        if (a) {
          audio.bass = a.bass || 0; audio.mid = a.mid || 0;
          audio.treble = a.treble || 0; audio.drive = a.drive || 0;
          return audio;
        }
      }
    } catch (e) {}
    audio.bass = 0.20 + 0.10 * Math.sin(t / 1700);
    audio.mid = 0.15; audio.treble = 0.17 + 0.08 * Math.cos(t / 2300);
    audio.drive = 0.20;
    return audio;
  }

  function readTheme(t) {
    if (frame % 8) return theme;
    try {
      if (window.AIWarpV4 && window.AIWarpV4.status) {
        var s = window.AIWarpV4.status().theme;
        if (s && s !== theme) { theme = s; }
      } else if (window.__THEME_MODE && window.__THEME_MODE !== theme) {
        theme = window.__THEME_MODE;
      }
    } catch (e) {}
    return theme;
  }

  /* ───────────────── layers ───────────────── */
  function makeLayer(id, want) {
    if (want === false) return null;
    var c = document.createElement('canvas');
    c.id = id;
    c.className = 'aw-ghost-layer';
    c.setAttribute('aria-hidden', 'true');
    rootEl.appendChild(c);
    return c;
  }

  function build() {
    rootEl = document.documentElement;
    var ids = [['aw-ghost-hue', true], ['aw-ghost-sat', WANT_SAT],
               ['aw-ghost-light', WANT_LIGHT], ['aw-ghost-invert', true]];
    for (var i = 0; i < ids.length; i++) {
      var c = makeLayer(ids[i][0], ids[i][1]);
      if (!c) continue;
      var key = ids[i][0].replace('aw-ghost-', '');
      seen[key] = c;
      layers[key] = c.getContext('2d');
    }
    blobs = [];
    var want = CFG.BLOBS + (CFG.FULL_PAGE ? (CFG.PAGE_BLOBS_ADD | 0) : 0);
    for (var b = 0; b < want; b++) {
      blobs.push({
        fx: 0.00013 + b * 0.000041, fy: 0.00019 + b * 0.000037,
        ph: b * 1.9, ax: 0.30 + (b % 3) * 0.10, ay: 0.22 + (b % 2) * 0.12,
        r: 0.85 + (b % 3) * 0.22
      });
    }
    if (CFG.BUTTON) addButton();
    schedulePass(now());
  }

  function syncRect() {
    var nx, ny, nw, nh;
    if (CFG.FULL_PAGE) {
      /* the whole page canvas: the viewport itself, no bleed needed */
      nx = 0; ny = 0;
      nw = window.innerWidth; nh = window.innerHeight;
      if (nw < 8 || nh < 8) return false;
    } else {
      if (!barEl) return false;
      var r = barEl.getBoundingClientRect();
      if (r.width < 8 || r.height < 4) return false;
      if (r.bottom < -CFG.BLEED || r.top > (window.innerHeight + CFG.BLEED)) return false;
      nx = r.left - CFG.BLEED; ny = r.top - CFG.BLEED;
      nw = r.width + CFG.BLEED * 2; nh = r.height + CFG.BLEED * 2;
    }
    if (nw !== cssW || nh !== cssH || !W) {
      cssW = nw; cssH = nh;
      dpr = Math.min(window.devicePixelRatio || 1, CFG.DPR_CAP);
      W = Math.max(1, Math.round(cssW * dpr));
      H = Math.max(1, Math.round(cssH * dpr));
      for (var k in seen) {
        if (!seen[k]) continue;
        seen[k].width = W; seen[k].height = H;
        seen[k].style.display = 'block';
      }
    }
    for (var k2 in seen) {
      if (!seen[k2]) continue;
      seen[k2].style.left = nx + 'px';
      seen[k2].style.top = ny + 'px';
      seen[k2].style.width = cssW + 'px';
      seen[k2].style.height = cssH + 'px';
      seen[k2].style.opacity = Math.min(1, CFG.INTENSITY * 1.6);
      if (!layerOn[k2]) seen[k2].style.display = 'none';
    }
    return true;
  }

  /* ───────────────── drawing ───────────────── */
  function clearAll() {
    for (var k in layers) { var c = layers[k]; if (c) c.clearRect(0, 0, W, H); }
  }

  function drawHue(t) {
    var ctx = layers.hue; if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.scale(dpr, dpr);
    var a = readAudio(t);
    var I = CFG.INTENSITY;
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var sp = 0.00006 * (1 + a.drive * 1.6);
      var sx = CFG.FULL_PAGE ? CFG.PAGE_SPREAD_X : 1;
      var sy = CFG.FULL_PAGE ? CFG.PAGE_SPREAD_Y : 1;
      var x = cssW * 0.5 + Math.cos(t * b.fx * (1 + a.mid) + b.ph) * cssW * b.ax * sx;
      var y = cssH * 0.5 + Math.sin(t * b.fy * (1 + a.bass) + b.ph * 1.7) * cssH * b.ay * sy;
      var rr = cssH * b.r * CFG.SPREAD * (1 + a.bass * 0.22);
      var alpha = CFG.HUE_ALPHA * I * layerScale('hue') * (0.75 + 0.5 * Math.sin(t * sp * 60 + b.ph));
      if (alpha <= 0.005) continue;
      var hue = hueFor(i, t);
      var g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, 'hsla(' + hue.toFixed(1) + ',100%,58%,' + alpha.toFixed(3) + ')');
      g.addColorStop(0.55, 'hsla(' + hue.toFixed(1) + ',100%,55%,' + (alpha * 0.45).toFixed(3) + ')');
      g.addColorStop(1, 'hsla(' + hue.toFixed(1) + ',100%,52%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832); ctx.fill();
    }

    /* the wash — one or two enormous, very soft blobs. This is the actual
       "colour bleed": the blobs above are the shapes, this is the haze that
       carries their hue across the whole bar and past its edges. */
    if (CFG.WASH_ALPHA > 0) {
      var washes = Math.max(1, CFG.WASH_BLOBS | 0);
      for (var wi = 0; wi < washes; wi++) {
        var wph = 0.6 + wi * 2.4;
        var wx = cssW * (0.5 + 0.40 * Math.sin(t * 0.0000305 * (1 + wi * 0.7) + wph));
        var wy = cssH * (0.5 + 0.28 * Math.cos(t * 0.0000421 * (1 + wi * 0.9) + wph));
        var wr = Math.max(cssW, cssH) * (1.02 + 0.30 * wi);
        var wa = CFG.WASH_ALPHA * I * layerScale('hue') * (0.72 + 0.28 * Math.sin(t * 0.00019 + wph));
        if (wa <= 0.004) continue;
        var wh = hueFor(wi + 3, t);
        var wg = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
        wg.addColorStop(0, 'hsla(' + wh.toFixed(1) + ',100%,60%,' + wa.toFixed(3) + ')');
        wg.addColorStop(0.55, 'hsla(' + wh.toFixed(1) + ',100%,58%,' + (wa * 0.52).toFixed(3) + ')');
        wg.addColorStop(1, 'hsla(' + wh.toFixed(1) + ',100%,56%,0)');
        ctx.fillStyle = wg;
        ctx.beginPath(); ctx.arc(wx, wy, wr, 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSat(t) {
    var ctx = layers.sat; if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.scale(dpr, dpr);
    var a = readAudio(t);
    var I = CFG.INTENSITY;
    var alpha = CFG.SAT_ALPHA * I * layerScale('sat');
    var sweep = (t * 0.000045) % 1;
    var x0 = mod(sweep * cssW * 2 - cssW * 0.5, cssW * 1.6) - cssW * 0.3;
    var g = ctx.createLinearGradient(x0 - cssW * 0.35, 0, x0 + cssW * 0.35, 0);
    g.addColorStop(0.00, 'rgba(128,128,128,0)');
    g.addColorStop(0.35, 'rgba(128,128,128,' + alpha.toFixed(3) + ')');       /* drain */
    g.addColorStop(0.55, 'rgba(255,255,255,' + (alpha * 0.55).toFixed(3) + ')'); /* bloom */
    g.addColorStop(1.00, 'rgba(128,128,128,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
    var breath = 0.5 + 0.5 * Math.sin(t * 0.00028);
    ctx.globalAlpha = (0.35 + 0.4 * breath) * a.treble * 1.4 * I;
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawLight(t) {
    var ctx = layers.light; if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.scale(dpr, dpr);
    var a = readAudio(t);
    var I = CFG.INTENSITY;
    var band = 0.22 + 0.05 * Math.sin(t * 0.00013);
    var cx = (0.5 + 0.42 * Math.sin(t * 0.000071)) * cssW;
    var alpha = CFG.LIGHT_ALPHA * I * layerScale('light') * (0.7 + a.bass * 1.5);
    var g = ctx.createLinearGradient(cx - cssW * band, 0, cx + cssW * band, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,' + alpha.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.restore();
  }

  /* the ghost pass: a travelling band of difference (inversion), optionally B&W */
  function schedulePass(t) { nextPassAt = t + rand(CFG.GHOST_MIN_MS, CFG.GHOST_MAX_MS); }

  function firePass(t, why) {
    if (pass) return;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var bandW = rand(26, 78) * (1 + 0.45 * audio.drive);
    var dur = rand(CFG.PASS_MS[0], CFG.PASS_MS[1]);
    dur = Math.max(dur, avgFrameMs * 3.2);           /* ≥ ~3 real frames */
    dur = Math.min(dur, 2600);
    pass = {
      t0: t, dur: dur, dir: dir, bandW: bandW,
      from: dir > 0 ? -bandW : cssW + bandW, to: dir > 0 ? cssW + bandW : -bandW,
      kind: Math.random() < 0.34 ? 'bw' : 'invert',
      peak: CFG.INVERT_MAX * layerScale('invert') * (0.72 + 0.55 * Math.random()) * CFG.INTENSITY * 1.6,
      why: why || 'schedule'
    };
    lastPassAt = t; passCount++;
  }

  function drawInvert(t) {
    var ctx = layers.invert; if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    if (!pass) return;
    var p = (t - pass.t0) / pass.dur;
    if (p >= 1) { pass = null; schedulePass(t); return; }
    var x = pass.from + (pass.to - pass.from) * p;
    var env = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, p))), 0.8);
    var alpha = pass.peak * env;
    ctx.save(); ctx.scale(dpr, dpr);
    var w = pass.bandW;
    var g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,' + alpha.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
    if (pass.kind === 'bw' && layers.sat) {                 /* the B&W ghost */
      ctx.clearRect(0, 0, W, H);
      var g2 = ctx.createLinearGradient(x - w * 0.8, 0, x + w * 0.8, 0);
      g2.addColorStop(0, 'rgba(0,0,0,0)');
      g2.addColorStop(0.5, 'rgba(255,255,255,' + (alpha * 0.55).toFixed(3) + ')');
      g2.addColorStop(1, 'rgba(0,0,0,0)');
      var ctxs = layers.sat; ctxs.save(); ctxs.scale(dpr, dpr);
      ctxs.fillStyle = 'rgba(128,128,128,' + (alpha * 0.9).toFixed(3) + ')';
      ctxs.fillRect(0, 0, cssW, cssH);
      ctxs.globalCompositeOperation = 'destination-out';
      ctxs.fillStyle = g2; ctxs.fillRect(x - w * 0.8, 0, w * 1.6, cssH);
      ctxs.globalCompositeOperation = 'source-over';
      ctxs.restore();
    }
    ctx.restore();
  }

  /* ───────────────── the loop ───────────────── */
  function tick(ts) {
    rafId = requestAnimationFrame(tick);
    var t = now(ts);
    if (lastDraw) avgFrameMs += (((ts - lastDraw) - avgFrameMs) * 0.2);
    var fpsGate = CFG.FPS > 0 && lastDraw && (ts - lastDraw) < (1000 / CFG.FPS - 1.5);
    if (fpsGate) return;
    lastDraw = ts;
    frame++;

    /* the bar is only needed to place the toggle button and to fence the ghost
       in bar scope - a full-page ghost paints without one (the demo has none) */
    if (!barEl || !barEl.parentNode) { if (!CFG.FULL_PAGE || (frame % 30) === 0) findBar(); }
    if (CFG.ENABLED === false) return;
    if (!CFG.FULL_PAGE && !barEl) return;
    if (!syncRect()) { clearAll(); return; }

    var th = readTheme(t);
    if (th !== lastTheme) {
      lastTheme = th; themeChangedAt = t;
      if (CFG.ON_THEME_PASS) setTimeout(function () { if (CFG.ENABLED) firePass(now(), 'theme:' + th); }, 260);
    }

    if (!pass && t > nextPassAt) firePass(t, 'schedule');

    if (layerOn.hue) drawHue(t); else if (layers.hue) layers.hue.clearRect(0, 0, W, H);
    if (layers.sat && layerOn.sat) drawSat(t); else if (layers.sat) layers.sat.clearRect(0, 0, W, H);
    if (layers.light && layerOn.light) drawLight(t); else if (layers.light) layers.light.clearRect(0, 0, W, H);
    if (layerOn.invert) drawInvert(t); else if (layers.invert) layers.invert.clearRect(0, 0, W, H);
  }

  function start() {
    if (running) return;
    running = true;
    if (!rafId) rafId = requestAnimationFrame(tick);
  }
  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    running = false;
    clearAll();
    for (var k in seen) if (seen[k]) seen[k].style.display = 'none';
  }

  /* ───────────────── the bar, and its button ───────────────── */
  function findBar() {
    for (var i = 0; i < CFG.TARGETS.length; i++) {
      var el = document.querySelector(CFG.TARGETS[i]);
      if (el) { barEl = el; break; }
    }
    if (barEl && CFG.BUTTON && !buttonEl) addButton();
  }

  function addButton() {
    var controls = (barEl && barEl.querySelector('.hud-controls')) || document.querySelector('.hud-controls');
    if (!controls || document.getElementById('btn-hueghost')) return;
    var b = document.createElement('button');
    b.id = 'btn-hueghost';
    b.className = 'hud-btn' + (CFG.ENABLED ? ' aw-ghost-on' : '');
    b.type = 'button';
    b.textContent = 'HUE GHOST: ' + (CFG.ENABLED ? 'ON' : 'OFF');
    b.setAttribute('aria-pressed', CFG.ENABLED ? 'true' : 'false');
    b.addEventListener('click', function () { setEnabled(!CFG.ENABLED); });
    var scan = document.getElementById('btn-scanlines');
    if (scan && scan.parentNode === controls) controls.insertBefore(b, scan.nextSibling);
    else controls.appendChild(b);
    buttonEl = b;

    if (CFG.PANEL && !document.getElementById('btn-ghostsettings')) {
      var b2 = document.createElement('button');
      b2.id = 'btn-ghostsettings';
      b2.className = 'hud-btn';
      b2.type = 'button';
      b2.textContent = PHONE ? '\u2699' : 'GHOST SETTINGS';
      b2.title = 'HUE GHOST settings — strength of each layer';
      b2.setAttribute('aria-expanded', 'false');
      b2.addEventListener('click', function () { setPanelOpen(!panelOpen); });
      if (b.parentNode === controls) controls.insertBefore(b2, b.nextSibling);
      else controls.appendChild(b2);
      button2 = b2;
    }
  }

  function setEnabled(on) {
    CFG.ENABLED = !!on;
    try { localStorage.setItem(CFG.PERSIST_KEY, CFG.ENABLED ? '1' : '0'); } catch (e) {}
    if (CFG.ENABLED) {
      /* re-show the layers: stop() hid them, and syncRect only touches display
         when the bar's size changes - which it will not have done */
      for (var k in seen) if (seen[k]) seen[k].style.display = layerOn[k] ? 'block' : 'none';
      start(); schedulePass(now());
    } else stop();
    if (buttonEl) {
      buttonEl.textContent = 'HUE GHOST: ' + (CFG.ENABLED ? 'ON' : 'OFF');
      buttonEl.setAttribute('aria-pressed', CFG.ENABLED ? 'true' : 'false');
      if (CFG.ENABLED) buttonEl.classList.add('aw-ghost-on'); else buttonEl.classList.remove('aw-ghost-on');
    }
    return CFG.ENABLED;
  }


  /* ───────────────── settings panel (the button in the bar) ─────────────────
     Mirrors the demo page: every aspect of the ghost can be dialled in here —
     overall strength, bleed, and the peak of each individual layer (hue,
     saturation, light, inversion) — plus which layers are on at all, when the
     ghosts fire, and a copy-to-clipboard of the current numbers. Everything is
     remembered in localStorage, so a look you dial in survives a reload.      */
  var panelEl = null, panelOpen = false, panelRows = {}, panelChecks = {}, panelNote = null, saveTimer = 0, scopeBtns = null;

  function fmt(v) { return (Math.round(v * 100) / 100).toString(); }

  function collectSettings() {
    return {
      INTENSITY: CFG.INTENSITY, BLEED: CFG.BLEED,
      SPREAD: CFG.SPREAD, WASH_ALPHA: CFG.WASH_ALPHA,
      HUE_ALPHA: CFG.HUE_ALPHA, SAT_ALPHA: CFG.SAT_ALPHA, LIGHT_ALPHA: CFG.LIGHT_ALPHA,
      INVERT_MAX: CFG.INVERT_MAX,
      GHOST_MIN_MS: CFG.GHOST_MIN_MS, GHOST_MAX_MS: CFG.GHOST_MAX_MS,
      layers: { hue: layerOn.hue, sat: layerOn.sat, light: layerOn.light, invert: layerOn.invert },
      FULL_PAGE: !!CFG.FULL_PAGE,
      enabled: !!CFG.ENABLED, open: !!panelOpen
    };
  }

  function saveSettingsSoon() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = 0;
      try { localStorage.setItem(CFG.PANEL_KEY, JSON.stringify(collectSettings())); } catch (e) {}
    }, 250);
  }

  function applySettings(o, opts) {
    if (!o) return collectSettings();
    ['INTENSITY', 'BLEED', 'HUE_ALPHA', 'SAT_ALPHA', 'LIGHT_ALPHA', 'INVERT_MAX',
     'GHOST_MIN_MS', 'GHOST_MAX_MS', 'SPREAD', 'WASH_ALPHA'].forEach(function (k) {
      if (typeof o[k] === 'number' && isFinite(o[k])) CFG[k] = o[k];
    });
    if (typeof o.FULL_PAGE === 'boolean') setScope(o.FULL_PAGE);
    if (o.layers) for (var k in layerOn) if (o.layers.hasOwnProperty(k)) setLayer(k, !!o.layers[k], true);
    if (typeof o.enabled === 'boolean' && !(opts && opts.noEnable)) setEnabled(o.enabled);
    syncPanel(); saveSettingsSoon();
    return collectSettings();
  }

  function resetSettings() {
    return applySettings({
      INTENSITY: 0.78, BLEED: 26, HUE_ALPHA: 0.55, SAT_ALPHA: 0.38, LIGHT_ALPHA: 0.26,
      INVERT_MAX: 0.30, GHOST_MIN_MS: 6000, GHOST_MAX_MS: 15000,
      SPREAD: 1.40, WASH_ALPHA: 0.22,
      layers: { hue: true, sat: true, light: true, invert: true }
    });
  }

  function setScope(fullPage) {
    CFG.FULL_PAGE = !!fullPage;
    cssW = cssH = W = 0;                       /* force a re-measure */
    if (scopeBtns) {
      scopeBtns.page.classList.toggle('aw-selected', CFG.FULL_PAGE);
      scopeBtns.bar.classList.toggle('aw-selected', !CFG.FULL_PAGE);
    }
    syncPanel(); saveSettingsSoon();
    return CFG.FULL_PAGE;
  }

  function setLayer(name, on, quiet) {
    if (!(name in layerOn)) return layerOn[name];
    layerOn[name] = !!on;
    var c = seen[name];
    if (c) c.style.display = (layerOn[name] && CFG.ENABLED) ? 'block' : 'none';
    if (!quiet) { syncPanel(); saveSettingsSoon(); }
    return layerOn[name];
  }

  function syncPanel() {
    if (!panelEl) return;
    if (scopeBtns) {
      scopeBtns.page.classList.toggle('aw-selected', CFG.FULL_PAGE);
      scopeBtns.bar.classList.toggle('aw-selected', !CFG.FULL_PAGE);
    }
    for (var k in panelRows) {
      var r = panelRows[k];
      /* rows are keyed by their CFG key; GHOST is the derived spacing pair */
      var v = (k === 'GHOST') ? Math.round((CFG.GHOST_MIN_MS + CFG.GHOST_MAX_MS) / 2000) : CFG[k];
      if (typeof v !== 'number' || !isFinite(v)) continue;
      r.input.value = v; r.out.textContent = fmt(v);
    }
    for (var c in panelChecks) {
      var box = panelChecks[c], built = !!seen[c];
      box.input.checked = !!layerOn[c] && built;
      box.input.disabled = !built;
      box.root.title = built ? '' : 'this layer is not built on this device (phone tier)';
      box.root.style.opacity = built ? '1' : '0.45';
    }
  }

  function panelRow(key, label, min, max, step, get, set) {
    var input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = get();
    var out = document.createElement('output'); out.textContent = fmt(get());
    input.addEventListener('input', function () {
      var v = parseFloat(input.value);
      set(v); out.textContent = fmt(v); saveSettingsSoon();
    });
    var r = document.createElement('div'); r.className = 'aw-gp-row';
    var l = document.createElement('label'); l.textContent = label;
    r.appendChild(l); r.appendChild(input); r.appendChild(out);
    panelRows[key] = { input: input, out: out };
    return r;
  }

  function panelBtn(text) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'aw-gp-btn'; b.textContent = text;
    return b;
  }

  function setPanelOpen(on) {
    panelOpen = !!on;
    if (panelEl) panelEl.classList.toggle('aw-open', panelOpen);
    if (button2) { button2.classList.toggle('aw-ghost-on', panelOpen); button2.setAttribute('aria-expanded', panelOpen ? 'true' : 'false'); }
    saveSettingsSoon();
    return panelOpen;
  }

  function mountPanel() {
    if (panelEl || !CFG.PANEL) return;
    var p = document.createElement('div');
    p.id = 'aw-ghost-panel';

    var head = document.createElement('div'); head.className = 'aw-gp-head';
    var title = document.createElement('strong'); title.textContent = 'HUE GHOST — SETTINGS';
    var close = document.createElement('button'); close.type = 'button'; close.className = 'aw-gp-x'; close.textContent = '\u00d7';
    close.setAttribute('aria-label', 'close settings');
    close.addEventListener('click', function () { setPanelOpen(false); });
    head.appendChild(title); head.appendChild(close);

    var body = document.createElement('div'); body.className = 'aw-gp-body';
    body.appendChild(panelRow('INTENSITY', 'INTENSITY', 0, 1.5, 0.01, function () { return CFG.INTENSITY; },
      function (v) { CFG.INTENSITY = v; }));
    body.appendChild(panelRow('BLEED', 'BLEED (px)', 0, 48, 1, function () { return CFG.BLEED; },
      function (v) { CFG.BLEED = v; cssW = cssH = W = 0; }));
    body.appendChild(panelRow('HUE_ALPHA', 'HUE PEAK', 0, 0.8, 0.01, function () { return CFG.HUE_ALPHA; },
      function (v) { CFG.HUE_ALPHA = v; }));
    body.appendChild(panelRow('SAT_ALPHA', 'SAT PEAK', 0, 0.8, 0.01, function () { return CFG.SAT_ALPHA; },
      function (v) { CFG.SAT_ALPHA = v; }));
    body.appendChild(panelRow('LIGHT_ALPHA', 'LIGHT PEAK', 0, 0.8, 0.01, function () { return CFG.LIGHT_ALPHA; },
      function (v) { CFG.LIGHT_ALPHA = v; }));
    body.appendChild(panelRow('INVERT_MAX', 'INVERT PEAK', 0, 0.5, 0.01, function () { return CFG.INVERT_MAX; },
      function (v) { CFG.INVERT_MAX = v; }));
    body.appendChild(panelRow('GHOST', 'GHOST EVERY', 3, 30, 1,
      function () { return Math.round((CFG.GHOST_MIN_MS + CFG.GHOST_MAX_MS) / 2000); },
      function (v) { CFG.GHOST_MIN_MS = v * 700; CFG.GHOST_MAX_MS = v * 1300; }));

    var scopeBox = document.createElement('div'); scopeBox.className = 'aw-gp-layers';
    var st2 = document.createElement('span'); st2.className = 'aw-gp-sub'; st2.textContent = 'SCOPE';
    scopeBox.appendChild(st2);
    scopeBtns = {};
    [['page', 'FULL PAGE'], ['bar', 'TOP BAR']].forEach(function (o) {
      var b3 = document.createElement('button');
      b3.type = 'button'; b3.className = 'aw-gp-btn aw-gp-scope'; b3.textContent = o[1];
      b3.addEventListener('click', function () { setScope(o[0] === 'page'); });
      scopeBtns[o[0]] = b3;
      scopeBox.appendChild(b3);
    });
    body.appendChild(scopeBox);

    var layersBox = document.createElement('div'); layersBox.className = 'aw-gp-layers';
    var lt = document.createElement('span'); lt.className = 'aw-gp-sub'; lt.textContent = 'LAYERS';
    layersBox.appendChild(lt);
    ['hue', 'sat', 'light', 'invert'].forEach(function (name) {
      var lab = document.createElement('label');
      var i = document.createElement('input'); i.type = 'checkbox'; i.checked = true;
      i.addEventListener('change', function () { setLayer(name, i.checked); });
      var sp = document.createElement('span'); sp.textContent = name.toUpperCase();
      lab.appendChild(i); lab.appendChild(sp);
      layersBox.appendChild(lab);
      panelChecks[name] = { input: i, root: lab };
    });
    body.appendChild(layersBox);

    var actions = document.createElement('div'); actions.className = 'aw-gp-actions';
    var fire = panelBtn('FIRE GHOST'); fire.addEventListener('click', function () { firePass(now(), 'panel'); });
    var fireBw = panelBtn('FIRE B&W GHOST');
    fireBw.addEventListener('click', function () { firePass(now(), 'panel'); if (pass) pass.kind = 'bw'; });
    var copy = panelBtn('COPY JSON');
    copy.addEventListener('click', function () {
      var txt = JSON.stringify(collectSettings());
      var done = function () { copy.textContent = 'COPIED \u2713'; setTimeout(function () { copy.textContent = 'COPY JSON'; }, 1400); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallback(); });
        else fallback();
      } catch (e) { fallback(); }
      function fallback() {
        try {
          var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
          document.documentElement.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
        } catch (e2) {}
      }
    });
    var reset = panelBtn('RESET'); reset.addEventListener('click', function () { resetSettings(); syncPanel(); });
    actions.appendChild(fire); actions.appendChild(fireBw); actions.appendChild(copy); actions.appendChild(reset);
    body.appendChild(actions);

    panelNote = document.createElement('div'); panelNote.className = 'aw-gp-note';
    panelNote.textContent = 'remembered in this browser \u00b7 paste COPY JSON back to report a look';

    p.appendChild(head); p.appendChild(body); p.appendChild(panelNote);
    rootEl.appendChild(p);                       /* <html>: stays screen-fixed */
    panelEl = p;
    p.addEventListener('keydown', function (e) { if (e.key === 'Escape') setPanelOpen(false); });
    syncPanel();
  }

  /* ───────────────── boot ───────────────── */
  function boot() {
    build();
    if (CFG.PANEL) mountPanel();
    var wantOpen = false;
    try {
      var raw = localStorage.getItem(CFG.PANEL_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') { applySettings(o, { noEnable: true }); wantOpen = !!o.open; }
      }
    } catch (e) {}
    if (wantOpen) setPanelOpen(true);
    try {
      var sc = /(^|[?&])hueghost=(page|bar)(&|$)/.exec(location.search);
      if (sc) setScope(sc[2] === 'page');
      var q = /(^|[?&])hueghost=([01])(&|$)/.exec(location.search);
      if (q) { setEnabled(q[2] === '1'); return start(); }
      var stored = localStorage.getItem(CFG.PERSIST_KEY);
      if (stored === '0') { setEnabled(false); return; }
    } catch (e) {}
    setEnabled(true);
    start();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* ───────────────── public API ───────────────── */
  window.AIWarpV5 = {
    CFG: CFG,
    on: function () { return setEnabled(true); },
    off: function () { return setEnabled(false); },
    toggle: function () { return setEnabled(!CFG.ENABLED); },
    /** summon a ghost right now: ghost() or ghost('bw') */
    ghost: function (kind) { firePass(now(), 'api'); if (kind && pass) pass.kind = kind; return true; },
    intensity: function (v) { if (v != null) CFG.INTENSITY = Math.max(0, Math.min(1.5, +v)); return CFG.INTENSITY; },
    setTargets: function (list) { if (list && list.length) { CFG.TARGETS = list; barEl = null; cssW = cssH = W = 0; findBar(); } return CFG.TARGETS; },
    palette: function () { return readPalette(now()); },
    /** drop the cached palette and re-weave from the page (v3) right now */
    refreshPalette: function () { palette = null; lastPaletteAt = -1e9; return readPalette(now()); },
    /** the settings panel: settings() reads, apply() writes, reset() restores defaults */
    settings: function () { return collectSettings(); },
    apply: applySettings,
    reset: resetSettings,
    /** turn a single layer on/off: layer('sat', false) */
    layer: setLayer,
    /** scope: scope() reads, scope(true) = full page, scope(false) = top bar only */
    scope: function (fullPage) { return fullPage == null ? CFG.FULL_PAGE : setScope(fullPage); },
    panel: function (open) { return open == null ? panelOpen : setPanelOpen(open); },
    status: function () {
      var r = barEl ? barEl.getBoundingClientRect() : null;
      return {
        on: !!CFG.ENABLED, intensity: CFG.INTENSITY, theme: theme, fullPage: !!CFG.FULL_PAGE,
        target: CFG.FULL_PAGE
          ? { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight, scope: 'page' }
          : (r ? { left: Math.round(r.left), top: Math.round(r.top), width: Math.round(r.width), height: Math.round(r.height), scope: 'rect' } : null),
        layers: Object.keys(seen).filter(function (k) { return seen[k]; }), css: { w: cssW, h: cssH, dpr: dpr, backing: W + 'x' + H },
        palette: palette, pass: pass ? { kind: pass.kind, why: pass.why, progress: +(((now() - pass.t0) / pass.dur)).toFixed(2) } : null,
        passes: passCount, lastPassAt: lastPassAt === -1e9 ? null : Math.round(lastPassAt),
        avgFrameMs: +avgFrameMs.toFixed(2), fps: avgFrameMs > 0 ? +(1000 / avgFrameMs).toFixed(1) : null,
        nextPassMs: Math.max(0, Math.round(nextPassAt - now())),
        audio: { bass: +audio.bass.toFixed(3), drive: +audio.drive.toFixed(3) },
        phone: PHONE, calm: CALM
      };
    }
  };
})();
</script>

     Open  ai-warp-v5-HUE-GHOST.html  directly (double-click, or
     http://<host>:8090/ai-warp-v5-HUE-GHOST.html) and this demo mounts itself:

         CYBER / MATRIX / VHS GOLD / CYAN buttons, and the real HUE GHOST toggle
         that the v5 module adds;

         and ghost spacing, all writing straight into AIWarpV5.CFG;
       * fire buttons    — summon an ordinary ghost or the B&W one on demand;
       * test card       — a semi-square TV test screen (colour bars, reversed
         bars, grey staircase, colour patch grid, resolution wedge, monoscope
         circle) drawn on a canvas. Point the ghost at it with the TARGET switch
         and hue / saturation / inversion can be judged properly instead of on a
         long grey banner;

    if (b.GIF_ALPHA_MAX != null) v2cfg.GIF_ALPHA_MAX = b.GIF_ALPHA_MAX;
  }

  /* ───────────────────────── main loop ───────────────────────── */
  function loop(ts) {
    requestAnimationFrame(loop);
    if (typeof document === 'undefined') return;
    /* a parked/hidden document still needs the scanline state to be correct, so
       that work happens before the visibility gate; the drawing does not. */
    if (document.hidden) { pushScanState(); return; }
    /* mobile builds set __AIWARP_FPS (30 phone / 45 tablet) — honour it so the
       accent layer costs the same budget as the rest of the page. State work
       still happens on skipped frames. */
    ts = ts || now();
    var fps = window.__AIWARP_FPS || 0;
    if (fps > 0 && lastDraw && (ts - lastDraw) < (1000 / fps) - 1.5) { pushScanState(); return; }
    lastDraw = ts;
    if (!canvas) { ensureLayers(); resize(); }
    frame++;
    if ((frame % 30) === 0) wrapHooks();
    readAudio(ts);

    /* follow an externally switched theme (engine or another script) */
    var ext = (typeof window.__THEME_MODE === 'string') ? window.__THEME_MODE : null;
    if (ext && ext !== mode) setTheme(ext, true);

    resize();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr);

    if (!nextBurstAt) nextBurstAt = ts + 600;
    if (ts > nextBurstAt) spawnBurst();

    drawAmbient(ts);
    drawBursts(ts);
    if (CFG.SPLASH) drawSplash(ts);

    var alpha = Math.min(CFG.GLOW_ALPHA * I(), 0.95) * (0.35 + audio.drive * 0.9);
    canvas.style.opacity = clamp01(alpha).toFixed(3);

    updateScanlines();
    updateHud();
    boostEngine();
  }

  function boot() {
    if (booted) return;
    booted = true;
    ensureLayers();
    resize();
    collectPalette();
    if (typeof window.__THEME_MODE === 'string') mode = window.__THEME_MODE;
    wrapHooks();
    watchScanState();
    pushScanState();
    refreshHudEdge();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    requestAnimationFrame(loop);
    if (window.console) console.log('[AI Warp v4] THEME TURBO online — intensity ' + CFG.INTENSITY +
      ', quality ' + CFG.QUALITY + ', themes: cyber/matrix/gold/cyan, scanlines ' + (SC.ENABLED ? 'on' : 'off') +
      '  (AIWarpV4.CFG to tune)');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setTimeout(function () { if (!booted) boot(); }, 900);

  /* ───────────────────────── public API ───────────────────────── */
  window.AIWarpV4 = {
    CFG: CFG,
    setTheme: setTheme,
    /** fire a specific burst module right now (or a random one) */
    burst: function (kind) {
      if (kind && (THEMES[mode] || THEMES.cyber).bursts[kind] != null) {
        var save = (THEMES[mode].bursts);
        var only = {}; for (var k in save) only[k] = (k === kind) ? 1 : 0;
        var bak = (THEMES[mode] = Object.assign({}, THEMES[mode], { bursts: only }));
        spawnBurst(); THEMES[mode] = bak;
      } else spawnBurst();
      return bursts.length;
    },
    /** heavier/heavier/lighter at runtime */
    intensity: function (v) { if (v != null) CFG.INTENSITY = clamp(v, 0, 4); return CFG.INTENSITY; },
    /** scanline control: 'auto' | 'always' | 'off' or an object to merge into CFG.SCANLINES */
    scanlines: function (v) {
      if (typeof v === 'string' && typeof window.toggleScanlines === 'function') {
        var guard = 0;
        while (guard++ < 4) {
          var want = v === 'always' ? 'scanlines-always' : (v === 'off' ? 'scanlines-off' : null);
          if (document.body.classList.contains(want || '__none__') || (!want && !document.body.classList.contains('scanlines-always') && !document.body.classList.contains('scanlines-off'))) break;
          window.toggleScanlines();
        }
      } else if (v && typeof v === 'object') {
        for (var k in v) if (v.hasOwnProperty(k)) SC[k] = v[k];
        applyScanVars();
      }
      return { pitch: SC.PITCH, base: SC.BASE, always: SC.ALWAYS, roll: SC.ROLL, mask: SC.MASK };
    },
    status: function () {
      return { theme: mode, intensity: CFG.INTENSITY, variants: (THEMES[mode] || {}).variants,
               variant: ((THEMES[mode] || {}).variants || [])[variantIx],
               bursts: bursts.map(function (b) { return b.kind; }),
               audio: { bass: +audio.bass.toFixed(3), mid: +audio.mid.toFixed(3),
                        treble: +audio.treble.toFixed(3), drive: +audio.drive.toFixed(3) },
               canvasAlpha: canvas ? canvas.style.opacity : null, scan: SC };
    },
    /** refresh the hue palette from the page's own --sc-hue values */
    refreshPalette: collectPalette,
    /** register more backdrop selectors for the theme layer (advanced) */
    boot: boot
  };
})();

};
</script>

<script id="aw-v5-demo-theme-fx">
/* ── the pages own theme-splash FX (fx-canvas): the burst, the MATRIX digital
      rain, the VHS GOLD tear, the CYAN scanner and the CYBER pulse — verbatim,
      fed by this demo audio engine through the same globals the page uses. ── */
window.__AW_DEMO_FX = function () {
function getMasterEnergy(){
        const analyser=__MASTER_ANALYSER;
        const isActive = isPlayingBeat || (activeMediaElement && !activeMediaElement.paused);
        if(!analyser || !isActive || window.__masterPaused){
          const t=Date.now();
          return {
            bass: 0.22+0.12*Math.sin(t/1600),
            mid: 0.18+0.08*Math.sin(t/1900),
            treble: 0.16+0.10*Math.cos(t/2400),
            overall: 0.20,
            rms: 0.18,
            active: false,
            freq: null,
            time: null
          };
        }
        analyser.getByteFrequencyData(__MASTER_FREQ_DATA);
        analyser.getByteTimeDomainData(__MASTER_TIME_DATA);
        const data=__MASTER_FREQ_DATA;
        const N=data.length;
        // bands
        function avg(a,b){ let s=0,c=0; for(let i=Math.floor(a*N); i<Math.floor(b*N) && i<N; i++){ s+=data[i]; c++; } return c? s/c/255 : 0; }
        const bass = avg(0,0.12);
        const lowMid = avg(0.12,0.30);
        const mid = avg(0.30,0.60);
        const treble = avg(0.60,1.0);
        const highTreble = avg(0.85,1.0);
        let sum=0; for(let v of data) sum+=v*v;
        const rms=Math.sqrt(sum/N)/128;
        return { bass, lowMid, mid, treble, highTreble, overall:(bass+mid+treble)/3, rms, active:true, freq:__MASTER_FREQ_DATA, time:__MASTER_TIME_DATA };
      }

function fxAudioBoost(){
        try{
          const e = getMasterEnergy();
          const active = !!(e.active && !window.__masterPaused);
          const rms = active ? e.rms : 0;
          return {
            e: e,
            active: active,
            rms: rms,
            boost: active ? (0.75 + Math.min(1.6, e.rms * 1.8)) : 1,
            dur: active ? (1 + Math.min(1.3, e.rms * 1.5)) : 1
          };
        }catch(err){ return { e: null, active: false, rms: 0, boost: 1, dur: 1 }; }
      }

function addFxEffect(draw, durMs, onStart, onEnd){
        if(!fxCanvas || !fxCtx) return null;
        if(__fxList.length >= MAX_FX) __fxList.shift();
        const fx = { draw: draw, dur: Math.max(300, durMs), start: Date.now(), onStart: onStart, onEnd: onEnd };
        __fxList.push(fx);
        if(onStart) onStart();
        if(!__fxLoopId){
          __fxLoopId = requestAnimationFrame(function fxLoop(){
            const now = Date.now();
            const dpr = window.devicePixelRatio || 1;
            const w = fxCanvas.width / dpr, h = fxCanvas.height / dpr;
            fxCtx.clearRect(0, 0, w, h);
            let any = false;
            for(let i = __fxList.length - 1; i >= 0; i--){
              const f = __fxList[i];
              const t = (now - f.start) / f.dur;
              if(t >= 1){ if(f.onEnd) f.onEnd(); __fxList.splice(i, 1); continue; }
              f.draw(fxCtx, w, h, Math.max(0, t), now);
              any = true;
            }
            if(any){
              fxCanvas.style.opacity = '0.95';
              __fxLoopId = requestAnimationFrame(fxLoop);
            } else {
              fxCanvas.style.opacity = '0';
              __fxLoopId = null;
            }
          });
        }
        return fx;
      }

function triggerThemeBurst(themeKey){
        // Universal selection burst — expanding accent rings + spokes + flash, audio-scaled
        if(!fxCanvas||!fxCtx) return;
        const A=fxAudioBoost();
        const accent=THEME_ACCENTS[themeKey]||'#bb86fc';
        const dur=1500*A.dur;
        addFxEffect(function(ctx,w,h,t){
          const cx=w/2, cy=h/2, maxR=Math.max(w,h)*0.7;
          const a=1-t;
          ctx.lineWidth=3*a+1;
          ctx.strokeStyle=accent;
          ctx.globalAlpha=Math.min(1, a*1.5*A.boost);
          for(let k=0;k<3;k++){
            const rr=((t*1.5+k/3)%1)*maxR;
            ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.stroke();
          }
          ctx.globalAlpha=a*0.5*Math.min(1.4,A.boost);
          for(let i=0;i<24;i++){
            const ang=(i/24)*Math.PI*2;
            const r1=maxR*(0.2+t*0.6), r2=maxR*(0.32+t*0.68);
            ctx.beginPath();
            ctx.moveTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
            ctx.lineTo(cx+Math.cos(ang)*r2, cy+Math.sin(ang)*r2);
            ctx.stroke();
          }
          ctx.globalAlpha=1;
          if(t<0.12){ ctx.fillStyle=`rgba(255,255,255,${((1-t/0.12)*0.5*Math.min(1.5,A.boost)).toFixed(3)})`; ctx.fillRect(0,0,w,h); }
        }, dur);
      }

function triggerMatrixRainEffect(){
        // MATRIX splash — digital rain; fall speed & duration driven by audio
        if(!fxCanvas||!fxCtx) return;
        const A=fxAudioBoost();
        const dur=3200*A.dur;
        const CHARS='01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*ぁあぃいぅうぇえぉお'.split('');
        const fontSize=18;
        let drops=null;
        addFxEffect(function(ctx,w,h,t){
          if(!drops){ const cols=Math.max(10, Math.floor(w/fontSize)); drops=Array(cols).fill(1); }
          ctx.fillStyle='rgba(0,10,4,0.15)';
          ctx.fillRect(0,0,w,h);
          ctx.font=`bold ${fontSize}px monospace`;
          const step=1 + A.rms*1.8;
          for(let i=0;i<drops.length;i++){
            const ch=CHARS[Math.floor(Math.random()*CHARS.length)];
            ctx.fillStyle=drops[i]%3===0?'#ffffff':'#39ff14';
            ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
            if(drops[i]*fontSize>h && Math.random()>0.94) drops[i]=0;
            drops[i]+=step;
          }
        }, dur);
      }

function triggerVhsGoldEffect(){
        // VHS GOLD splash — rolling tracking band + VCR OSD; band speed driven by audio
        if(!fxCanvas||!fxCtx) return;
        const A=fxAudioBoost();
        const dur=3000*A.dur;
        addFxEffect(function(ctx,w,h,t){
          const e=t*(dur/1000);
          const y=((e*450*(1+A.rms*0.8))%(h+100))-50;
          ctx.fillStyle=`rgba(255,224,102,${(0.35*Math.min(1.4,A.boost)).toFixed(3)})`; ctx.fillRect(0,y,w,22);
          for(let i=0;i<8;i++){ const ry=Math.random()*h, rh=Math.random()*4+1; ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(0,ry,w,rh); }
        }, dur,
        function(){ if(vcrBadge) vcrBadge.classList.add('show'); },
        function(){ if(vcrBadge) vcrBadge.classList.remove('show'); });
      }

function triggerCyanScannerEffect(){
        // CYAN splash — scanner sweep; intensity driven by audio
        if(!fxCanvas||!fxCtx) return;
        const A=fxAudioBoost();
        const dur=2500*A.dur;
        addFxEffect(function(ctx,w,h,t){
          const scanY=t*h;
          const grad=ctx.createLinearGradient(0,scanY-60,0,scanY);
          grad.addColorStop(0,'rgba(0,255,255,0)'); grad.addColorStop(1,`rgba(0,255,255,${(0.45*Math.min(1.4,A.boost)).toFixed(3)})`);
          ctx.fillStyle=grad; ctx.fillRect(0,scanY-60,w,60);
          ctx.fillStyle='#ffffff'; ctx.fillRect(0,scanY,w,3);
        }, dur);
      }

function triggerCyberPulseEffect(){
        // CYBER splash — same rings + spokes as before; duration extends with live audio
        if(!fxCanvas||!fxCtx) return;
        const A=fxAudioBoost();
        const dur=2200*A.dur;
        addFxEffect(function(ctx,w,h,t){
          const elapsed=t*(dur/1000);
          const cx=w/2, cy=h/2, maxR=Math.max(w,h)*0.8;
          const shift=window.totalHueShift||0;
          ctx.strokeStyle=`hsl(${(180+shift)%360},100%,70%)`;
          ctx.lineWidth=2;
          for(let r=20;r<maxR;r+=40){ ctx.beginPath(); ctx.arc(cx,cy,(r+elapsed*150)%maxR,0,Math.PI*2); ctx.stroke(); }
          ctx.strokeStyle=`hsl(${(300+shift)%360},100%,65%)`;
          for(let i=0;i<16;i++){ const ang=(i/16)*Math.PI*2+elapsed*0.5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*maxR, cy+Math.sin(ang)*maxR); ctx.stroke(); }
        }, dur,
        function(){ if(cyberVignette) cyberVignette.classList.add('show'); },
        function(){ if(cyberVignette) cyberVignette.classList.remove('show'); });
        // Integrate with AI Warp: boost bass briefly
        if(window.__MASTER_GAIN) { try{ window.__MASTER_GAIN.gain.setValueAtTime(1.3, window.__MASTER_GAIN.context?.currentTime||0); }catch{} }
      }

function triggerThemeSplash(themeKey){
        // Mashup: universal burst + the button's own themed splash, both audio-affected
        triggerThemeBurst(themeKey);
        if(themeKey==='matrix') triggerMatrixRainEffect();
        else if(themeKey==='gold') triggerVhsGoldEffect();
        else if(themeKey==='cyan') triggerCyanScannerEffect();
        else triggerCyberPulseEffect();
      }

THEME_ACCENTS = { cyber: '#bb86fc', matrix: '#39ff14', gold: '#ffb700', cyan: '#00ffff' };

  var fxCanvas = document.getElementById('fx-canvas');
  var fxCtx = fxCanvas ? fxCanvas.getContext('2d') : null;
  var vcrBadge = document.getElementById('vcr-badge');
  var cyberVignette = document.getElementById('cyber-vignette');
  var __fxList = [], MAX_FX = 6, __fxLoopId = null;
  function stopCurrentFx() {
    __fxList.length = 0;
    if (vcrBadge) vcrBadge.classList.remove('show');
    if (cyberVignette) cyberVignette.classList.remove('show');
  }
  var isPlayingBeat = false, activeMediaElement = null;
  window.__AW_DEMO_FX_PLAYING = function (on) { isPlayingBeat = !!on; };

  function fxResize() {
    if (!fxCanvas) return;
    var dpr = window.devicePixelRatio || 1;
    fxCanvas.width = window.innerWidth * dpr;
    fxCanvas.height = window.innerHeight * dpr;
  }
  fxResize();
  window.addEventListener('resize', fxResize);

  /* ── the page's ON-SCROLL scanlines: they flare while you scroll, then fade ── */
  var scanlineMode = 'auto', scrollTimeout = null;
  window.addEventListener('scroll', function () {
    if (scanlineMode !== 'auto') return;
    document.body.classList.add('scanlines-active');
    if (scrollTimeout) clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(function () {
      document.body.classList.remove('scanlines-active');
      if (!__fxLoopId && fxCanvas && fxCtx) { fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); fxCanvas.style.opacity = '0'; }
    }, 300);
  }, { passive: true });

  window.__AW_DEMO_FX_MODE = function (m) { scanlineMode = m; };
  window.triggerThemeSplash = triggerThemeSplash;
  return { splash: triggerThemeSplash };
};
</script>

<script id="aw-v5-demo">
(function () {
  'use strict';

  /* ── only on a bare page: this file opened by itself, never the real site ── */
  function standalone() {
    try {
      if (document.querySelector('.retro-hud-bar')) return false;
      if (document.querySelector('.media-item, .showcase-item')) return false;
      if (document.querySelector('audio, video, iframe')) return false;
      if (document.getElementById('ai-warp-canvas') || document.getElementById('color-shift-overlay')) return false;
      return true;
    } catch (e) { return false; }
  }
  var q = /[?&]demo=([01])/.exec(location.search || '');
  var wanted = q ? q[1] === '1' : standalone();
  if (window.__AW_V5_NO_DEMO) wanted = false;
  if (!wanted || !window.AIWarpV5) return;

  var V5 = window.AIWarpV5, CFG = V5.CFG;
  var state = {
    palette: [0, 72.6, 167.6, 230.9, 300, 124],
    audio: { bass: 0.20, mid: 0.15, treble: 0.18, drive: 0.20 },
    audioOn: false, ctx: null, master: null, analyser: null, noise: null,
    bands: null, trackErr: null, target: 'full'
  };

  /* the demo pretends to be the page: palette + audio, nothing else.
     (only installed when the real modules are absent - they always are here)   */
  if (!window.AIWarpV3) {
    window.AIWarpV3 = { status: function () { return { mode: 'demo', palette: state.palette.slice() }; } };
  }
  /* the demo shows the same defaults the _v5 builds ship */
  if (V5.CFG) {
    V5.CFG.FULL_PAGE = true; V5.CFG.BLEED = 0;
    V5.CFG.INTENSITY = 0.78; V5.CFG.HUE_ALPHA = 0.55; V5.CFG.SAT_ALPHA = 0.38;
    V5.CFG.LIGHT_ALPHA = 0.26; V5.CFG.INVERT_MAX = 0.30; V5.CFG.SPREAD = 1.40;
    V5.CFG.WASH_ALPHA = 0.22; V5.CFG.WASH_BLOBS = 2; V5.CFG.BLOBS = 7;
    V5.CFG.PAGE_SCALE = 0.80; V5.CFG.PAGE_LIGHT_SCALE = 0.70; V5.CFG.PAGE_INVERT_SCALE = 0.60;
  }
  if (!window.AIWarpV4) {
    window.AIWarpV4 = { status: function () {
      return { theme: window.__THEME_MODE || 'cyber', intensity: 1, variants: [], variant: '',
               bursts: [], canvasAlpha: null, scan: {}, audio: state.audio };
    } };
  }
  var realReadPalette = AIWarpV3.status;                 /* remembers the stub */
  window.__THEME_MODE = window.__THEME_MODE || 'cyber';

  /* ── tiny DOM helper ── */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'style') n.style.cssText = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  /* ── everything below builds the demo; it runs once <body> exists, because a
        bare fragment file has no body while its scripts are parsing ── */
  function mount() {

  /* ── the mock bar (the ghost's target) ── */
  var bar = el('div', { id: 'aw-demo-bar', class: 'retro-hud-bar' }, [
    el('div', { class: 'aw-demo-left' }, [
      el('span', { class: 'aw-demo-title', text: 'IMORTALIMP.NL // HUE GHOST DEMO' }),
      el('span', { class: 'aw-demo-type', text: 'THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG 0123456789 -- legibility check' })
    ]),
    el('div', { class: 'hud-controls' })
  ]);
  var controls = bar.querySelector('.hud-controls');
  var themeButtons = {};
  [['cyber', 'CYBER'], ['matrix', 'MATRIX'], ['gold', 'VHS GOLD'], ['cyan', 'CYAN']].forEach(function (pair) {
    var th = pair[0];
    var b = el('button', { id: 'btn-' + th, class: 'hud-btn' + (th === 'cyber' ? ' active' : ''), type: 'button', text: pair[1] });
    b.addEventListener('click', function () { applyTheme(th); });
    themeButtons[th] = b;
    controls.appendChild(b);
  });
  /* the media page's bar has one more switch beside the themes; the module adds
     HUE GHOST + GHOST SETTINGS to this same .hud-controls (see setTargets below) */
  var bScan = el('button', { id: 'btn-scanlines', class: 'hud-btn', type: 'button', text: 'SCANLINES: OFF' });
  bScan.addEventListener('click', function () { cycleScanlines(); });
  controls.appendChild(bScan);

  /* ── control panel ── */
  function slider(label, min, max, step, value, apply) {
    var out = el('output', { text: String(value) });
    var input = el('input', { type: 'range', min: min, max: max, step: step, value: value });
    input.addEventListener('input', function () { var v = parseFloat(input.value); out.textContent = String(v); apply(v); });
    return { row: el('div', { class: 'aw-demo-row' }, [el('label', { text: label }), input, out]), input: input, out: out };
  }
  function button(text, fn) { var b = el('button', { class: 'aw-demo-btn', type: 'button', text: text }); b.addEventListener('click', fn); return b; }
  function check(text, on, fn) {
    var i = el('input', { type: 'checkbox' }); i.checked = !!on;
    i.addEventListener('change', function () { fn(i.checked); });
    return el('label', {}, [i, el('span', { text: text })]);
  }

  var sInt   = slider('INTENSITY', 0, 1.5, 0.01, CFG.INTENSITY, function (v) { V5.intensity(v); syncIntensity(v); });
  var sBleed = slider('BLEED (px)', 0, 64, 1, CFG.BLEED, function (v) { CFG.BLEED = v; });
  var sWash  = slider('BLEED WASH', 0, 0.6, 0.01, CFG.WASH_ALPHA, function (v) { CFG.WASH_ALPHA = v; });
  var sSpre  = slider('HUE SPREAD', 0.6, 2.4, 0.05, CFG.SPREAD, function (v) { CFG.SPREAD = v; });
  var sHue   = slider('HUE PEAK', 0, 0.8, 0.01, CFG.HUE_ALPHA, function (v) { CFG.HUE_ALPHA = v; });
  var sSat   = slider('SAT PEAK', 0, 0.8, 0.01, CFG.SAT_ALPHA, function (v) { CFG.SAT_ALPHA = v; });
  var sLight = slider('LIGHT PEAK', 0, 0.8, 0.01, CFG.LIGHT_ALPHA, function (v) { CFG.LIGHT_ALPHA = v; });
  var sInv   = slider('INVERT PEAK', 0, 0.5, 0.01, CFG.INVERT_MAX, function (v) { CFG.INVERT_MAX = v; });
  var sEvery = slider('GHOST EVERY (s)', 3, 30, 1, Math.round((CFG.GHOST_MIN_MS + CFG.GHOST_MAX_MS) / 2000), function (v) {
    CFG.GHOST_MIN_MS = v * 700; CFG.GHOST_MAX_MS = v * 1300;
  });

  /* ── the media page's theme + scanline switchers, reproduced exactly ───────
     The page's four buttons call window.activateTheme(themeClass, themeKey, btn)
     and its SCANLINES button calls window.toggleScanlines(btn). The v4 THEME
     TURBO engine wraps both on boot (see its wrapHooks()), so defining them here

  function drawTestCard() {

    for (var j = 0; j < 8; j++) { g.fillStyle = REV[j]; g.fillRect(j * W / 8, y, W / 8 + 1, h); }

      g.fillRect(k * W / 12, y, W / 12 + 1, h);
    }

    /* colour patch grid — hues at three saturations, so a saturation drain or a

    var HUES = [0, 30, 60, 120, 180, 240, 280, 320];
    var S = [1.0, 0.55, 0.22], L = [0.52, 0.5, 0.47];

    for (var r = 0; r < 3; r++) {

        g.fillRect(c * cellW, y + r * cellH, cellW + 1, cellH + 1);

    }

    g.textAlign = 'left';

    g.font = Math.max(8, Math.round(W * 0.021)) + 'px ui-monospace, Menlo, Consolas, monospace';
    g.fillStyle = '#9fb4c7';
    g.fillText('HUE \u00b7 SATURATION \u00b7 LIGHT \u00b7 INVERSION', W * 0.47, y + h * 0.62);

    g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(W / 2, H / 2, Math.min(W, H) * 0.46, 0, 6.2832); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(W / 2, H * 0.04); g.lineTo(W / 2, H * 0.96); g.stroke();

    g.strokeStyle = 'rgba(255,255,255,0.18)';
    for (var q = 1; q <= 4; q++) {                      /* grid squares */

      g.beginPath(); g.moveTo(W / 2 - step, H / 2 - step); g.lineTo(W / 2 + step, H / 2 - step);
      g.lineTo(W / 2 + step, H / 2 + step); g.lineTo(W / 2 - step, H / 2 + step); g.closePath(); g.stroke();

  /* ── one 16th-note step of whichever track is loaded ─────────────────────── */
  function scheduleStep(n, t) {
    var st = n % 16, id = TRACKS[ENG.track].id;
    if (id === 'sub') {                       /* bass-heavy */
      if (st % 4 === 0) vKick(t, 48, 118, 0.30, 1.0);
      if (st % 4 === 2) vSub(t, 36.7, 0.44, 0.85);
      if (st % 8 === 6) vNoise(t, 0.04, 0.14, 7000, 13000);
      if (st === 14) vTone('sawtooth', t, 55, 0.30, 0.10, 420);

      vArp(t, [880, 1108.7, 1318.5, 1760][st % 4] * (st < 8 ? 1 : 1.5), 0.13, 0.16);
      vNoise(t, 0.03, 0.19, 9000, 16000);
      if (st % 8 === 5) vTone('triangle', t, 2093, 0.06, 0.12, 0);
      if (st === 0) vTone('sine', t, 1760, 0.35, 0.07, 0);
    } else if (id === 'sparse') {             /* sparse */
      if (st === 0) { vKick(t, 50, 120, 0.30, 0.70); vPad(t, [220, 277.2, 330], 1.1, 0.055); }
      if (st === 6) vPad(t, [196, 246.9, 293.7], 0.9, 0.045);
      if (st === 10) vNoise(t, 0.10, 0.11, 3000, 9000);
      if (st === 14) vTone('triangle', t, 587, 0.16, 0.08, 0);

      if (st % 4 === 0) vKick(t, 52, 130, 0.26, 1.0);
      if (st % 4 === 2) vNoise(t, 0.11, 0.26, 1800, 7000);
      if (st % 2 === 1) vNoise(t, 0.025, 0.13, 8000, 16000);
      vSub(t, 41.2, 0.10, 0.42);
      if (st % 8 === 4) vStab([220, 277.2, 330], t, 0.17, 0.095);
    } else {                                  /* breakbeat */
      if (st === 0 || st === 6 || st === 10) vKick(t, 46, 118, 0.24, 0.95);
      if (st === 4 || st === 7 || st === 14) vNoise(t, 0.13, 0.24, 1600, 6200);
      if (st % 2 === 1) vNoise(t, 0.022, 0.12, 9200, 16000);
      if (st % 4 === 3) vSub(t, 36.7, 0.14, 0.5);
      if (st === 12) vTone('square', t, 294, 0.09, 0.08, 1800);

  /* ── the transport: a lookahead scheduler, so timing never rides on rAF ──── */

      ENG.nextTime += spb;

    ENG.nextTime = c.currentTime + 0.06;
    ENG.timer = setInterval(enginePump, 25);
    state.audioOn = true;
    if (window.__AW_DEMO_FX_PLAYING) window.__AW_DEMO_FX_PLAYING(true);

  }
  function engineStop() {
    ENG.on = false;
    if (ENG.timer) { clearInterval(ENG.timer); ENG.timer = null; }
    state.audioOn = false;
    if (window.__AW_DEMO_FX_PLAYING) window.__AW_DEMO_FX_PLAYING(false);
    bPlay.textContent = 'PLAY TRACK'; bPlay.classList.remove('aw-on');
  }

  function startBandPolling() {
    if (state.bands) return;

  }
  function readBands() {
    var a = state.analyser; if (!a) return;

    a.getByteFrequencyData(data);

    function band(lo, hi, g) {

      state.audio.mid = band(200, 2000, 1.35);
      state.audio.treble = band(3500, 11000, 2.60);

  }   /* end mount() */

  if (document.body) mount();
